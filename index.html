summary:[{id:'s1',title:'ماده ۱ — تعاریف',body:'- الف ـ عرضه: واگذاری کالا یا ارائه خدمت به غیر، از طریق هر نوع معامله یا عقد قانونی\n- ب ـ واردات: ورود کالا یا خدمت از خارج به قلمرو گمرکی یا مناطق آزاد تجاری ـ صنعتی یا مناطق ویژه اقتصادی\n- پ ـ صادرات: صدور کالا یا خدمت به خارج از کشور\n- ت ـ مالیات و عوارض فروش: متعلق به عرضه کالاها و خدمات مشمول، توسط مؤدی در یک دوره معین\n- ث ـ مالیات و عوارض خرید: متعلق به خرید کالاها و خدمات مشمول برای فعالیت‌های اقتصادی مؤدی در یک دوره معین\n- ج ـ مالیات بر ارزش افزوده: مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره معین\n- چ ـ عوارض: مبالغی که به موجب این قانون به همراه مالیات برای شهرداری‌ها و دهیاری‌ها وضع می‌شود؛ هرجا مراد نوع دیگری از عوارض باشد (مثل عوارض واحدهای آلایندگی و عوارض سالانه خودرو) به صراحت بیان شده است\n- ح ـ مؤدی: شخصی که به عرضه کالا، ارائه خدمت، واردات یا صادرات مبادرت می‌نماید\n- خ ـ دوره مالیاتی: هر سه ماه، منطبق بر فصول سال شمسی\n- د ـ اعتبار مالیاتی: مالیات و عوارضی که مؤدی بابت خرید کالا (نهاده و کالای نهائی) یا خدمت به موجب این قانون پرداخت کرده است\n- ذ ـ معافیت مالیاتی: عدم تعلق مالیات و عوارض این قانون بر کالاها و خدمات\n- ر ـ قانون مالیات‌های مستقیم: مصوب ۱۳۶۶/۱۲/۳ و اصلاحات بعدی\n- ز ـ سازمان: سازمان امور مالیاتی کشور\n- ژ ـ پایانه فروشگاهی: موضوع بند «ب» ماده ۱ قانون پایانه‌های فروشگاهی و سامانه مؤدیان مصوب ۱۳۹۸/۰۷/۲۱\n- س ـ سامانه مؤدیان: موضوع بند «پ» ماده ۱ همان قانون',warn:'در سربرگ فایل «تاریخ لازم‌الاجرا» ۱۴۰۰/۱۰/۱۰ آمده، اما ماده ۵۷ می‌گوید قانون شش ماه پس از ابلاغ به رئیس‌جمهور لازم‌الاجراست؛ خودم تطبیق نداده‌ام.'},
{id:'s2',title:'مواد ۲ و ۳ — قلمرو و تاریخ تعلق',body:'- ماده ۲: عرضه کالا و خدمات در ایران و واردات و صادرات آنها از نظر مالیات و عوارض مشمول این قانون است\n- تبصره ۱: کالا و خدمات مشمول که توسط مؤدیان حقیقی خریداری، تحصیل یا تولید و برای مصارف شخصی برداشته شود، عرضه کالا به خود و مشمول مالیات و عوارض است؛ اگر برای استفاده شغلی باشد مشمول نیست\n- تبصره ۲: معاوضه کالا و خدمات، عرضه کالا و ارائه خدمت از طرف هر یک از متعاملین محسوب می‌شود و مشمول این قانون است\n- ماده ۳: تاریخ تعلق مالیات و عوارض، تاریخ صدور صورتحساب مطابق مقررات است\n- تبصره ماده ۳: قبوض آب، برق، گاز و مخابرات چون سند فروش کالا یا خدمت‌اند، در حکم صورتحساب هستند',warn:''},
{id:'s3',title:'ماده ۴ — پرداخت و تبصره‌ها',body:'- مؤدی حداکثر تا پایان ماه پس از انقضای هر دوره مالیاتی، کل مالیات و عوارض فروش آن دوره را پس از کسر اعتبار مالیاتی (به ترتیب سازمان و با رعایت تبصره ۲) می‌پردازد\n- تبصره ۱: اصل بر نقدی‌بودن معاملات است؛ نسیه‌بودن فقط وقتی که در سامانه ثبت و به تأیید طرفین رسیده باشد؛ معامله یا قرارداد ثبت‌نشده، نقدی تلقی می‌شود\n- تبصره ۲: در معاملات غیرنقدی (فروش اقساطی، اجاره به شرط تملیک، قراردادهای پیمانکاری و مشاوره‌ای) تاریخ تعلق همان تاریخ صدور صورتحساب است؛ اما مؤدی می‌تواند پرداخت مالیات را تا زمان پرداخت ثمن یا مبلغ قرارداد توسط خریدار یا کارفرما، متناسباً به تأخیر بیندازد و جریمه‌ی تأخیر نمی‌شود؛ تا آن زمان اعتبار مالیاتی هم برای خریدار منظور نمی‌شود\n- تبصره ۳: کارفرمایان موضوع ماده ۵ قانون مدیریت خدمات کشوری و ماده ۲۹ قانون برنامه ششم باید علاوه بر ثبت قرارداد، همه‌ی پرداخت‌ها به پیمانکار را در سامانه ثبت کنند و همزمان با هر پرداخت، مالیات و عوارض متناسب را بپردازند؛ در صورت خودداری، سازمان از طریق عملیات اجرائی از کارفرما وصول و اصل مالیات را به حساب پیمانکار منظور می‌کند\n- تبصره ۴: پیمانکاران و مهندسان مشاور می‌توانند با اوراق تسویه خزانه و اوراق مالی اسلامی (با دریافت مستقیم از دولت) مالیات و عوارض خود را تسویه کنند؛ سازمان به ارزش تنزیل‌شده می‌پذیرد، و معادل سهم عوارض را از وصولی‌های جاری به حساب شهرداری‌ها و دهیاری‌ها منظور می‌کند\n- تبصره ۵: اگر وجه واردات خدمت در دوره‌های بعد پرداخت شود، مالیات و عوارض آن هم در همان دوره پرداخت می‌شود',warn:''},
{id:'s13',title:'مواد ۵ و ۶ — مأخذ',body:'- ماده ۵: مأخذ مؤدیان عضو سامانه، ارزش فروش مندرج در صورتحساب الکترونیکی ثبت‌شده در سامانه است\n- تبصره ۱: برای غیرعضو و مؤدی متخلف موضوع ماده ۹ قانون پایانه‌ها، مأخذ ارزش روز کالا یا خدمت در زمان تعلق است که سازمان بر اساس اطلاعات سامانه، استعلام از مراجع ذی‌صلاح یا کارشناس یا هیأت کارشناسی تعیین می‌کند؛ سازمان می‌تواند از دفاتر، اسناد و مدارک (الکترونیکی یا غیرالکترونیکی) استفاده کند و مؤدی مکلف به ارائه است\n- تبصره ۲: جزء مأخذ نیست: الف) انواع تخفیفات اعطائی؛ ب) مالیات و عوارض این قانون که قبلاً پرداخت شده؛ پ) سایر مالیات‌های غیرمستقیم و عوارض موضوع قوانین دیگر؛ ت) وجوهی که به موجب سایر قوانین به درآمد عمومی یا شهرداری‌ها واریز می‌شود؛ ث) کمک‌های شهرداری‌ها و دهیاری‌ها به سازمان‌های غیرانتفاعی وابسته (مشروط به محاسبه‌نشدن مالیات در آن)؛ ج) یارانه‌ی دولت برای جبران قیمت کالاهای مشمول قیمت‌گذاری (مشروط به محاسبه‌نشدن مالیات فروش در آن)؛ چ) وجوهی که از ردیف‌های بودجه‌ای بین شرکت‌های تابعه جابه‌جا می‌شود، مشروط بر آنکه بابت خرید یا فروش کالا و خدمات نباشد\n- ماده ۶: مأخذ واردات، مجموع ارزش گمرکی (ماده ۱۴ قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲) و حقوق ورودی (حقوق گمرکی و سود بازرگانی) است؛ مالیات و عوارض این قانون جزء حقوق ورودی نیست',warn:''},
{id:'s14',title:'مواد ۷ و ۸ — نرخ و اعتبار مالیاتی',body:'- ماده ۷: نرخ مالیات و عوارض ۹٪ است، به‌جز کالاهای خاص ماده ۲۶\n- ماده ۸: مالیات و عوارض پرداختی برای خرید کالا و خدمات مورد نیاز فعالیت اقتصادی، اعتبار مالیاتی است و از مالیات فروش کسر می‌شود؛ مازاد به دوره‌های بعد منتقل می‌شود؛ در صورت درخواست استرداد، سازمان حداکثر ظرف یک ماه از ثبت درخواست و از وصولی‌های جاری مسترد می‌کند، وگرنه خسارت ۲٪ در ماه؛ متخلفین با درخواست مؤدی و رأی هیأت رسیدگی به تخلفات اداری به مجازات بند «د» ماده ۹ قانون رسیدگی به تخلفات اداری (۱۳۷۲/۹/۷) محکوم می‌شوند\n- تبصره ۱: مالیات خرید نهاده‌های طرح‌های تملک دارایی سرمایه‌ای (عمرانی) دولت قابل استرداد نیست و جزء بهای تمام‌شده منظور می‌شود\n- تبصره ۲: مؤدی که فقط کالا و خدمات معاف عرضه کند یا کالا و خدمات او مشمول نباشد، مالیات خرید نهاده‌ها قابل تهاتر یا استرداد ندارد\n- تبصره ۳: در عرضه‌ی توأم کالا و خدمات مشمول و معاف، فقط مالیات خرید نهاده‌های مورد نیاز تولید مشمول، قابل کسر، تهاتر یا استرداد است\n- تبصره ۴: مالیات خرید ماشین‌آلات خطوط تولید، چه مؤدی معاف باشد چه مشمول، قابل کسر، تهاتر و استرداد است\n- تبصره ۵: بخشی که قابل تهاتر یا استرداد نیست، هزینه‌ی قابل قبول قانون مالیات‌های مستقیم است\n- تبصره ۶: با رعایت تبصره‌های ۲ و ۴، سازمان مالیات پرداختی واحدهای تولیدی یا معدنی دارای مجوز تأسیس را که در دوره‌های قبل از بهره‌برداری برای تأسیس و راه‌اندازی پرداخت کرده‌اند، مسترد می‌کند\n- تبصره ۷: مالیات پرداختی شهرداری‌ها و دهیاری‌ها برای وظایف و خدمات قانونی، قابل تهاتر یا استرداد است\n- تبصره ۸: مالیات پرداختی سفارتخانه‌ها، مأموریت‌های دیپلماتیک، پست‌های کنسولی و کارکنان غیرایرانی آنها (به شرط عمل متقابل) و دفاتر سازمان‌های بین‌المللی و اعضای مقیم آنها (اتباع غیرایرانی)، با اسناد و مدارک مثبته قابل استرداد است؛ نحوه‌ی استرداد را وزارتخانه‌های امور خارجه و اقتصاد (سازمان) تصویب می‌کنند',warn:''},
{id:'s15',title:'ماده ۹ بند «الف» — کالاهای معاف',body:'- جزء ۱: کلیه محصولات کشاورزی فرآوری‌نشده (محصولات خام زراعی و باغی، گیاهان دارویی، مرتعی، جنگل از جمله چوب خام، محصولات گلخانه از جمله سبزی، صیفی، گل و گیاه و انواع قارچ)\n- تبصره: بسته‌بندی، انبارداری و نگهداری در سردخانه، انجماد، پاک‌کردن، درجه‌بندی، بوجاری بذور، پوست‌گیری مانند شالی‌کوبی، شستشو، تمیزکاری، تفکیک، همگن‌سازی، خشک‌کردن (مثل چای، کشمش، خرما)، تفت‌دادن (مثل پخت نخود) و پنبه‌پاک‌کنی، فرآوری محسوب نمی‌شود؛ ارائه این خدمات به محصولات کشاورزی مشمول مالیات فروش نیست\n- جزء ۲: دام زنده و خوراک آن، مواد اصلی تولید مثل دام زنده طبق پروانه‌ی وزارت جهاد کشاورزی، پوسال (کمپوست)، کشت بافت و بستر آماده‌ی کشت بافت (دام: چهارپایان، پرندگان، آبزیان و حشرات برای تغذیه، فعالیت اقتصادی، تولیدی و آزمایشگاهی)\n- جزء ۳: بذر، نشاء، نهال، سم و کود — جزء ۴: آب مصارف کشاورزی\n- جزء ۵: شیر، پنیر و ماست؛ تخم ماکیان؛ آرد و نان؛ انواع گوشت و فرآورده‌های گوشتی طبق فهرست سالانه‌ی وزارت بهداشت (ارسال تا پایان دی‌ماه برای سال بعد)؛ برنج، حبوبات، سویا و پروتئین سویا؛ انواع روغن‌های خوراکی گیاهی و حیوانی؛ شیرخشک مخصوص تغذیه‌ی کودکان؛ تخم مرغ نطفه‌دار و تبدیل آن به جوجه‌ی یک‌روزه\n- جزء ۶: خمیر کاغذ و کاغذ باطله، دفتر تحریر، کاغذ چاپ، تحریر و روزنامه\n- جزء ۷: نسخه‌های کاغذی و الکترونیکی کتاب، روزنامه، مجله و نشریه\n- جزء ۸: کالاهای وارده همراه مسافر برای استفاده‌ی شخصی تا میزان معافیت قانون امور گمرکی\n- جزء ۹: شمش طلا (وارداتی و داخلی) و حواله‌های کاغذی یا الکترونیکی با پشتوانه‌ی ۱۰۰٪ طلا\n- جزء ۱۰: دارایی‌های غیرمنقول و حواله‌های مبتنی بر آنها\n- جزء ۱۱ و ۱۲: انتقال دارایی به/از صندوق‌های سرمایه‌گذاری پروژه (به‌عنوان آورده‌ی غیرنقد شرکا) و شرکت‌های فرعی آنها (با شرایط تبصره)، و انتقال دارایی از/به نهاد واسط (قانون توسعه ابزارها و نهادهای مالی جدید)\n- جزء ۱۳: فرش دستباف و مواد اولیه‌ی اصلی آن — جزء ۱۴: صنایع دستی تولید داخل طبق فهرست پیشنهادی وزارت میراث فرهنگی (تا پایان دی‌ماه) و تصویب وزیر اقتصاد\n- جزء ۱۵: انواع دارو و واکسن (انسانی و دامی)، لوازم مصرفی درمانی و لوازم توانبخشی\n- جزء ۱۶: رادار و تجهیزات کمک ناوبری هوانوردی، تجهیزات نظامی و اطلاعاتی موضوع بندهای «پ»، «ت» و «ث» ماده ۱۱۹ قانون امور گمرکی (بند «پ» در حوزه‌ی دفاعی با تأیید وزارت دفاع)\n- جزء ۱۷: تجهیزات و اقلام با کاربرد صرفاً دفاعی، نظامی، انتظامی، امنیتی و اطلاعاتی؛ فهرست با پیشنهاد وزارت دفاع و تصویب هیأت وزیران\n- تبصره ۱ (واردات): جزءهای ۲، ۶، ۷، ۹، ۱۳، ۱۶ و ۱۷ در واردات معاف‌اند؛ جزءهای ۱، ۳ و ۵ در واردات معاف نیستند و در مبادی گمرکی با نرخ ۹٪ مشمول‌اند؛ عرضه‌ی داخلی این کالاها مانند مشابه داخلی معاف است؛ جزء ۱۵: اگر وزیر بهداشت تأیید کند مشابه داخلی ندارد، واردات معاف است؛ اگر واردات به‌دلیل کمبود تولید داخل ضروری باشد، با رعایت قانون حداکثر استفاده از توان تولیدی و خدماتی کشور، ۳٪ در مبادی گمرکی\n- تبصره ۲: درج برچسب معافیت از مالیات بر ارزش افزوده روی بسته‌بندی الزامی است؛ سازمان باید فهرست معافیت‌ها را اطلاع‌رسانی و امکان گزارش مردمی و استرداد مبالغ اضافه‌دریافتی را فراهم کند؛ دریافت مالیات از کالا و خدمات معاف: جریمه‌ی دو برابر مالیات دریافتی و غیرقابل بخشودگی؛ سازمان حداکثر سه ماه پس از گزارش، تأیید یا رد و استرداد می‌کند؛ دستورالعمل نحوه‌ی استرداد حداکثر پس از سه ماه از لازم‌الاجراشدن قانون با همکاری اتاق بازرگانی تهیه و به تصویب وزیر اقتصاد می‌رسد\n- تبصره ۳: واردات کالاهای اهدایی بلاعوض به هلال احمر، اورژانس کشور، بهزیستی، آستان‌های مقدسه، کمیته امداد (با تأیید وزیر اقتصاد)، حوزه‌های علمیه (با تأیید مرکز مدیریت حوزه‌ی علمیه‌ی استان) و مؤسسات خیریه (با اعلام مراجع صادرکننده‌ی مجوز و تأیید وزیر اقتصاد) معاف است\n- تبصره ۴: اعمال معافیت مواد خوراکی منوط به گواهی سلامت محصول از مراجع ذی‌صلاح (سازمان ملی استاندارد، سازمان غذا و دارو) است',warn:'متن منبع تبصره ۱ را برای جزءهای ۱۵ و ۵ با عبارت‌های فشرده آورده؛ نکته‌ی «نرخ ۳٪» فقط برای جزء ۱۵ در شرایط ضرورت واردات است.'},
{id:'s16',title:'ماده ۹ بند «ب» — خدمات معاف',body:'- ۱: خدمات درمانی، تشخیصی و پیشگیری، توانبخشی و حمایتی، و خدمات آرامستان‌ها\n- ۲: خدمات درمانی و پیشگیری دامی و گیاهی، واحدهای ماشینی‌کردن آب کشاورزی، کشت بافت و تولید اندام‌های تکثیری گیاهان\n- ۳: خدمات زینک، چاپ، انتشار روزنامه (کاغذی یا الکترونیکی)، کتاب، نشریه و خدمات نشر و توزیع آنها؛ به‌استثنای مؤسسات کمک‌آموزشی و کنکور و هرگونه تبلیغات کالاها و خدمات داخلی در روزنامه‌ها و نشریات\n- ۴: خدماتی که مابه‌ازای آن حقوق و دستمزد مشمول فصل مالیات بر درآمد حقوق پرداخت می‌شود؛ در شرکت‌های تأمین نیروی انسانی و قراردادهای حجمی (مثل پرستاری و نظافتی) فقط بخش حقوق و دستمزد قرارداد معاف است، مشروط به تأیید سازمان بیمه‌گر\n- ۵: عملیات و خدمات بانکی (دریافت سپرده، اعطای تسهیلات یا ایجاد اعتبار، ضمانت‌نامه و انتقال وجه) در چهارچوب مصوبات شورای پول و اعتبار\n- ۶: خدمات اعتباری قرض‌الحسنه‌ی صندوق‌های دارای مجوز بانک مرکزی یا مراجع مورد تأیید آن، و صندوق‌های قرض‌الحسنه‌ی قانونی\n- ۷: اعطای تسهیلات توسط صندوق‌های حمایتی، ضمانت صادرات، سرمایه‌گذاری، بیمه‌ای و پژوهش و فناوری که قانونی تأسیس شده‌اند\n- ۸: بیمه‌های زندگی، بیمه‌ی محصولات کشاورزی، بیمه‌ی اجتماعی و درمان تکمیلی\n- ۹: خدمات بازار سرمایه (معاملات و تسویه اوراق بهادار و کالا در بورس‌ها و خارج از بورس به تشخیص شورای‌عالی بورس)\n- ۱۰: انتشار و نقل و انتقال سهام، حق تقدم، سهم‌الشرکه و سایر اوراق بهادار — ۱۱: صدور، ابطال و نقل و انتقال واحدهای سرمایه‌گذاری صندوق‌های دارای مجوز بورس\n- ۱۲: منحصراً سود تسهیلات اعطائی شرکت‌های لیزینگ دارای مجوز بانک مرکزی؛ مالیات بهای دارایی‌ها و اموال واگذارشده در قرارداد لیزینگ معاف نیست\n- ۱۳: حمل‌ونقل بار و مسافر درون‌شهری، برون‌شهری و بین‌المللی جاده‌ای، ریلی و دریایی\n- ۱۴: خدمات آموزشی، پژوهشی و ورزشی دارای مجوز طبق آیین‌نامه‌ای که ظرف شش ماه از ابلاغ قانون تهیه و به تصویب هیأت وزیران می‌رسد\n- ۱۵: خدمات اقامتی هتل‌های سه ستاره و پایین‌تر، مهمان‌پذیرها و مراکز اقامتی دارای مجوز وزارت میراث فرهنگی یا اتحادیه‌های ذی‌ربط\n- ۱۶: قدرالسهم هزینه‌ی مشترک (شارژ) شرکت‌های خدماتی شهرک‌های صنعتی از واحدهای مستقر در آن\n- ۱۷: خدمات فنی، بازسازی، تعمیر و نگهداری کالاهای جزء ۱۷ بند «الف» توسط مراکز وابسته به دستگاه‌های نظامی، انتظامی و امنیتی طبق فهرست مصوب وزرای دفاع و اقتصاد\n- تبصره‌ی پایانی ماده ۹: دریافت وجهی که مستند به فروش کالا یا ارائه‌ی خدمت نیست (خسارت، درآمد تسعیر ارز، انواع سود، جریمه‌ای که بخشی از بهای کالا و خدمت نیست، آورده‌ی نقدی یا غیرنقدی به‌عنوان سرمایه، کمک‌های دولتی) عرضه‌ی خدمت نیست و مأخذ مالیات و عوارض نمی‌باشد',warn:'در متن منبع، تبصره‌ی پایانی بدون شماره و پس از جزء ۱۷ بند «ب» آمده؛ این‌که حکم عمومی ماده ۹ باشد را خودم تعیین نکرده‌ام.'},
{id:'s5',title:'ماده ۱۰ — صادرات و معافیت با استرداد',body:'- موارد زیر معاف‌اند و مالیات و عوارض خرید نهاده‌های آنها مسترد می‌شود:\n- بند الف: صادرات کالا از مبادی خروجی رسمی با پروانه‌ی سبز گمرکی صادره از گمرک یا برگ خروجی؛ صادرات خدمات با قرارداد مربوط و گواهی انجام کار تأییدشده توسط نزدیک‌ترین نمایندگی رسمی جمهوری اسلامی ایران در کشور مقصد، یا گواهی ارزآوری با تأیید بانک مرکزی، یا سایر اسناد و مدارک مثبته\n- صادرات کالا و خدمات از قلمرو گمرکی سرزمین اصلی به مناطق آزاد تجاری ـ صنعتی خارج از نقاط جمعیتی که تراز تجاری مثبت دارند، در صورتی که محصور بودن آنها سالانه به تأیید گمرک برسد، مشمول این بند است\n- بند ب: خدمات معاوضه (سوآپ) نفت خام، فرآورده‌های نفتی (بنزین، نفت‌گاز، نفت کوره، نفت سفید، گاز مایع و سوخت هوایی)، گاز طبیعی و برق\n- بند پ: فروش همه‌ی کالاها در قالب گواهی سپرده‌ی کالایی در بهابازارهای (بورس‌های) کالایی\n- تبصره ۱: فروش همه‌ی فرآورده‌های تولیدی شرکت‌های پالایش به‌صورت ارزی (فروش سوخت هوایی به شرکت‌های هواپیمایی خارجی در فرودگاه‌های داخلی)، مرزی (جایگاه‌های نواحی مرزی) و فروش سوخت دارای پروانه‌ی صادراتی گمرک به کشتی‌ها (بنکرینگ)، صادرات محسوب می‌شود\n- تبصره ۲: استرداد مالیات و عوارض خرید برای صادرات مواد خام و مواد اولیه‌ی تولید که در فهرست ماده ۱۴۱ قانون مالیات‌های مستقیم آمده‌اند، ممنوع است\n- تبصره ۳: خدماتی که توسط اشخاص مقیم ایران (حقیقی یا حقوقی ایرانی یا شعب شرکت‌های خارجی مقیم ایران) ارائه شود، چه محل مصرف یا مقصد خدمات داخل یا خارج باشد، اگر مستقیم یا غیرمستقیم ارز حاصل و وارد کشور شود، صادرات محسوب می‌گردد\n- تبصره ۴: اگر کالاهای بند «پ» مشمول مالیات فروش باشند، تحویل‌گیرنده از انبارهای پذیرش‌شده‌ی بهابازارهای کالایی موظف است مالیات و عوارض خرید را بر اساس قیمت اعلامیه‌ی خرید خود با سازمان تسویه کند؛ اعلامیه‌ی خرید در حکم صورتحساب است',warn:''},
{id:'s17',title:'مواد ۱۱ و ۱۲ — مسافران و عضویت اجباری',body:'- ماده ۱۱: مالیات و عوارض پرداختی بابت خرید کالا در داخل ایران که ظرف دو ماه از تاریخ خرید همراه مسافران (ایرانی و خارجی) از کشور خارج می‌شود، و مالیات و عوارض پرداختی گردشگران خارجی بابت بلیط پرواز خارجی خریداری‌شده از شرکت‌های هواپیمایی ایرانی، هنگام خروج با ارائه صورتحساب الکترونیکی یا اسناد مثبته توسط سازمان از محل وصولی‌های جاری مسترد می‌شود\n- آیین‌نامه‌ی اجرائی ماده ۱۱ ظرف شش ماه از ابلاغ قانون توسط سازمان تهیه و به تصویب هیأت وزیران می‌رسد\n- ماده ۱۲: عرضه‌کنندگان کالا و خدمات معاف (به موجب این قانون و سایر قوانین) و فعالان اقتصادی مستقر در مناطق آزاد تجاری ـ صنعتی و مناطق ویژه‌ی اقتصادی که حجم معاملات سالانه‌شان از مبلغ مصوب هیأت وزیران (به پیشنهاد سازمان) بیشتر باشد، مکلف به عضویت و ثبت معاملات در سامانه مؤدیان‌اند؛ حکم شامل همه‌ی مناطق کشور از جمله مناطق آزاد و ویژه است\n- متخلفان علاوه بر جریمه‌ی بند «ب» ماده ۲۲ قانون پایانه‌های فروشگاهی و سامانه مؤدیان، مشمول جریمه‌ای معادل ۹٪ ارزش معاملات ثبت‌نشده در سامانه می‌شوند\n- آیین‌نامه‌ی مناطق آزاد و ویژه ظرف سه ماه پس از ابلاغ قانون به پیشنهاد سازمان و دبیرخانه‌ی شورای‌عالی مناطق آزاد تهیه و به تصویب هیأت وزیران می‌رسد',warn:''},
{id:'s18',title:'مواد ۱۳ تا ۱۶ — سامانه مؤدیان و رسیدگی',body:'- ماده ۱۳: پس از راه‌اندازی سامانه، همه‌ی مشمولان باید طبق ترتیب سازمان در آن ثبت‌نام و معاملات (خرید و فروش) را ثبت کنند؛ این ثبت به منزله‌ی ثبت در دفاتر قانونی است. تا آن زمان، ثبت‌نام، اظهارنامه و رسیدگی طبق قانون مالیات بر ارزش افزوده‌ی مصوب ۱۳۸۷/۰۲/۱۷ و اصلاحات آن است؛ در سایر موارد مفاد این قانون جاری است\n- ماده ۱۴: اگر سازمان در مهلت مقرر در قانون پایانه‌ها نتواند سامانه را مستقر کند، رسیدگی به اظهارنامه‌های بعد از اتمام مهلت را فقط به میزان تبصره محدود کرده و بقیه‌ی اظهارنامه‌ها را بدون رسیدگی می‌پذیرد\n- تبصره: پس از استقرار سامانه، سازمان حداکثر ۱٪ پرونده‌های مؤدیان عضو را با اولویت مؤدیان بزرگ رسیدگی می‌کند؛ نحوه‌ی انتخاب طبق دستورالعمل مصوب وزیر اقتصاد (به پیشنهاد سازمان)؛ سازمان تا پایان مهرماه هر سال فهرست مؤدیان مشمول رسیدگی را در سامانه‌ی عملیات الکترونیکی خود اعلام عمومی می‌کند\n- ماده ۱۵: دستگاه‌های اجرائی موضوع ماده ۵ قانون مدیریت خدمات کشوری و ماده ۲۹ قانون برنامه‌ی ششم و سازمان‌های وابسته، مکلف به ثبت معاملات خود در سامانه‌اند؛ وزارت صنعت، معدن و تجارت باید اطلاعات معاملات ثبت‌شده در سامانه‌ی تدارکات الکترونیکی دولت (تبصره ۵ ماده ۱۶۹ قانون مالیات‌های مستقیم) را عیناً و برخط به سامانه مؤدیان منتقل کند\n- ماده ۱۶: ارائه اسناد، دفاتر و مدارک، ثبت قراردادهای پیمانکاری و معاملات و اطلاعات نیروهای مسلح، وزارت دفاع و سایر دستگاه‌های انتظامی، اطلاعاتی و امنیتی در سامانه، و سایر اقلام محرمانه، با رعایت ملاحظات امنیتی و طبق دستورالعملی است که وزارتخانه‌های اقتصاد (سازمان)، اطلاعات و دفاع و ستاد کل نیروهای مسلح تهیه می‌کنند و حداکثر شش ماه پس از لازم‌الاجراشدن قانون به تصویب شورای امنیت کشور می‌رسد',warn:''},
{id:'s6',title:'ماده ۱۷ — وصول مالیات و تبصره‌ها',body:'- مؤدیان مالیات و عوارض فروش را از خریدار یا کارفرما وصول و پس از کسر مالیات و عوارض پرداختی، مطابق مقررات به حساب سازمان واریز می‌کنند\n- تبصره ۱: سازمان می‌تواند همه یا برخی مؤدیان یا مشتریان آنها را مکلف کند مالیات را همزمان با صدور صورتحساب به حساب سازمان واریز کنند؛ آیین‌نامه (فهرست مؤدیان و نحوه‌ی پرداخت) با پیشنهاد سازمان به تصویب وزیر اقتصاد می‌رسد؛ مبلغ پرداختی به حساب بستانکاری فروشنده منظور می‌شود و برای خریدار (اگر مصرف‌کننده‌ی نهائی نباشد) اعتبار مالیاتی است\n- تبصره ۲: گمرک مالیات کالاهای وارداتی را در زمان ترخیص قطعی، و کالاهای متروکه را قبل از ترخیص نهائی وصول و برخط به حساب سازمان واریز می‌کند؛ اطلاعات پرداخت را در پروانه‌های گمرکی درج و دسترسی برخط سازمان را فراهم می‌کند؛ در «ورود موقت» و «ورود موقت برای پردازش» تضمینات لازم را بر اساس تبصره ماده ۵۳ قانون امور گمرکی اخذ می‌کند\n- تبصره ۳: واردکنندگان کالا از مناطق آزاد به سرزمین اصلی باید به گمرک اظهار کنند؛ گمرک از قسمتی که طبق بند «ب» ماده ۶۵ قانون احکام دائمی برنامه‌های توسعه «تولید داخل» محسوب می‌شود فقط مالیات و عوارض، و از قسمت «کالای وارداتی» مالیات و عوارض و حقوق ورودی را دریافت و مالیات و عوارض را به حساب سازمان واریز می‌کند\n- تبصره ۴: واردکنندگان خدمت با رعایت تبصره ۳ ماده ۱۰ مالیات و عوارض را محاسبه و پرداخت می‌کنند؛ اگر محل ارائه و مصرف خدمت خارج از کشور باشد، مشمول این حکم نیستند\n- تبصره ۵: مالیات و عوارض آب، برق و گاز (طبق صورتحساب مصرف‌کنندگان) و نفت تولیدی (نفت خام، میعانات گازی و گاز طبیعی خام) و فرآورده‌های تولیدی و وارداتی، فقط یک‌بار در زمان فروش، در انتهای زنجیره‌ی تولید و توزیع، بر مبنای قیمت فروش مصوب داخلی محاسبه، ثبت و وصول و پس از کسر اعتبارات زنجیره به حساب سازمان نزد خزانه‌داری کل واریز می‌شود؛ آیین‌نامه‌ی آن ظرف شش ماه پس از تصویب قانون با پیشنهاد مشترک سازمان، شرکت ملی نفت و توانیر به تصویب وزیران اقتصاد، نفت و نیرو می‌رسد',warn:''},
{id:'s19',title:'مواد ۱۸ تا ۲۲ — قراردادها، دوره، کارپوشه، تصفیه، انتقال',body:'- ماده ۱۸: کارفرمایان موضوع ماده ۵ قانون مدیریت خدمات کشوری و ماده ۲۹ قانون برنامه‌ی ششم باید اطلاعات قراردادهای پیمانکاری را حداکثر یک ماه پس از انعقاد در سامانه ثبت کنند؛ وگرنه سازمان با رعایت ماده ۹ قانون پایانه‌ها اطلاعات ثبت‌شده توسط پیمانکاران را مورد قبول کارفرما تلقی می‌کند\n- ماده ۱۹: وزیر اقتصاد با پیشنهاد سازمان می‌تواند دوره‌ی مالیاتی هر گروه از مؤدیان را دو یا یک‌ماهه تعیین کند، مشروط به اطلاع‌رسانی حداقل سه ماه قبل از شروع دوره از طریق سامانه، پایگاه سازمان و دست‌کم یک روزنامه‌ی کثیرالانتشار\n- تبصره: اگر شروع یا خاتمه‌ی فعالیت مؤدی در خلال یک دوره باشد، زمان فعالیت او در آن دوره یک دوره‌ی مالیاتی است\n- ماده ۲۰ بند الف: سازمان می‌تواند برای اشخاص حقیقی دارای بیش از یک نوع واحد مشمول در یک یا چند مکان، کارپوشه‌ی واحد ایجاد کند\n- بند ب: مؤدیان دارای واحد در شعب متعدد مکلف به استفاده از یک کارپوشه‌ی واحدند\n- بند پ: در مشارکت‌های مدنی (اختیاری و قهری) اشخاص حقیقی هر واحد شغلی یک نفر را به‌عنوان نماینده انتخاب می‌کنند که همه‌ی تکالیف (ثبت‌نام، ثبت معاملات، پرداخت مالیات) را به نمایندگی شرکا انجام می‌دهد؛ در غیر این صورت سازمان دسترسی واحد به سامانه را قطع و پایانه‌ی فروشگاهی را مسدود می‌کند\n- بند ت: برای مؤدیان بدون مکان ثابت، محل سکونت ملاک است؛ اگر چند محل دارند، یکی را معرفی می‌کنند وگرنه سازمان یکی را انتخاب و اعلام می‌کند\n- ماده ۲۱: شخص حقوقی منحل‌شده تا ختم تصفیه کماکان مؤدی است و مدیر یا مدیران تصفیه مکلف به انجام تکالیف قانون‌اند\n- ماده ۲۲: در انتقال واحد صنفی، دارنده تا اتمام انتقال مسئول همه‌ی تکالیف (از جمله صورتحساب و ثبت معاملات) است؛ خریدار مسئولیتی قبل از اتمام انتقال ندارد مگر به موجب سند رسمی بپذیرد\n- تبصره: انتقال‌دهنده باید حداکثر ظرف ده روز سازمان را از زمان اتمام فعالیت مطلع کند؛ در صورت عدم اطلاع و شروع فعالیت توسط مؤدی جدید، در پرداخت مالیات و جریمه‌ها با او مسئولیت تضامنی دارد',warn:''},
{id:'s9',title:'مواد ۲۳ تا ۲۵ — ساختار و ارتباط با قانون مالیات‌های مستقیم',body:'- ماده ۲۳: ساختار و تشکیلات سازمان در سطح کشور و استان‌ها متناسب با شرایط اقتصادی هر منطقه و شاخص‌هایی مانند میزان وصول، تعداد پرونده‌ها و تعداد مؤدیان، بدون الزام به رعایت سطح تقسیمات کشوری، با رعایت بند «الف» ماده ۲۸ قانون برنامه‌ی ششم، از طریق وزیر اقتصاد به سازمان اداری و استخدامی پیشنهاد و با تصویب هیأت وزیران قابل اجراست\n- ماده ۲۴: پس از استقرار سامانه، فعال‌بودن کارپوشه‌ی مؤدی یعنی از نظر سازمان شرایط دریافت مالیات و عوارض از خریداران را دارد؛ اگر شرایط را از دست بدهد، سازمان باید بلافاصله کارپوشه را غیرفعال کند؛ بانک مرکزی باید ترتیبی دهد که به‌محض غیرفعال‌شدن کارپوشه، همه‌ی دستگاه‌های پایانه‌ی فروشگاهی (pos) مرتبط غیرفعال شوند\n- تبصره: غیرفعال‌کردن کارپوشه باید مستند به آیین‌نامه‌ای باشد که حداکثر ظرف سه ماه پس از ابلاغ قانون با پیشنهاد سازمان به تصویب هیأت وزیران می‌رسد\n- ماده ۲۵ بند الف: موادی از قانون مالیات‌های مستقیم (۱۶۱، ۱۶۲، ۱۶۷، ۱۶۹ مکرر، ۱۷۱، تبصره ۱ ماده ۱۷۷، ۱۷۸، ۱۸۲، ۱۸۶ و تبصره ۱ آن، ۱۹۱، ۱۹۸، ۲۰۲، احکام فصل هشتم باب چهارم، مواد ۲۱۰ تا ۲۱۶، ۲۱۸، ۲۱۹، ۲۳۱، ۲۳۲، ۲۳۵، ۲۴۲، ۲۴۳، احکام فصل سوم باب پنجم، مواد ۲۵۷، ۲۷۴ منهای بند ۳ آن، ۲۷۵، ۲۷۶، ۲۷۷ و ۲۷۹) در مورد این قانون جاری است؛ احکام درآمد مشمول مالیات در این مواد در محاسبه‌ی مأخذ مالیات بر ارزش افزوده هم جاری است؛ احکام فصل سوم باب پنجم در خصوص مواد ۲۹ و ۳۲ این قانون جاری نیست\n- تبصره ۱: شناسایی، تشخیص درآمد مشمول مالیات و رسیدگی موضوع ماده ۲۱۹ ق.م.م برای مؤدیان قابل اعتماد قانون پایانه‌ها جاری نیست (مگر در مواردی که سازمان طبق ماده ۱۴ این قانون و تبصره ۱ ماده ۱۹ قانون پایانه‌ها اجازه‌ی رسیدگی به اظهارنامه دارد)؛ ماده ۲۱۹ نباید مانع اجرای قانون پایانه‌ها شود\n- تبصره ۲: برای مؤدیان عضو سامانه، سازمان اوراق ابلاغ‌شده را در کارپوشه‌ی مؤدی هم بارگذاری می‌کند\n- تبصره ۳: تعداد شعب شورای‌عالی مالیاتی برای رسیدگی به پرونده‌های این قانون دو برابر می‌شود\n- بند ب: در صورت عدم عضویت مؤدیان در سامانه، مواد ۹۷، ۱۶۹، ۱۸۱، ۲۳۰ و بند ۳ ماده ۲۷۴ ق.م.م در مورد مالیات‌های این قانون جاری است؛ تبصره: ماده ۲۷۲ ق.م.م و تبصره‌های آن تا قبل از اتمام مهلت ماده ۳ قانون پایانه‌ها در مورد مالیات‌های این قانون جاری است',warn:''},
{id:'s7',title:'ماده ۲۶ بندهای «الف» و «ب» — کالاهای نفتی، طلا و جواهر',body:'- الف ـ کالاهای نفتی: انواع بنزین و سوخت هواپیما ۳۰٪؛ نفت‌گاز، نفت سفید، نفت کوره، گاز طبیعی و گاز مایع ۱۵٪\n- تبصره ۱: فروش نفت خام، میعانات گازی و گاز طبیعی خام توسط وزارت نفت (شرکت‌های تابعه) به شرکت‌های داخل زنجیره‌ی تولید فرآورده‌های نفتی، و واردات بنزین، سوخت هواپیما و گاز طبیعی توسط وزارت نفت، در آن مرحله مستلزم محاسبه و دریافت مالیات از حلقه‌ی بعدی و پرداخت در مرحله‌ی واردات نیست؛ مالیات فروش فرآورده‌های تولیدشده و بنزین، سوخت هواپیما و گاز وارداتی در مراحل بعدی عرضه محاسبه و وصول می‌شود\n- تبصره ۲: مأخذ مالیات فروش در خرده‌فروشی بنزین و نفت‌گاز توسط شرکت‌های غیردولتی دارای مجوز وزارت نفت، مابه‌التفاوت قیمت خرید از شرکت‌های پالایش (با احتساب مالیات و عوارض) و قیمت عرضه به مصرف‌کننده است؛ این مابه‌التفاوت درآمد ناشی از ارائه‌ی خدمات جایگاه تلقی و با نرخ ماده ۷ مشمول است؛ مالیات پرداختی بابت خرید بنزین و نفت‌گاز برای جایگاه‌داران اعتبار مالیاتی نیست\n- تبصره ۳: مالیات پرداختی بابت این کالاها اگر به‌عنوان مواد اولیه‌ی اصلی واحدهای تولیدی به‌کار رود، اعتبار مالیاتی آنها است؛ مالیات پرداختی واردکنندگان و توزیع‌کنندگان آنها هم اعتبار مالیاتی است\n- تبصره ۴: مالیات خرید نهاده‌های طرح‌های تملک دارایی سرمایه‌ای شرکت ملی نفت قابل استرداد یا تهاتر نیست و جزء بهای تمام‌شده‌ی دارایی است؛ سایر مالیات‌های پرداختی آن شرکت (غیر از تملک دارایی) اعتبار مالیاتی است و با تأیید سازمان با بدهی مالیاتی آن شرکت یا سایر شرکت‌های تابعه‌ی وزارت نفت قابل تهاتر است\n- ب ـ طلا، جواهر و پلاتین: ۱) اصل طلا، جواهر و پلاتین به‌کاررفته در مصنوعات معاف است؛ ۲) اجرت ساخت، حق‌العمل و سود فروشنده ۹٪\n- ۳) پس از راه‌اندازی سامانه، عرضه‌کنندگان باید همه‌ی خرید و فروش را ثبت و ارزش اصل طلا، جواهر و پلاتین، اجرت، حق‌العمل و سود را به تفکیک در صورتحساب الکترونیکی درج کنند؛ کتمان یا عدم ثبت: جریمه‌ی ۹٪ ارزش اصل طلا، جواهر و پلاتین، غیرقابل بخشودگی، علاوه بر جریمه‌ی بند «ب» ماده ۳۶\n- ۴) همه‌ی واحدهای زنجیره‌ی عرضه حداکثر تا دو ماه پس از لازم‌الاجراشدن قانون باید از پایانه‌ی فروشگاهی مورد تأیید سازمان استفاده کنند، وگرنه اتحادیه‌های ذی‌ربط و اتاق اصناف ایران موظف‌اند پروانه‌ی فعالیت آنها را باطل کنند و نیروی انتظامی از ادامه‌ی فعالیت واحدهای فاقد پروانه جلوگیری می‌کند',warn:''},
{id:'s20',title:'ماده ۲۶ بندهای «پ» و «ت» — نوشابه، کالاهای آسیب‌رسان و دخانیات',body:'- پ ـ نوشابه‌های قندی (گازدار و بدون گاز) و سایر کالاهای آسیب‌رسان به سلامت (به‌جز بند ت): تولید داخل ۱۶٪، واردات ۳۶٪\n- فهرست کالاها و واحدهای تولیدکننده حداکثر دو ماه پس از ابلاغ قانون به پیشنهاد وزارت بهداشت و حداکثر یک ماه بعد توسط کارگروهی از نمایندگان تام‌الاختیار وزارتخانه‌های بهداشت، صنعت، معدن و تجارت و اقتصاد تصویب می‌شود؛ تغییرات تا انتهای دی‌ماه هر سال (برای سال بعد) به همین ترتیب تصویب و از سوی وزارت بهداشت اعلام می‌شود؛ در صورت عدم تصویب در مهلت، فهرست پیشنهادی وزارت بهداشت پس از تأیید شورای‌عالی سلامت و امنیت غذایی ملاک عمل است\n- ت ـ سیگار و محصولات دخانی: ۱) سیگار، توتون پیپ و تنباکوی تولید داخل ۲۵٪؛ ۲) تولید داخل با نشان بین‌المللی (فهرست سالانه‌ی وزارت صنعت و تصویب هیأت وزیران) ۴۰٪؛ ۳) وارداتی ۶۵٪؛ ۴) توتون خام وارداتی ۱۰٪؛ ۵) توتون فرآوری‌شده‌ی وارداتی (خرمن توتون) ۳۵٪\n- تبصره ۱: از سال دوم اجرا، نرخ‌ها هر سال پنج واحد درصد افزایش می‌یابد تا نرخ برای سیگار و محصولات دخانی، توتون پیپ و تنباکوی تولید داخل به ۵۵٪، تولید داخل با نشان بین‌المللی به ۹۵٪ و وارداتی به ۱۲۵٪ برسد\n- تبصره ۲: تولیدکنندگان از زمان لازم‌الاجراشدن قانون باید قیمت خرده‌فروشی و تاریخ تولید را روی پاکت درج کنند؛ در صورت تخلف، اعتبار مالیاتی مربوط پذیرفته نمی‌شود و مشمول مالیات و عوارض فروش به نرخ‌های مذکور است',warn:''},
{id:'s21',title:'ماده ۲۷ — عوارض سبز',body:'- واحدهای تولیدی، صنعتی، معدنی و خدماتی آلاینده که به تشخیص سازمان حفاظت محیط‌زیست حدود مجاز را رعایت نمی‌کنند و در مهلت تعیین‌شده آلایندگی را رفع نکنند، بر اساس شدت، مدت، نوع و مکان آلایندگی با نرخ‌های ۰/۵٪، ۱٪ و ۱/۵٪ به مأخذ فروش کالا یا خدمات مشمول عوارض سبز می‌شوند\n- این حکم برای همه‌ی واحدهای آلاینده (معاف و غیرمعاف، صادراتی، و مستقر در مناطق آزاد و ویژه) جاری است\n- معیارهای تعیین سطح آلایندگی حداکثر سه ماه پس از لازم‌الاجراشدن قانون توسط کارگروهی از نمایندگان محیط‌زیست و وزارتخانه‌های بهداشت، صنعت، کشور و اقتصاد تهیه و به تصویب هیأت وزیران می‌رسد؛ میزان فروش بر اساس سامانه یا اظهارنامه‌ی ویژه تعیین می‌شود\n- تبصره ۱: در واحد دارای خطوط تولید مجزا با محصول مستقل، فقط از خطوط آلاینده عوارض دریافت می‌شود\n- تبصره ۲: واحدی که در قبال کارمزد مشخص تولید کند، درآمد ناشی از آن تولید با پنج برابر نرخ‌ها مشمول است؛ شرکت‌های زنجیره‌ی بنزین، سوخت هواپیما، نفت سفید، نفت کوره، نفت‌گاز، گاز طبیعی و برق مستثنی‌اند و قیمت فروش به مصرف‌کننده‌ی نهائی مبنای عوارض آنها است که شرکت‌های بالادستی متضامناً مسئول پرداخت‌اند\n- تبصره ۳: محیط‌زیست حداکثر ظرف شش ماه پایگاه اطلاعاتی واحدهای آلاینده را با دسترسی برخط سازمان مالیاتی ایجاد و مستمراً به‌روز می‌کند\n- تبصره ۴: درج نام واحد یا افزایش سطح آلایندگی: مشمولیت یا افزایش نرخ از ابتدای دوره‌ی مالیاتی بعد\n- تبصره ۵: حذف نام واحد یا کاهش سطح آلایندگی: معافیت یا کاهش نرخ از ابتدای همان دوره\n- تبصره ۶: محیط‌زیست حداکثر ظرف یک ماه از درخواست واحد باید درباره‌ی رفع یا کاهش آلایندگی اعلام نظر کند؛ در صورت عدم اعلام نظر، واحد خودکار از فهرست خارج می‌شود\n- تبصره ۷: سرمایه‌گذاری برای رفع یا کاهش آلایندگی، در صورت تأیید محیط‌زیست از بدهی عوارض آن واحد کسر می‌شود؛ اگر منجر به رفع یا کاهش نشود هزینه‌ی قابل قبول مالیاتی است\n- تبصره ۸: برای پالایشگاه‌ها و نیروگاه‌هایی که با درخواست دولت در مقاطعی ناچار به استفاده از نفت کوره و نفت‌گاز می‌شوند، افزایش آلایندگی ناشی از آن مطابق قبل از الزام محاسبه می‌شود\n- تبصره ۹: اعلام محیط‌زیست فقط برای دوره‌های بعد از ثبت در سامانه معتبر است و برای دوره‌های ثبت‌شده، اصلاح یا تصحیح اشتباه مجاز نیست\n- تبصره ۱۰: یارانه‌ی پرداختی دولت موضوع بند «ج» تبصره ۲ ماده ۵ جزء مأخذ عوارض سبز نیست\n- تبصره ۱۱: مؤدیان این ماده اظهارنامه‌ی هر دوره را حداکثر تا پایان ماه پس از دوره تسلیم و عوارض را همان مهلت واریز می‌کنند؛ عدم تسلیم: جریمه‌ی غیرقابل بخشودگی ۱۰٪ عوارض؛ تأخیر در پرداخت: جریمه‌ی ماده ۳۷؛ واحدهای عضو سامانه نیازی به اظهارنامه ندارند و سازمان بر اساس فروش ابرازی در سامانه وصول می‌کند',warn:''},
{id:'s10',title:'ماده ۲۸ — مالیات و عوارض سبز شماره‌گذاری خودرو',body:'- شماره‌گذاری خودروهای سبک و سنگین و موتورسیکلت بر اساس رتبه‌ی انرژی (تأییدشده توسط سازمان ملی استاندارد) طبق جدول زیر (ارقام به درصد) مشمول مالیات و عوارض سبز است\n- مأخذ: قیمت فروش کارخانه برای تولید داخل؛ مجموع ارزش گمرکی و حقوق ورودی برای وارداتی\n- تبصره ۱: مأخذ تا پایان دی‌ماه توسط سازمان تعیین و برای سال بعد اعلام می‌شود؛ برای وسائط نقلیه‌ی تازه تولید یا وارد‌شده بلافاصله پس از تولید یا واردات تعیین و اعلام می‌شود\n- تبصره ۲: خودروها و موتورسیکلت‌های برقی و تمام برقی (هیبرید پلاگین) به تشخیص وزارت صنعت، معدن و تجارت مشمول نیستند\n- تبصره ۳: وزارت صنعت ظرف سه ماه از ابلاغ قانون با همکاری محیط‌زیست و استاندارد فهرست همه‌ی خودروها و موتورسیکلت‌ها را با رتبه‌ی انرژی درج‌شده در برچسب، برخط به سازمان اعلام و برای عموم منتشر می‌کند\n- تبصره ۴: خودروی فاقد برچسب انرژی مورد تأیید استاندارد، مصداق ردیف G است\n- تبصره ۵: اشخاص حقوقی واردکننده و تولیدکننده اظهارنامه‌ی ماهانه و مشخصات دقیق وسائط فروخته‌شده را حداکثر تا پانزدهم ماه بعد تسلیم و مالیات را می‌پردازند؛ عدم پرداخت در مهلت: جریمه‌ی غیرقابل بخشودگی ۱۰٪ مالیات؛ تأخیر: جریمه‌های ماده ۳۷\n- تبصره ۶: اشخاص حقیقی واردکننده قبل از شماره‌گذاری، با مراجعه به ادارات مالیاتی مالیات را می‌پردازند؛ شماره‌گذاری وسائط متعلق به دولت و نیروهای نظامی و انتظامی هم مشمول است\n- تبصره ۷: نیروی انتظامی (راهنمایی و رانندگی) قبل از شماره‌گذاری وسائط وارداتی اشخاص حقیقی گواهی پرداخت را بررسی و از شماره‌گذاری موارد پرداخت‌نشده خودداری می‌کند',tbl:'رتبه انرژی|سواری و دوکابین داخلی|سواری و دوکابین وارداتی|تک‌کابین و عمومی داخلی|تک‌کابین و عمومی وارداتی|سنگین داخلی|سنگین وارداتی|موتورسیکلت داخلی|موتورسیکلت وارداتی\nA|۰|۰|۰|۰|۰|۰|۰|۰\nB|۰|۰|۰|۰|۰|۰|۰|۰\nC|۰/۵|۱|۰/۲|۰/۴|۰|۰|۰/۲۵|۰/۵\nD|۱|۳|۰/۴|۰/۸|۰/۱|۰/۲|۰/۵|۱/۵\nE|۲|۵|۰/۸|۱/۶|۰/۲|۰/۴|۱|۲/۵\nF|۳|۷|۱/۲|۲/۴|۰/۴|۰/۶|۱/۵|۳/۵\nG|۵|۹|۱/۵|۳|۰/۶|۰/۸|۲/۵|۵',warn:'عبارت «برقی و تمام برقی (هیبرید پلاگین)» در تبصره ۲ ماده ۲۸ در متن منبع مبهم است (هیبرید پلاگین تمام‌برقی نیست)؛ عیناً آورده شد و تفسیر نشد.'},
{id:'s22',title:'ماده ۲۹ — عوارض سالانه‌ی وسائط نقلیه',body:'- بند الف: تولید داخل یک در هزار قیمت فروش کارخانه؛ وارداتی یک و نیم در هزار مجموع ارزش گمرکی و حقوق ورودی (مأخذ تبصره ۱ ماده ۲۸)\n- بند ب (آلایندگی): وسائط نقلیه در شهرهای آلوده تا ده سال پس از تولید، با همان مأخذ و معادل یک بیستم نرخ‌های جدول ماده ۲۸، علاوه بر عوارض بند «الف» مشمول‌اند؛ پس از سال دهم هر سال ۱۰٪ به نرخ پایه اضافه می‌شود تا حداکثر دو برابر\n- وسائطی که نرخ آلایندگی‌شان در جدول صفر است، تا پنج سال پس از سال تولید معاف‌اند؛ سپس سنگین با یک دهم نرخ‌های ردیف D و سایر با یک دهم نرخ‌های ردیف C جدول مشمول‌اند\n- برای خودروهای متوقف‌شده‌ی تولید یا واردات، مأخذ را سازمان متناسب با آخرین سال تعیین می‌کند؛ فهرست شهرهای آلوده تا پایان دی‌ماه هر سال با پیشنهاد محیط‌زیست و تصویب هیأت وزیران برای سال بعد تعیین می‌شود\n- تبصره ۱: وزارت کشور سامانه‌ی الکترونیک متمرکز برای پرداخت و صدور مفاصاحساب و استعلام برخط برای نیروی انتظامی و دفاتر اسناد رسمی ایجاد می‌کند\n- تبصره ۲: پرداخت با مالک است و تا پایان همان سال؛ در صورت تغییر مالکیت، از سال انتقال با مالک جدید است\n- تبصره ۳: خودروی دارای گواهی اسقاط در سال اسقاط مشمول عوارض بند «ب» نیست\n- تبصره ۴: همه‌ی وسائط نقلیه، قبل یا بعد از لازم‌الاجراشدن قانون شماره‌گذاری شده باشند، مشمول‌اند\n- تبصره ۵: ثبت سند انتقال یا تعویض پلاک منوط به تسویه‌ی عوارض بندهای «الف» و «ب» وسیله‌ی مورد معامله و سایر وسائط انتقال‌دهنده و انتقال‌گیرنده است\n- تبصره ۶: پرداخت هر سال تا پایان همان سال: ۲۰٪ تخفیف\n- تبصره ۷: پرداخت پس از موعد: جریمه‌ی غیرقابل بخشودگی ۱۰٪؛ تأخیر بیش از یک ماه: علاوه بر آن، ۲٪ عوارض سالانه به ازای هر ماه تأخیر\n- تبصره ۸: عدم پرداخت پنج سال از سال مالکیت، یا بدهی بیش از ۵٪ نصاب معاملات کوچک (جزء ۱ ماده ۳ قانون برگزاری مناقصات ۱۳۸۳/۱/۲۵): نیروی انتظامی بر اساس فهرست وزارت کشور وسیله را تا پرداخت بدهی توقف می‌کند\n- تبصره ۹: نیروی انتظامی و شهرداری‌ها دسترسی برخط پایگاه اطلاعات وسائط نقلیه را برای وزارت کشور فراهم می‌کنند\n- تبصره ۱۰: وزارت کشور اطلاع‌رسانی (از جمله پیامک) درباره‌ی وظایف مالکان انجام می‌دهد\n- تبصره ۱۱: آیین‌نامه‌ی اجرائی ظرف سه ماه از ابلاغ با پیشنهاد وزارت کشور به تصویب هیأت وزیران می‌رسد',warn:''},
{id:'s23',title:'مواد ۳۰ تا ۳۵ — نقل و انتقال، خروج از کشور، بلیط و سامانه',body:'- ماده ۳۰: نقل و انتقال خودرو و موتورسیکلت (به‌جز ماشین‌های راه‌سازی، کارگاهی، معدنی، کشاورزی و شناورها): تولید داخل ۱٪ و وارداتی ۲٪ به مأخذ تبصره ۱ ماده ۲۸ برای سال تولید؛ مأخذ تا شش سال پس از سال تولید سالانه ۱۰٪ کاهش می‌یابد و برای سال ششم به بعد ۴۰٪ مأخذ است\n- تبصره ۱: ثبت سند انتقال یا تعویض پلاک منوط به پرداخت مالیات نقل و انتقال است؛ مراجع متخلف ملزم به پرداخت دو برابر مالیات پرداخت‌نشده‌اند\n- تبصره ۲: اولین انتقال از کارخانجات سازنده، مونتاژکننده یا واردکنندگان (نمایندگی‌های رسمی) به خریداران و هرگونه انتقال به صورت صلح و هبه به نفع دولت مشمول است\n- تبصره ۳: انتقال خودرو و موتورسیکلت با پلاک انتظامی مناطق آزاد مشمول نیست\n- ماده ۳۱: سازمان از هر مسافر ایرانی هنگام خروج از مرزهای هوایی، دریایی و زمینی (به‌جز موارد تبصره ۱) مالیات دریافت و به درآمد عمومی نزد خزانه‌داری کل واریز می‌کند؛ میزان در قوانین بودجه‌ی سنواتی پیش‌بینی می‌شود\n- تبصره ۱ (مستثنیان): دارندگان گذرنامه‌ی سیاسی و خدمت؛ خدمه‌ی وسایل نقلیه‌ی عمومی زمینی و دریایی و خطوط پروازی؛ دانشجویان شاغل به تحصیل در خارج (دارای اجازه‌ی خروج دانشجویی)؛ بیماران اعزامی با مجوز شورای پزشکی؛ دارندگان پروانه‌ی گذر مرزی و مرزنشینان؛ جانبازان اعزامی برای معالجه؛ زائران اربعین به مقصد عراق؛ ایرانیان مقیم خارج دارای کارنامه‌ی شغلی از وزارت تعاون، کار و رفاه اجتماعی\n- تبصره ۲: گردشگران و ساکنان مناطق آزاد که فقط از مبدأ مناطق آزاد خارج می‌شوند، مشمول عوارض خروج قانون چگونگی اداره‌ی مناطق آزاد (۱۳۷۲/۰۶/۰۷) هستند\n- تبصره ۳: نیروی انتظامی پرداخت مالیات خروج را کنترل و از خروج مسافران پرداخت‌نکرده جلوگیری می‌کند\n- ماده ۳۲: حمل‌ونقل برون‌شهری مسافر با وسائط زمینی (به‌جز ریلی) و دریایی: ۵٪ بهای بلیط به‌عنوان عوارض شهرداری از مسافر اخذ و هر ماه حداکثر تا پانزدهم ماه بعد به حساب شهرداری مبدأ سفر واریز می‌شود؛ تأخیر: ۲٪ در ماه؛ اختلاف مشمول ماده ۷۷ قانون شهرداری ۱۳۳۴/۰۴/۱۱؛ آراء قابل اعتراض در دیوان عدالت اداری\n- ماده ۳۳: مالیات و عوارض این فصل اعتبار مالیاتی نیست؛ مالیات و عوارض مواد ۲۸ و ۳۰ هزینه‌ی قابل قبول مالیاتی است\n- ماده ۳۴: سازمان امکان اظهار و پرداخت مالیات فصول ششم و هفتم را از طریق سامانه فراهم می‌کند\n- ماده ۳۵: مؤدیانی که از عضویت در سامانه امتناع کرده‌اند، علاوه بر جریمه‌ی بند «الف» ماده ۳۶ و بند «ب» ماده ۲۲ قانون پایانه‌ها، باید اظهارنامه‌ی هر دوره را حداکثر یک ماه پس از پایان دوره تسلیم و مالیات فروش را به حساب سازمان واریز کنند',warn:''},
{id:'s8',title:'مواد ۳۶ و ۳۷ — جریمه‌ها',body:'- ماده ۳۶: مؤدیان متخلف علاوه بر مالیات و عوارض، مشمول این جریمه‌ها هستند:\n- بند الف: تا زمان استقرار سامانه برای همه‌ی مؤدیان، و پس از استقرار برای مؤدیان ممتنع از عضویت: عدم تسلیم اظهارنامه در هر دوره: ده میلیون (۱۰,۰۰۰,۰۰۰) ریال یا دو برابر مالیات و عوارض پرداخت‌نشده تا موعد مقرر در ماده ۴، هر کدام بیشتر باشد؛ علاوه بر جریمه‌ی بند «ب» ماده ۲۲ قانون پایانه‌های فروشگاهی\n- بند ب: کتمان معامله، بیش‌اظهاری مالیات و عوارض خرید یا کم‌اظهاری مالیات و عوارض فروش، ثبت معامله‌ی خود به نام غیر یا معامله‌ی غیر به نام خود، استناد به اسناد صوری و هر عمل دیگر منجر به کم‌اظهاری یا استرداد غیرواقعی: دو برابر مالیات و عوارض پرداخت‌نشده تا موعد ماده ۴؛ در صورت تکرار قبل از دو سال: سه برابر مالیات پرداخت‌نشده\n- بند ج: دریافت مالیات و عوارض توسط اشخاص غیرمجاز: دو برابر مالیات و عوارض دریافتی\n- ماده ۳۷: تأخیر در پرداخت در مواعد مقرر (با رعایت ماده ۱۹۱ قانون مالیات‌های مستقیم): جریمه‌ی ۲٪ در ماه نسبت به مالیات و عوارض پرداخت‌نشده و مدت تأخیر، از زمان انقضای مهلت تسلیم اظهارنامه یا سررسید پرداخت، هر کدام مقدم باشد\n- تبصره: مؤدی که خارج از اراده‌ی خود امکان پرداخت نداشته می‌تواند به هیأت‌های حل اختلاف مالیاتی اعتراض کند؛ در صورت پذیرش ادعا با اسناد و مدارک مثبته، جریمه بخشیده می‌شود',warn:''},
{id:'s4',title:'مواد ۳۸ و ۳۹ — توزیع مالیات و عوارض',body:'- ماده ۳۸: مالیات و عوارض مواد ۷، ۲۶ و ۲۸ و جریمه‌های مربوط، پس از کسر کسورات قانونی، توزیع می‌شود:\n- ۱) یک‌نهم از وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶: مالیات سلامت به وزارت بهداشت، درمان و آموزش پزشکی\n- ۲) باقی‌مانده به نسبت مساوی: سهم درآمد عمومی (مالیات؛ به خزانه‌داری کل) و سهم شهرداری‌ها و دهیاری‌ها (عوارض؛ به حساب تمرکز وجوه اداره‌ی کل امور مالیاتی استان و وزارت کشور)\n- تبصره: سهم عوارض و جریمه‌ی شهرداری‌ها، دهیاری‌ها و روستاهای فاقد دهیاری درآمد دولت نیست؛ سازمان باید ۱۰۰٪ آن را ماهانه طبق ماده ۳۹ به حساب‌های رابط واریز کند\n- ماده ۳۹ بند الف: ۹۰٪ عوارض و جریمه‌های ماده ۷ و بندهای «ب» و «پ» ماده ۲۶ پس از واریز به حساب تمرکز وجوه استان، بر اساس شاخص جمعیت میان شهرداری‌ها، دهیاری‌ها، اداره‌ی امور عشایر شهرستان (سهم عشایر) و فرمانداری‌ها (سهم روستاهای فاقد دهیاری) توزیع می‌شود؛ ۱۰٪ باقی به حساب تمرکز وجوه وزارت کشور واریز و طبق آیین‌نامه‌ی شاخص‌های توسعه‌نیافتگی (سازمان برنامه و بودجه و وزارت کشور؛ سه ماه پس از لازم‌الاجراشدن؛ تصویب هیأت وزیران) توزیع می‌شود\n- بند ب: عوارض و جریمه‌های بندهای «الف» و «ت» ماده ۲۶ و ماده ۲۸ به حساب تمرکز وجوه وزارت کشور واریز و به نسبت ۱۲٪ کلان‌شهرها، ۵۳٪ سایر شهرها و ۳۵٪ روستاها و مناطق عشایری، بر اساس شاخص‌های جمعیت و توسعه‌نیافتگی توزیع می‌شود؛ دستورالعمل را وزارت کشور با همکاری سازمان برنامه و بودجه تهیه می‌کند',warn:'ارجاع بندهای ماده ۲۶ در مواد ۳۸ (الف و ب) و ۳۹ (ب و پ در بند الف؛ الف و ت در بند ب) با هم همپوشانی دارد؛ عیناً آمده و تفسیر نشده است.'},
{id:'s11',title:'ماده ۳۹ تبصره‌ها و مواد ۴۰ تا ۴۵',body:'- تبصره ۱ ماده ۳۹: سهم روستاهای فاقد دهیاری به حساب فرمانداری شهرستان برای امور عمرانی و آبادانی همان روستاها (با مشارکت دستگاه‌های اجرائی)؛ دستورالعمل ظرف سه ماه توسط وزارت کشور و وزارت اقتصاد (سازمان)\n- تبصره ۲: سهم مناطق عشایری از مواد ۷ و ۲۶ به اداره‌ی کل امور عشایر هر استان و توزیع بر اساس جمعیت — تبصره ۳: شهرهای جدید تازه‌تأسیس فاقد شهرداری، واجد شهرداری تلقی می‌شوند\n- تبصره ۴: محل اخذ مالیات واحدهای تولیدی، محل استقرار آنها است\n- تبصره ۵: سهم شهرداری‌ها و دهیاری‌ها از بندهای «پ» و «ت» ماده ۲۶ طبق سیاست‌های شورای‌عالی سلامت و امنیت غذایی هزینه می‌شود؛ در کلان‌شهرها کمیته‌ی فرماندار، شهردار و نماینده‌ی وزارت بهداشت تصمیم می‌گیرد\n- تبصره ۶: برداشت از حساب تمرکز وجوه جز پرداخت به شهرداری‌ها، دهیاری‌ها و اشخاص مذکور ممنوع است\n- تبصره ۷: سهم عوارض شرکت‌های فناور مستقر در پارک‌های علم و فناوری پس از واریز به خزانه، ۱۰۰٪ به همان پارک برای ایجاد، توسعه و نگهداری زیرساخت‌ها و خدمات شهری اختصاص می‌یابد؛ آیین‌نامه ظرف سه ماه با معاونت علمی و فناوری ریاست جمهوری\n- تبصره ۸: کارگروه نظارت (وزارت کشور، سازمان و یک ناظر مجلس) و گزارش سالانه به کمیسیون اقتصادی مجلس — تبصره ۹: سازمان هر سه ماه میزان وصول و سهم هر شهرداری، دهیاری، فرمانداری و مناطق عشایری را اطلاع‌رسانی می‌کند\n- ماده ۴۰: عوارض و جریمه‌های آلایندگی (ماده ۲۷) برای هر شهرستان به نسبت جمعیت میان شهرداری‌ها، دهیاری‌ها و فرمانداری‌ها توزیع می‌شود؛ اگر آلودگی واحد بزرگ (۵۰ نفر و بیشتر) به بیش از یک شهرستان یک استان سرایت کند، کمیته‌ای (رئیس سازمان برنامه و بودجه استان، فرمانداران، مدیرکل محیط‌زیست و مدیرکل امور مالیاتی استان) به نسبت جمعیت، اثرپذیری و فاصله توزیع می‌کند\n- تبصره ۱: اگر شهرستان‌ها در دو یا چند استان باشند، کمیته‌ای از نماینده‌ی سازمان برنامه و بودجه کشور، رؤسای سازمان‌های مدیریت و برنامه‌ریزی استان‌ها، نماینده‌ی محیط‌زیست و نمایندگان ادارات کل امور مالیاتی استان‌ها توزیع می‌کند — تبصره ۲: در مناطق آزاد و ویژه‌ای که شهرداری یا دهیاری ندارند، به حساب همان منطقه واریز می‌شود\n- ماده ۴۱: عوارض و جریمه‌های بندهای «الف» و «ب» ماده ۲۹ مستقیماً به شهرداری یا دهیاری محل سکونت مالک (ثبت‌شده هنگام صدور پلاک) واریز می‌شود؛ شهرداری‌های شهرهای آلوده ۱۰۰٪ عوارض بند «ب» ماده ۲۹ را برای توسعه و نوسازی ناوگان حمل‌ونقل عمومی هزینه می‌کنند\n- ماده ۴۲: معادل دوازده در هزار ارزش گمرکی کالاهای وارداتی دارای حقوق ورودی توسط گمرک به حساب تمرکز وجوه وزارت کشور واریز و به نسبت ۱۳٪ کلان‌شهرها، ۳۵٪ دهیاری‌ها و روستاهای فاقد دهیاری و عشایر و ۵۲٪ سایر شهرداری‌ها هزینه می‌شود؛ وزارت کشور وصولی هر ماه را تا پانزدهم ماه بعد واریز می‌کند\n- ماده ۴۳: یک‌نهم وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶ به‌عنوان «مالیات سلامت» همزمان با دریافت به خزانه‌داری کل واریز و خزانه تا پایان پانزدهم ماه بعد به وزارت بهداشت واریز می‌کند؛ عدم تخصیص در حکم تصرف غیرمجاز در اموال عمومی است؛ ۱۰۰٪ منابع ابتدا به پیشگیری و درمان ساکنان روستاها و شهرهای تا بیست هزار نفر و عشایر (در چهارچوب نظام ارجاع) اختصاص می‌یابد؛ سپس تجهیزات بیمارستانی و بهداشتی (اولویت مناطق توسعه‌نیافته)، هیأت امنای ارزی و ارتقای بیمه‌ی بیماران صعب‌العلاج؛ هزینه‌ی نیروی انسانی (حقوق، مزایا، اضافه‌کار و مانند آن) و هزینه‌های اداری از این محل ممنوع است\n- ماده ۴۴: مالیات مواد ۳۰ و ۳۱ سهم دولت و به خزانه‌داری کل واریز می‌شود\n- ماده ۴۵: دولت از محل سهم خود از ماده ۷ هر سال مجموع کمک‌های نقدی هر فرد تحت پوشش نهادهای حمایتی را علاوه بر افزایش‌های سنواتی، حداقل معادل نرخ مالیات بر ارزش افزوده افزایش می‌دهد؛ نهادهای حمایتی نیازمندان بدون پوشش را شناسایی می‌کنند؛ آیین‌نامه حداکثر سه ماه پس از لازم‌الاجراشدن (وزارت تعاون، کار و رفاه اجتماعی با بهزیستی و کمیته‌ی امداد)',warn:''},
{id:'s12',title:'مواد ۴۶، ۴۷ و ۵۱ تا ۵۴ — گمرک، پرونده‌های قبلی و اصلاحات ق.م.م',body:'- ماده ۴۶: همه‌ی عوارض و مالیات این قانون که گمرک به‌صورت قطعی وصول و به حساب‌های مربوط واریز می‌کند، مشمول حکم ماده ۱۶۰ قانون امور گمرکی است\n- ماده ۴۷: پرونده‌هایی که تاریخ تعلق آنها قبل از لازم‌الاجراشدن این قانون است، از نظر مأخذ، نرخ، جرایم، تکالیف مؤدیان و مأموران و نحوه‌ی رسیدگی تابع قانون مالیات بر ارزش افزوده‌ی مصوب ۱۳۸۷/۰۲/۱۷ است؛ اما رفع اختلاف سازمان با مؤدی، قطعیت، وصول، توزیع و تسویه تابع این قانون است\n- ماده ۵۱ (جایگزین ماده ۲۵۱ ق.م.م): مؤدی یا دادستان انتظامی مالیاتی ظرف دو ماه از ابلاغ رأی قطعی هیأت حل اختلاف تجدیدنظر، به استناد عدم رعایت قوانین و مقررات یا نقص رسیدگی، با اعلام دلایل کافی به شورای‌عالی مالیاتی اعتراض و تجدید رسیدگی را درخواست می‌کنند\n- ماده ۵۲: در بند ۳ ماده ۲۵۵ ق.م.م عبارت «نظر اکثریت اعضای شورای‌عالی مالیاتی» به «نظر اکثریت اعضای هیأت عمومی شورای‌عالی مالیاتی موضوع ماده ۲۵۸» تغییر می‌یابد\n- ماده ۵۳: به ماده ۲۵۸ ق.م.م تبصره‌ای الحاق می‌شود: حکم آن ماده در مواردی که نسبت به موارد مشابه آرای متفاوتی از هیأت‌های حل اختلاف صادر شده باشد نیز جاری است\n- ماده ۵۴: در تبصره ۲ ماده ۲۷۴ ق.م.م عبارت «سازمان امور مالیاتی کشور» جایگزین «دادستانی انتظامی مالیاتی» می‌شود؛ حکم این تبصره و احکام فصل نهم باب چهارم ق.م.م (به‌جز ماده ۲۱۷) به این قانون تسری می‌یابد',warn:''},
{id:'s24',title:'مواد ۴۸ و ۴۹ — رسیدگی مجدد و برگ تشخیص',body:'- ماده ۴۸ (جایگزین ماده ۲۳۸ ق.م.م و تسری به این قانون): مؤدی معترض به برگ تشخیص ابلاغ‌شده می‌تواند ظرف سی روز از ابلاغ، شخصاً یا با وکیل تام‌الاختیار و با ارائه دلایل و اسناد، کتباً از اداره‌ی امور مالیاتی تقاضای رسیدگی مجدد کند\n- مسؤول یا مسؤولان تعیین‌شده‌ی سازمان باید پس از ثبت درخواست، ظرف مهلتی که بیش از ۴۵ روز از ثبت نباشد رسیدگی کنند؛ اگر دلایل را برای رد برگ تشخیص کافی بدانند آن را رد، و اگر مؤثر در تعدیل بدانند موارد تعدیل را مشخص می‌کنند\n- اگر مؤدی نظر تعدیل را بپذیرد، درآمد مشمول مالیات تعدیل‌شده قطعی است؛ در غیر این صورت برای رسیدگی به مابه‌التفاوت تا مبلغ مورد اعتراض مؤدی، موضوع به هیأت حل اختلاف مالیاتی ارجاع می‌شود؛ اگر دلایل مؤدی را مؤثر در رد یا تعدیل ندانند، باید موضوع را مستدلاً در پرونده منعکس و برای رسیدگی به هیأت ارجاع دهند\n- تبصره ۱: دستورالعمل اجرائی با پیشنهاد سازمان به تصویب وزیر اقتصاد می‌رسد\n- تبصره ۲: اگر مؤدی اطلاعات را از طریق سامانه مؤدیان اظهار کرده باشد، طبق احکام قانون سامانه مؤدیان و پایانه‌های فروشگاهی رفتار می‌شود\n- ماده ۴۹ (جایگزین تبصره ماده ۲۳۹ ق.م.م): در مواردی که برگ تشخیص طبق تبصره ۱ و قسمت آخر تبصره ۲ ماده ۲۰۳ و ماده ۲۰۸ ابلاغ شده و مؤدی طبق ماده‌ی مربوط اقدام نکرده باشد، در حکم معترض به برگ تشخیص شناخته می‌شود و پرونده برای رسیدگی به هیأت حل اختلاف مالیاتی ارجاع می‌شود',warn:''},
{id:'s25',title:'ماده ۵۰ — هیأت‌های حل اختلاف مالیاتی',body:'- ماده ۵۰ (جایگزین ماده ۲۴۴ ق.م.م و تبصره‌های آن): مرجع رسیدگی به همه‌ی اختلاف‌های مالیاتی، جز مواردی که مرجع دیگری پیش‌بینی شده، هیأت حل اختلاف مالیاتی است و از سه نفر تشکیل می‌شود:\n- ۱) یک نماینده‌ی سازمان امور مالیاتی\n- ۲) یک نفر از قضات بازنشسته یا حقوق‌دانان مطلع در امور مالیاتی (با وثاقت و امانت) به درخواست سازمان و انتخاب رئیس کل دادگستری هر استان\n- ۳) یک نماینده از اتاق بازرگانی، اتاق تعاون، جامعه حسابداران رسمی، جامعه مشاوران رسمی مالیاتی، مجامع حرفه‌ای، اتاق اصناف، شورای اسلامی شهر، کانون وکلا، مرکز وکلا، کارشناسان رسمی و مشاوران خانواده (منصوب برای سه سال)؛ مؤدی همزمان با اعتراض یکی از این مراجع را معرفی می‌کند، وگرنه با توجه به نوع فعالیت یا موضوع، یک نفر انتخاب می‌شود\n- تبصره ۱: جلسه با حضور هر سه عضو رسمیت می‌یابد؛ رأی با اکثریت آراء قطعی و لازم‌الاجرا است و نظر اقلیت باید در متن رأی قید شود\n- تبصره ۲: هیأت‌ها استقلال کامل دارند؛ سازمان فقط دبیرخانه و تشکیل جلسه را بر عهده دارد؛ رأی در همان جلسه یا حداکثر ظرف سه روز کاری توسط نماینده‌ی بند ۲ انشاء و به امضای همه‌ی اعضا می‌رسد؛ مؤدی یا نماینده‌ی قانونی مجاز به حضور کامل و دفاع کتبی یا شفاهی است (اظهارات شفاهی در صورت‌جلسه با امضای او)؛ سازمان باید فرآیند جلسات را مستندسازی کند\n- تبصره ۳: حق‌الزحمه‌ی اعضای بندهای ۲ و ۳ متناسب با تعداد و مدت جلسات از اعتبار بودجه‌ی سازمان و طبق دستورالعمل سازمان، به‌صورت متمرکز به حساب اعضا پرداخت می‌شود\n- تبصره ۴: سازمان نمایندگان معرفی‌شده‌ی بندهای ۲ و ۳ را به‌عنوان اعضا می‌پذیرد و با رعایت تبصره ۵ دعوت می‌کند\n- تبصره ۵: اسامی افراد معرفی‌شده توسط رئیس کل دادگستری، مدیرکل مالیاتی استان و مراجع بند ۳ به تفکیک شهرستان در سامانه‌ی متمرکز (ایجاد حداکثر ظرف سه ماه از لازم‌الاجراشدن، زیر نظر رئیس کل سازمان) درج می‌شود؛ انتخاب افراد هر پرونده در صورت وجود بیش از یک نفر، تصادفی توسط سامانه انجام می‌شود\n- تبصره ۶ و ۱۰: سازمان حداقل یک هفته قبل از جلسه، دسترسی اعضای هیأت و مؤدی (یا نماینده‌ی قانونی) را به مندرجات پرونده‌ی مورد اعتراض فراهم می‌کند\n- تبصره ۷: عضو بندهای ۲ و ۳ که بیش از سه جلسه‌ی متوالی یا چهار جلسه‌ی متناوب در یک سال غیبت کند، حکمش لغو می‌شود و جایگزین ظرف ده روز کاری معرفی می‌شود\n- تبصره ۸: سازمان ساختار هیأت‌ها را مستقل، با عنوان «مرکز دادرسی مالیاتی» ذیل رئیس کل سازمان ایجاد می‌کند؛ واحدهای دادرسی هر استان مستقل از اداره‌ی کل مالیاتی استان‌اند\n- تبصره ۹: پس از استقرار سامانه‌ی مؤدیان، ثبت اعتراض، انتخاب مرجع بند ۳، لوایح، مشاهده‌ی اسناد، ابلاغ جلسات و نتایج از طریق سامانه انجام می‌شود\n- تبصره ۱۱: عضویت همزمان در فهرست نمایندگان بندهای ۲ و ۳ ممنوع است',warn:''},
{id:'s26',title:'مواد ۵۵ تا ۵۷ — نسخ، تعارض و اجرا',body:'- ماده ۵۵ (نسخ از تاریخ لازم‌الاجراشدن، احکام مربوط به مالیات و عوارض در): ۱) قانون مالیات بر ارزش افزوده‌ی ۱۳۸۷/۰۲/۱۷ (به‌جز حکم ماده ۲۸ آن درباره‌ی جامعه‌ی مشاوران رسمی مالیاتی، ماده ۵۰ آن و تبصره‌هایش، و تبصره ۱ ماده ۳۹ آن نسبت به عوارض بند ۲ ماده ۳۸ این قانون)؛ ۲) بند «ب» ماده ۶، بند «ر» ماده ۳۳ و مواد ۷۳ و ۹۴ قانون برنامه‌ی ششم؛ ۳) ماده ۶۹ قانون الحاق برخی مواد به قانون تنظیم بخشی از مقررات مالی دولت (۲) (۱۳۹۳/۱۲/۴)؛ ۴) احکام ماده ۳۴ قانون رفع موانع تولید رقابت‌پذیر درباره‌ی مالیات بر ارزش افزوده؛ ۵) مواد ۱۸ و ۴۷ قانون اصلاح نظام صنفی (۱۳۹۲/۰۶/۱۲)\n- ماده ۵۶: اجرای این قانون نافی اجرای این احکام نیست: قانون برنامه‌ی ششم (به‌جز موارد منسوخ ماده ۵۵)؛ قانون مالیات‌های مستقیم؛ قانون مقررات تردد وسایل نقلیه‌ی خارجی (۱۳۷۳)؛ عوارض آزادراه‌ها و ماده ۱۲ قانون حمل‌ونقل و عبور کالاهای خارجی (۱۳۷۴)؛ قانون نحوه‌ی تأمین هزینه‌های اتاق‌های بازرگانی و تعاون (۱۳۷۲)؛ مواد ۶۳ و ۸۷ قانون وصول برخی درآمدهای دولت (۱۳۷۳)؛ قانون امور گمرکی (به‌جز تعریف حقوق ورودی و سایر وجوه بند «د» ماده ۱)؛ مواد ۶۵، ۵۸ و ۷۰ قانون الحاق برخی مواد به قانون تنظیم بخشی از مقررات مالی دولت (۲)؛ بندهای «الف» و «ب» ماده ۳۰ و بند ۳ ماده ۴۸ قانون احکام دائمی برنامه‌های توسعه؛ تبصره ۵ بند «الف» ماده ۲۸ قانون رفع موانع تولید؛ ماده ۷ قانون توسعه‌ی ابزارها و نهادهای مالی جدید؛ قانون توسعه و حمایت از صنایع دریایی (۱۳۸۷)\n- ماده ۵۷: قانون شش ماه پس از ابلاغ به رئیس‌جمهور لازم‌الاجراست\n- تبصره: تا تاریخ لازم‌الاجراشدن این قانون، قانون مالیات بر ارزش افزوده‌ی مصوب ۱۳۸۷/۰۲/۱۷ و اصلاحات بعدی تمدید می‌شود و لازم‌الاجراست\n- پایان متن: تصویب در جلسه‌ی علنی روز یکشنبه دوم خرداد ۱۴۰۰ مجلس شورای اسلامی و تأیید شورای نگهبان در ۱۴۰۰/۰۳/۱۲',warn:'سربرگ فایل «تاریخ لازم‌الاجرا ۱۴۰۰/۱۰/۱۰» را با ماده ۵۷ (شش ماه پس از ابلاغ) تطبیق نداده‌ام؛ تاریخ ابلاغ به رئیس‌جمهور در فایل نیست.'}],

gloss:[{id:'g1',term:'عرضه',def:'واگذاری کالا یا ارائه خدمت به غیر از طریق هر نوع معامله یا عقد قانونی'},{id:'g2',term:'مؤدی',def:'شخصی که به عرضه کالا، ارائه خدمت، واردات یا صادرات مبادرت می‌نماید'},{id:'g3',term:'اعتبار مالیاتی',def:'مالیات و عوارضی که مؤدی بابت خرید کالا یا خدمت پرداخت کرده است'},{id:'g4',term:'معافیت مالیاتی',def:'عدم تعلق مالیات و عوارض این قانون بر کالاها و خدمات'},{id:'g5',term:'واردات',def:'ورود کالا یا خدمت از خارج به قلمرو گمرکی یا مناطق آزاد و ویژه'},{id:'g6',term:'سامانه مؤدیان',def:'سامانه‌ای که معاملات مؤدیان در آن ثبت می‌شود؛ ثبت در آن به منزله ثبت در دفاتر قانونی است'},{id:'g7',term:'عوارض',def:'مبالغی که به موجب این قانون همراه مالیات برای شهرداری‌ها و دهیاری‌ها وضع می‌شود'},{id:'g8',term:'سازمان',def:'سازمان امور مالیاتی کشور'},{id:'g9',term:'عرضه کالا به خود',def:'کالا و خدمات مشمول که توسط مؤدیان حقیقی خریداری، تحصیل یا تولید و برای مصارف شخصی برداشته شود؛ مشمول مالیات و عوارض است (تبصره ۱ ماده ۲)'},{id:'g10',term:'معاوضه',def:'عرضه کالا و ارائه خدمت از طرف هر یک از متعاملین محسوب می‌شود (تبصره ۲ ماده ۲)'},{id:'g11',term:'تاریخ تعلق مالیات',def:'تاریخ صدور صورتحساب مطابق مقررات (ماده ۳)'},{id:'g12',term:'مالیات و عوارض فروش',def:'مالیات و عوارض متعلق به عرضه کالاها و خدمات مشمول توسط مؤدی در یک دوره‌ی معین (بند «ت» ماده ۱)'},{id:'g13',term:'مالیات و عوارض خرید',def:'مالیات و عوارض متعلق به خرید کالاها و خدمات مشمول برای فعالیت‌های اقتصادی مؤدی در یک دوره‌ی معین (بند «ث» ماده ۱)'},{id:'g14',term:'مالیات بر ارزش افزوده',def:'مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره‌ی معین (بند «ج» ماده ۱)'},{id:'g15',term:'دوره‌ی مالیاتی',def:'هر سه ماه، منطبق بر فصول سال شمسی (بند «خ» ماده ۱)'},{id:'g16',term:'صادرات',def:'صدور کالا یا خدمت به خارج از کشور (بند «پ» ماده ۱)'},{id:'g17',term:'پایانه فروشگاهی',def:'موضوع بند «ب» ماده ۱ قانون پایانه‌های فروشگاهی و سامانه مؤدیان مصوب ۱۳۹۸/۰۷/۲۱ (بند «ژ» ماده ۱)'},{id:'g18',term:'قانون مالیات‌های مستقیم',def:'قانون مصوب ۱۳۶۶/۱۲/۳ و اصلاحات بعدی (بند «ر» ماده ۱)'},{id:'g19',term:'حقوق ورودی',def:'حقوق گمرکی و سود بازرگانی؛ مالیات و عوارض این قانون جزء حقوق ورودی نیست (ماده ۶)'},{id:'g20',term:'ارزش گمرکی',def:'ارزش موضوع ماده ۱۴ قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲ که با حقوق ورودی، مأخذ مالیات واردات را می‌سازد (ماده ۶)'},{id:'g21',term:'مأخذ مؤدیان عضو سامانه',def:'ارزش فروش مندرج در صورتحساب الکترونیکی ثبت‌شده در سامانه مؤدیان (ماده ۵)'},{id:'g22',term:'هیأت حل اختلاف مالیاتی',def:'مرجع رسیدگی به همه‌ی اختلاف‌های مالیاتی (به‌جز موارد دارای مرجع دیگر)، مرکب از سه نفر: نماینده‌ی سازمان، قاضی بازنشسته یا حقوق‌دان، و نماینده‌ی مراجع بند ۳ (ماده ۵۰)'},{id:'g23',term:'مرکز دادرسی مالیاتی',def:'ساختار مستقل هیأت‌ها ذیل رئیس کل سازمان که واحدهای دادرسی هر استان مستقل از اداره‌ی کل امور مالیاتی استان‌اند (تبصره ۸ ماده ۵۰)'},{id:'g24',term:'مالیات سلامت',def:'یک‌نهم وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶ که برای وزارت بهداشت خزانه واریز می‌کند (مواد ۳۸ و ۴۳)'},{id:'g25',term:'عوارض سبز',def:'عوارض واحدهای آلاینده با نرخ‌های ۰/۵٪، ۱٪ و ۱/۵٪ به مأخذ فروش، بر اساس شدت، مدت، نوع و مکان آلایندگی (ماده ۲۷)'}],
essay:[{id:'e1',q:'مالیات بر ارزش افزوده را تعریف کنید و مهلت پرداخت آن را بنویسید.',a:'مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره معین؛ پرداخت حداکثر تا پایان ماه پس از انقضای دوره، پس از کسر اعتبار مالیاتی.'},{id:'e2',q:'مأخذ مالیات واردات و نرخ آن؟',a:'ارزش گمرکی به‌اضافه حقوق ورودی؛ نرخ ۹٪.'},{id:'e3',q:'در چه شرایطی مالیات خرید قابل استرداد نیست؟',a:'اگر مؤدی فقط کالا و خدمات معاف عرضه کند (تبصره ۲ ماده ۸)؛ استثنا: ماشین‌آلات خطوط تولید.'},{id:'e4',q:'نرخ مالیات کالاهای نفتی را بنویسید.',a:'بنزین و سوخت هواپیما ۳۰٪؛ نفت‌گاز، نفت سفید، نفت کوره، گاز طبیعی و گاز مایع ۱۵٪.'},{id:'e5',q:'نرخ مالیات سیگار و محصولات دخانی را بنویسید.',a:'داخلی ۲۵٪؛ داخلی با نشان بین‌المللی ۴۰٪؛ وارداتی ۶۵٪؛ توتون خام وارداتی ۱۰٪؛ خرمن توتون ۳۵٪.'},{id:'e6',q:'تبصره ۲ ماده ۴ درباره‌ی معاملات غیرنقدی چه می‌گوید؟',a:'تاریخ تعلق همان تاریخ صدور صورتحساب است؛ اما مؤدی می‌تواند پرداخت مالیات را تا زمان پرداخت ثمن یا مبلغ قرارداد توسط خریدار یا کارفرما، متناسباً به تأخیر بیندازد و مشمول جریمه‌ی تأخیر نمی‌شود؛ تا آن زمان اعتبار مالیاتی برای خریدار منظور نمی‌شود.'},{id:'e7',q:'مواردی را که جزء مأخذ محاسبه مالیات نیستند نام ببرید (تبصره ۲ ماده ۵).',a:'تخفیفات اعطائی؛ مالیات و عوارض قبلاً پرداخت‌شده؛ سایر مالیات‌های غیرمستقیم و عوارض؛ وجوه واریزی به درآمد عمومی یا شهرداری‌ها؛ کمک‌های شهرداری‌ها به سازمان‌های غیرانتفاعی وابسته؛ یارانه‌ی دولت؛ وجوه جابه‌جاشده بین شرکت‌های تابعه بابت غیر از خرید و فروش (با شرایط ذکرشده).'},{id:'e8',q:'کالاهای مذکور در جزء ۵ بند «الف» ماده ۹ را نام ببرید.',a:'شیر، پنیر و ماست؛ تخم ماکیان؛ آرد و نان؛ انواع گوشت و فرآورده‌های گوشتی (طبق فهرست وزارت بهداشت)؛ برنج، حبوبات، سویا و پروتئین سویا؛ روغن‌های خوراکی گیاهی و حیوانی؛ شیرخشک مخصوص کودکان؛ تخم مرغ نطفه‌دار و تبدیل آن به جوجه‌ی یک‌روزه.'},{id:'e9',q:'عملیات و خدمات بانکی معاف و حدود آن را بنویسید (ماده ۹).',a:'دریافت سپرده، اعطای تسهیلات یا ایجاد اعتبار، ارائه ضمانت‌نامه و انتقال وجه در چهارچوب قوانین مربوط و مصوبات شورای پول و اعتبار؛ از جمله خدمات قرض‌الحسنه، تسهیلات صندوق‌های حمایتی قانونی، و فقط سود تسهیلات شرکت‌های لیزینگ.'},{id:'e10',q:'شرایط صادرات محسوب‌شدن خدمات اشخاص مقیم ایران را بنویسید (تبصره ۳ ماده ۱۰).',a:'خدماتی که اشخاص مقیم ایران (حقیقی یا حقوقی ایرانی یا شعب شرکت‌های خارجی مقیم ایران) ارائه می‌کنند، چه محل مصرف یا مقصد داخل باشد چه خارج، در صورتی که مستقیم یا غیرمستقیم ارز حاصل و وارد کشور شود، صادرات محسوب می‌شود.'},{id:'e11',q:'مسئولیت انتقال‌دهنده و خریدار واحد صنفی را طبق ماده ۲۲ بنویسید.',a:'دارنده تا اتمام انتقال مسئول اجرای مقررات و همه‌ی تکالیف دوره‌های مالیاتی (صورتحساب، ثبت معاملات و ...) است؛ خریدار قبل از اتمام انتقال مسئولیتی ندارد مگر به موجب سند رسمی بپذیرد. انتقال‌دهنده باید حداکثر ظرف ده روز سازمان را از زمان اتمام فعالیت مطلع کند، وگرنه با مؤدی جدید در پرداخت مالیات و جریمه‌ها مسئولیت تضامنی دارد.'},{id:'e12',q:'نرخ و احکام مالیات طلا، جواهر و پلاتین را بنویسید (بند ب ماده ۲۶).',a:'اصل طلا، جواهر و پلاتین معاف؛ اجرت ساخت، حق‌العمل و سود فروشنده ۹٪. ثبت همه‌ی معاملات در سامانه و درج تفکیکی ارزش اصل، اجرت، حق‌العمل و سود در صورتحساب الزامی است؛ کتمان یا عدم ثبت: جریمه‌ی غیرقابل بخشودگی ۹٪ ارزش اصل طلا، جواهر و پلاتین، علاوه بر جریمه‌ی بند ب ماده ۳۶. استفاده از پایانه‌ی فروشگاهی حداکثر تا دو ماه پس از لازم‌الاجراشدن قانون الزامی است، وگرنه پروانه باطل می‌شود.'},{id:'e13',q:'احکام مالیات نقل و انتقال خودرو (ماده ۳۰) را بنویسید.',a:'تولید داخل ۱٪ و وارداتی ۲٪ به مأخذ تبصره ۱ ماده ۲۸ برای سال تولید؛ مأخذ تا شش سال پس از تولید سالانه ۱۰٪ کاهش می‌یابد و از سال ششم به بعد ۴۰٪ آن است. ثبت سند و تعویض پلاک منوط به پرداخت است و مراجع متخلف ملزم به پرداخت دو برابر مالیات پرداخت‌نشده‌اند. اولین انتقال از کارخانه، مونتاژکننده یا واردکننده و انتقال صلح و هبه به نفع دولت مشمول است؛ پلاک مناطق آزاد مشمول نیست.'},{id:'e14',q:'نحوه‌ی توزیع مالیات و عوارض مواد ۷، ۲۶ و ۲۸ را طبق ماده ۳۸ بنویسید.',a:'پس از کسر کسورات قانونی: یک‌نهم از وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶ به‌عنوان مالیات سلامت به وزارت بهداشت اختصاص می‌یابد. باقی‌مانده به نسبت مساوی میان سهم درآمد عمومی (مالیات؛ به خزانه‌داری کل) و سهم شهرداری‌ها و دهیاری‌ها (عوارض؛ به حساب تمرکز وجوه اداره‌ی کل امور مالیاتی استان و وزارت کشور) تقسیم می‌شود. سهم عوارض و جریمه‌ی شهرداری‌ها و دهیاری‌ها درآمد دولت نیست و سازمان ۱۰۰٪ آن را ماهانه واریز می‌کند.'},{id:'e15',q:'ترکیب هیأت حل اختلاف مالیاتی و ویژگی‌های جلسه و رأی را بنویسید (ماده ۵۰).',a:'سه نفر: نماینده‌ی سازمان امور مالیاتی؛ یک قاضی بازنشسته یا حقوق‌دان مطلع (انتخاب رئیس کل دادگستری استان به درخواست سازمان)؛ و یک نماینده از مراجع بند ۳ (اتاق‌ها، جوامع حرفه‌ای، کانون وکلا و ...) که برای سه سال منصوب می‌شود. جلسه با حضور هر سه عضو رسمی است؛ رأی با اکثریت قطعی و لازم‌الاجرا است و نظر اقلیت در متن می‌آید. هیأت مستقل است و سازمان فقط دبیرخانه را اداره می‌کند. رأی در همان جلسه یا حداکثر سه روز کاری انشاء و به امضای همه‌ی اعضا می‌رسد و مؤدی حق حضور و دفاع کتبی یا شفاهی دارد.'},{id:'e16',q:'اصلاحات قانون مالیات‌های مستقیم در مواد ۵۱ تا ۵۴ را به‌طور خلاصه بنویسید.',a:'ماده ۵۱: اعتراض به شورای‌عالی مالیاتی ظرف دو ماه از ابلاغ رأی قطعی هیأت تجدیدنظر (جایگزین ماده ۲۵۱). ماده ۵۲: در بند ۳ ماده ۲۵۵ عبارت به «اعضای هیأت عمومی شورای‌عالی مالیاتی موضوع ماده ۲۵۸» تغییر می‌کند. ماده ۵۳: تبصره‌ی الحاقی به ماده ۲۵۸ درباره‌ی آرای متفاوت هیأت‌ها در موارد مشابه. ماده ۵۴: در تبصره ۲ ماده ۲۷۴ «سازمان امور مالیاتی کشور» جایگزین «دادستانی انتظامی مالیاتی» می‌شود و حکم آن و فصل نهم باب چهارم (به‌جز ماده ۲۱۷) به این قانون تسری می‌یابد.'},{id:'e17',q:'مؤدیان ملزم به عضویت و ثبت معاملات در سامانه را طبق مواد ۱۲ و ۱۵ بنویسید.',a:'ماده ۱۲: عرضه‌کنندگان کالا و خدمات معاف و فعالان مستقر در مناطق آزاد و ویژه که حجم معاملات سالانه‌شان از مبلغ مصوب هیأت وزیران بیشتر باشد؛ با جریمه‌ی ۹٪ ارزش معاملات ثبت‌نشده در صورت تخلف. ماده ۱۵: دستگاه‌های اجرائی موضوع ماده ۵ قانون مدیریت خدمات کشوری و ماده ۲۹ قانون برنامه‌ی ششم و سازمان‌های وابسته به آنها.'}]}}
</script>
<script>
/* ===== متن کامل قانون (بدون تغییر، از فایل منبع) ===== */
var LAW=[{"h":"مشخصات قانون","a":[{"t":"مشخصات قانون","x":"قانون مالیات بر ارزش افزوده ۱۴۰۰/۰۳/۰۲ (با آخرین اصلاحات)\n\n- **نوع:** قانون\n\n- **تاریخ تصویب:** ۱۴۰۰/۰۳/۰۲\n\n- **مرجع تصویب:** مجلس شورای اسلامی\n\n- **تاریخ لازم‌الاجرا:** ۱۴۰۰/۱۰/۱۰"}]},{"h":"فصل اول: تعاریف و کلیات (از ماده ۱ تا ماده ۴)","a":[{"t":"ماده ۱","x":"مفاهیم و اصطلاحات زیر، در این قانون، دارای تعاریف مشروحه ذیل می‌باشند:\n\n- **الف ـ عرضه:** واگذاری کالا یا ارائه خدمت به غیر، از طریق هر نوع معامله یا عقد قانونی؛\n\n- **ب ـ واردات:** ورود کالا یا خدمت از خارج از کشور به قلمرو گمرکی کشور یا مناطق آزاد تجاری ـ صنعتی یا مناطق ویژه اقتصادی؛\n\n- **پ ـ صادرات:** صدور کالا یا خدمت به خارج از کشور؛\n\n- **ت ـ مالیات و عوارض فروش:** مالیات و عوارض متعلق به عرضه کالاها و ارائه خدمات مشمول مالیات و عوارض توسط مؤدی در یک دوره معین؛\n\n- **ث ـ مالیات و عوارض خرید:** مالیات و عوارض متعلق به خرید کالاها و خدمات مشمول مالیات و عوارض برای فعالیت‌های اقتصادی مؤدی در یک دوره معین؛\n\n- **ج ـ مالیات بر ارزش افزوده:** مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره معین؛\n\n- **چ ـ عوارض:** مبالغی که به موجب این قانون به همراه مالیات برای شهرداری‌ها و دهیاری‌ها وضع می‌شود. در این قانون، هر جا مراد، نوع دیگری از عوارض بوده، به صراحت بیان شده است؛ از جمله عوارض واحدهای آلایندگی و عوارض سالانه خودرو؛\n\n- **ح ـ مؤدی:** شخصی است که به عرضه کالا، ارائه خدمت، واردات یا صادرات مبادرت می‌نماید.\n\n- **خ ـ دوره مالیاتی:** دوره مالیاتی هر سه ماه می‌باشد و منطبق بر فصول سال شمسی است.\n\n- **د ـ اعتبار مالیاتی:** مالیات و عوارضی که مؤدی بابت خرید کالا (اعم از نهاده و کالای نهائی) یا خدمت به موجب این قانون پرداخت کرده است.\n\n- **ذ ـ معافیت مالیاتی:** عدم تعلق مالیات و عوارض موضوع این قانون بر کالاها و خدمات.\n\n- **ر ـ قانون مالیات‌های مستقیم:** قانون مالیات‌های مستقیم مصوب ۳/۱۲/۱۳۶۶ و اصلاحات بعدی آن.\n\n- **ز ـ سازمان:** سازمان امور مالیاتی کشور.\n\n- **ژ ـ پایانه فروشگاهی:** پایانه موضوع بند «ب» ماده (۱) قانون پایانه‌های فروشگاهی و سامانه مؤدیان مصوب ۱۳۹۸/۰۷/۲۱.\n\n- **س ـ سامانه مؤدیان:** سامانه موضوع بند «پ» ماده (۱) قانون پایانه‌های فروشگاهی و سامانه مؤدیان."},{"t":"ماده ۲","x":"عرضه کالاها و ارائه خدمات در ایران و واردات و صادرات آنها، از لحاظ مالیات و عوارض مشمول مقررات این قانون است.\n\n- **تبصره ۱:** کالاها و خدمات مشمول موضوع این قانون که توسط مودیان حقیقی خریداری، تحصیل یا تولید می‌شود، در صورتی که برای مصارف شخصی برداشته شود عرضه کالا به خود محسوب می‌شود و مشمول مالیات و عوارض خواهد شد. در صورتی که عرضه کالا به خود برای استفاده شغلی باشد مشمول مالیات و عوارض نخواهد شد.\n\n- **تبصره ۲:** معاوضه کالاها و خدمات در این قانون، عرضه کالا و ارائه خدمت از طرف هر یک از متعاملین محسوب می‌شود و مشمول مقررات این قانون است."},{"t":"ماده ۳","x":"تاریخ تعلق مالیات و عوارض تاریخ صدور صورتحساب مطابق با مقررات است.\n\n- **تبصره:** قبوض آب، برق، گاز و مخابرات از آنجا که سند فروش کالا یا خدمت محسوب می‌شوند، در حکم صورتحساب هستند."},{"t":"ماده ۴","x":"مودی مکلف است حداکثر تا پایان ماه پس از انقضای هر دوره مالیاتی، کل مالیات و عوارضی را که طی آن دوره به فروش کالا و یا ارائه خدمات توسط وی تعلق گرفته است، با رعایت تبصره (۲) این ماده و پس از کسر اعتبار مالیاتی خود، به ترتیبی که سازمان مقرر می‌کند، پرداخت نماید.\n\n- **تبصره ۱:** مطابق این قانون، اصل بر نقدی بودن معاملات است; مگر اینکه نسیه بودن معاملات و دریافت و پرداخت‌های مرتبط با آن در سامانه مودیان ثبت شده و به تأیید طرفین رسیده باشد. در مواردی که معامله یا قرارداد در سامانه مودیان ثبت نشده باشد، آن معامله یا قرارداد، نقدی تلقی می‌شود.\n\n- **تبصره ۲:** در معاملات غیرنقدی نظیر فروش اقساطی و اجاره به شرط تملیک و قراردادهای پیمانکاری و مشاوره‌ای، تاریخ تعلق مالیات و عوارض همان تاریخ صدور صورتحساب است; لکن مودی با رعایت تبصره فوق مجاز است پرداخت مالیات و عوارض فروش این نوع معاملات را تا زمان پرداخت ثمن معامله توسط خریدار یا مبلغ قرارداد توسط کارفرما، متناسباً، به تأخیر بیندازد و سازمان تا زمان پرداخت مالیات و عوارض فروش این نوع معاملات توسط کارفرما یا خریدار، مؤدی را مشمول جریمه تأخیر در پرداخت نخواهد کرد. در خصوص معاملات مذکور، تا زمان پرداخت مالیات و عوارض توسط خریدار، اعتبار مالیاتی برای وی از این بابت منظور نخواهد شد.\n\n- **تبصره ۳:** کلیه کارفرمایان موضوع ماده (۵) قانون مدیریت خدمات کشوری مصوب ۱۳۸۶/۰۷/۰۸ و ماده (۲۹) قانون برنامه پنجساله ششم توسعه اقتصادی، اجتماعی و فرهنگی جمهوری اسلامی ایران مصوب ۱۳۹۵/۱۲/۱۴ موظفند علاوه بر ثبت اصل قرارداد پیمانکاری، کلیه پرداخت‌های خود به پیمانکار را نیز در سامانه مودیان ثبت نموده، همزمان با هر پرداخت، مالیات و عوارض متناسب با آن را به پیمانکار پرداخت کنند. چنانچه کارفرما از پرداخت مالیات و عوارض فروش خودداری کند، بعد از انقضای مهلت قانونی، اصل مالیات و عوارض و جریمه‌های متعلق به آن توسط سازمان از طریق عملیات اجرائی از کارفرما وصول و اصل مالیات و عوارض به حساب پیمانکار منظور خواهد شد.\n\n- **تبصره ۴:** پیمانکاران و مهندسان مشاور موضوع این ماده می‌توانند از اوراق تسویه خزانه موضوع ماده (۲) قانون رفع موانع تولید رقابت‌پذیر و ارتقای نظام مالی کشور مصوب ۱۳۹۴/۰۲/۰۱ و اوراق مالی اسلامی که توسط دولت منتشر می‌شود (منوط به دریافت مستقیم از دولت) برای تسویه مالیات و عوارض خود استفاده نمایند. سازمان مکلف به پذیرش این اوراق به عنوان مالیات و عوارض به میزان ارزش تنزیل‌شده آن (با نرخ حفظ قدرت خرید اسناد خزانه یا نرخ سود اوراق مالی ـ اسلامی) متناسب با سال‌های باقی‌مانده تا سررسید است. میزان مالیات وصولی از این محل به عنوان عملکرد وصولی نقدی سازمان در سال پذیرش اوراق محسوب می‌شود. در اجرای این تبصره سازمان مکلف است که معادل سهم عوارض از پذیرش اوراق مذکور را از محل وصولی‌های جاری به حساب عوارض شهرداری‌ها و دهیاری‌های مربوط منظور نماید.\n\n- **تبصره ۵:** چنانچه وجه واردات خدمت در دوره یا دوره‌های بعد پرداخت شود، مالیات و عوارض آن هم در همان دوره پرداخت می‌شود."}]},{"h":"فصل دوم: مأخذ، نرخ و نحوه محاسبه (از ماده ۵ تا ماده ۸)","a":[{"t":"ماده ۵","x":"مأخذ محاسبه مالیات و عوارض فروش کالاها و خدمات، در مورد مؤدیان عضو سامانه مؤدیان، ارزش فروش مندرج در صورتحساب الکترونیکی است که توسط آنان در سامانه مزبور ثبت شده است.\n\n- **تبصره ۱:** مأخذ محاسبه مالیات و عوارض فروش کالاها و خدمات در مورد مودیانی که عضو سامانه مودیان نیستند و نیز مودیان متخلف موضوع ماده (۹) قانون پایانه‌های فروشگاهی و سامانه مودیان، ارزش روز کالا یا خدمت در زمان تعلق می‌باشد که توسط سازمان بر اساس اطلاعات موجود در سامانه مودیان، استعلام از مراجع ذی‌صلاح یا تعیین کارشناس یا هیأت کارشناسی مشخص می‌شود. همچنین سازمان می‌تواند برای تعیین مأخذ مشمول مالیات مودیان مزبور، از دفاتر، اسناد و مدارک (اعم از الکترونیکی یا غیرالکترونیکی) آنها استفاده نماید. مودی مکلف است دفاتر، اسناد و مدارک مذکور را در صورت درخواست مأموران مالیاتی، کارشناس یا هیأت کارشناسی به آنان ارائه کند.\n\n- **تبصره ۲:** موارد زیر جزء مأخذ محاسبه مالیات و عوارض نمی‌باشد:\n\n  - **الف ـ** انواع تخفیفات اعطائی؛\n\n  - **ب ـ** مالیات و عوارض موضوع این قانون که قبلاً توسط عرضه‌کننده کالا یا ارائه‌دهنده خدمت پرداخت شده است؛\n\n  - **پ ـ** سایر مالیات‌های غیرمستقیم و عوارضی که به موجب قوانین موضوعه هنگام عرضه کالا یا ارائه خدمت به آن تعلق گرفته است؛\n\n  - **ت ـ** وجوهی که به موجب سایر قوانین وصول می‌شود و به حساب درآمد عمومی یا به حساب درآمد شهرداری‌ها واریز می‌گردد؛\n\n  - **ث ـ** کمک‌های پرداختی شهرداری‌ها و دهیاری‌ها به سازمان‌های غیرانتفاعی وابسته به خود طبق قوانین و مقررات موضوعه، مشروط به آنکه مالیات متعلقه به عنوان بخشی از آن احتساب نشده باشد؛\n\n  - **ج ـ** یارانه پرداختی دولت بابت جبران تمام یا قسمتی از قیمت کالاها و خدمات مشمول قیمت‌گذاری؛ مشروط به آنکه مالیات فروش به عنوان بخشی از آن احتساب نشده باشد.\n\n  - **چ ـ** وجوهی که از ردیف‌های بودجه‌ای مصوب دستگاه‌ها بین شرکت‌های تابعه در قوانین بودجه سنواتی جا به جا می‌شود مشروط بر آنکه بابت خرید یا فروش کالا و خدمات نباشد."},{"t":"ماده ۶","x":"مأخذ محاسبه مالیات و عوارض واردات کالا، مجموع ارزش گمرکی (موضوع ماده (۱۴) قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲) و حقوق ورودی (حقوق گمرکی و سود بازرگانی) می‌باشد. مالیات و عوارض مذکور جزء حقوق ورودی محسوب نمی‌شود."},{"t":"ماده ۷","x":"نرخ مالیات و عوارض کالاها و خدمات مطابق با مأخذ موضوع ماده (۵) این قانون، به استثنای کالاهای خاص که نرخ آنها در ماده (۲۶) این قانون تصریح شده، نه درصد (۹%) می‌باشد."},{"t":"ماده ۸","x":"مالیات و عوارضی که مؤدیان برای خرید کالاها و خدمات مورد نیاز برای انجام فعالیت‌های اقتصادی خود پرداخت می‌کنند، به عنوان اعتبار مالیاتی آنان منظور شده و از مالیات و عوارض فروش آنها کسر می‌شود. در صورتی که جمع اعتبار مالیاتی مؤدی در هر دوره مالیاتی بیشتر از مالیات و عوارض فروش وی باشد، سازمان موظف است مبلغ مازاد را به دوره و یا دوره‌های بعد منتقل نماید. در صورتی که مؤدی درخواست کند که مازاد مزبور به وی مسترد گردد، سازمان موظف است حداکثر ظرف یک‌ماه از تاریخ ثبت درخواست، نسبت به استرداد مابه‌التفاوت مذکور از محل وصولی‌های جاری اقدام نماید، در غیر این صورت، مشمول خسارتی به میزان دو درصد (۲%) در ماه از تاریخ ثبت درخواست نسبت به مبلغ قابل استرداد و مدت تأخیر می‌باشد که توسط سازمان و از محل وصولی‌های جاری پرداخت می‌گردد. متخلفین از اجرای این حکم با درخواست مؤدی و رأی هیأت رسیدگی به تخلفات اداری به مجازات بند «د» ماده (۹) قانون رسیدگی به تخلفات اداری مصوب ۱۳۷۲/۹/۷ محکوم می‌شوند.\n\n- **تبصره ۱:** مالیات و عوارض خرید نهاده‌های مربوط به طرح‌های تملک دارایی‌های سرمایه‌ای (عمرانی) دولت قابل استرداد نیست و جزء بهای تمام‌شده دارایی‌های مزبور منظور می‌گردد.\n\n- **تبصره ۲:** در صورتی که مودی فقط به عرضه کالاها و ارائه خدمات معاف اشتغال داشته باشد و یا طبق مقررات این قانون کالا و خدمات وی مشمول مالیات و عوارض نباشد، مالیات و عوارض پرداختی بابت خرید نهاده‌های آنها قابل تهاتر یا استرداد نمی‌باشد.\n\n- **تبصره ۳:** در صورتی که مودی به عرضه توأم کالاها و خدمات مشمول و معاف اشتغال داشته باشد، صرفاً مالیات و عوارضی که بابت خرید نهاده‌های مورد نیاز برای تولید کالاها و خدمات مشمول پرداخت کرده است، حسب مورد، قابل کسر، تهاتر یا استرداد است.\n\n- **تبصره ۴:** صرف‌نظر از آنکه مودی به عرضه کالاها و خدمات معاف یا مشمول اشتغال داشته باشد، مالیات و عوارض خرید مربوط به ماشین‌آلات خطوط تولید وی قابل کسر، تهاتر و استرداد می‌باشد.\n\n- **تبصره ۵:** آن قسمت از مالیات و عوارض پرداختی مودیان که طبق مقررات این قانون قابل تهاتر یا استرداد نیست، به عنوان هزینه‌های قابل قبول موضوع قانون مالیات‌های مستقیم محسوب می‌شود.\n\n- **تبصره ۶:** سازمان مکلف است با رعایت تبصره‌های (۲) و (۴) این ماده مالیات و عوارض پرداختی واحدهای تولیدی یا معدنی دارای مجوز تأسیس را که در دوره‌های قبل از بهره‌برداری جهت خرید کالاها و خدمات مورد نیاز برای تأسیس و راه‌اندازی واحد موردنظر پرداخت کرده‌اند، مسترد نماید.\n\n- **تبصره ۷:** مالیات و عوارضی که در موقع خرید کالاها و خدمات توسط شهرداری‌ها و دهیاری‌ها برای انجام وظایف و خدمات قانونی پرداخت می‌گردد، طبق مقررات این قانون قابل تهاتر و یا استرداد است.\n\n- **تبصره ۸:** مالیات و عوارض پرداخت‌شده توسط سفارتخانه‌ها، مأموریت‌های دیپلماتیک، پست‌های کنسولی، مأموران دیپلماتیک و کارکنان اداری و فنی آنها که تبعه دولت جمهوری اسلامی ایران نمی‌باشند، به شرط عمل متقابل و همچنین مالیات و عوارض پرداخت‌شده توسط دفاتر سازمان‌های بین‌المللی و اعضای آنان که مقیم جمهوری اسلامی ایران می‌باشند (اتباع غیرایرانی)، با ارائه اسناد و مدارک مثبته، قابل استرداد است. نحوه استرداد به موجب دستورالعملی است که توسط وزارتخانه‌های امور خارجه و امور اقتصادی و دارایی (سازمان) تصویب و ابلاغ می‌شود."}]},{"h":"فصل سوم: معافیت‌ها (از ماده ۹ تا ماده ۱۲)","a":[{"t":"ماده ۹","x":"عرضه کالاها و ارائه خدمات زیر از پرداخت مالیات و عوارض معاف می‌باشد:\n\n#### الف ـ کالاها\n\n**جزء ۱**\n\n۱ ـ کلیه محصولات کشاورزی فرآوری نشده مشتمل بر محصولات خام زراعی و باغی، گیاهان دارویی، محصولات مرتعی، محصولات جنگل (از جمله چوب خام)، محصولات گلخانه (از جمله سبزی، صیفی، گل و گیاه و انواع قارچ).\n\n- **تبصره:** فعالیت‌های مربوط به مراحل بسته‌بندی، انبارداری و نگهداری محصول در دمای مناسب در سردخانه، انجماد محصول (شامل سردخانه)، پاک کردن، درجه‌بندی، بوجاری بذور، پوست‌گیری مانند شالی‌کوبی، شستشو، تمیزکاری، تفکیک، همگن‌سازی، خشک‌کردن انواع محصولات مانند چای، کشمش و خرما با روش‌های مختلف، تفت‌دادن مانند پخت نخود و پنبه‌پاک‌کنی، فرآوری محصولات کشاورزی محسوب نمی‌شود. ارائه خدمات مزبور به محصولات کشاورزی مشمول مالیات و عوارض فروش نیست.\n\n**جزء ۲**\n\n۲ ـ دام زنده و خوراک آن، کلیه مواد اصلی تولید مثل دام زنده مطابق پروانه صادره توسط وزارت جهاد کشاورزی، پوسال (کمپوست)، کشت بافت و بستر آماده کشت بافت;\n\n- **تبصره:** دام به حیواناتی (شامل چهارپایان، پرندگان، آبزیان و حشرات) اطلاق می‌گردد که برای امور تغذیه انسان یا دام و فعالیت‌های اقتصادی، تولیدی و آزمایشگاهی، تولید، نگهداری و پرورش داده می‌شوند.\n\n**جزء ۳**\n\n۳ ـ بذر، نشاء، نهال، سم و کود;\n\n**جزء ۴**\n\n۴ ـ آب مصارف کشاورزی;\n\n**جزء ۵**\n\n۵ ـ کالاهای زیر:\n\n- ۵ ـ ۱ ـ شیر، پنیر و ماست;\n\n- ۵ ـ ۲ ـ تخم ماکیان;\n\n- ۵ ـ ۳ ـ آرد و نان;\n\n- ۵ ـ ۴ ـ انواع گوشت و فرآورده‌های گوشتی مطابق با فهرستی که هر سال وزارت بهداشت، درمان و آموزش پزشکی تا پایان دی‌ماه برای اجراء در سال بعد به سازمان ارسال می‌کند;\n\n- ۵ ـ ۵ ـ برنج، حبوبات، سویا و پروتئین سویا;\n\n- ۵ ـ ۶ ـ انواع روغن‌های خوراکی; اعم از گیاهی و حیوانی;\n\n- ۵ ـ ۷ ـ شیرخشک مخصوص تغذیه کودکان;\n\n- ۵ ـ ۸ ـ تخم مرغ نطفه‌دار و تبدیل آن به جوجه یک‌روزه;\n\n**جزء ۶**\n\n۶ ـ انواع کالاهای زیر:\n\n- ۶ ـ ۱ ـ خمیر کاغذ و کاغذ باطله;\n\n- ۶ ـ ۲ ـ دفتر تحریر;\n\n- ۶ ـ ۳ ـ کاغذ چاپ، تحریر و روزنامه;\n\n**جزء ۷**\n\n۷ ـ نسخه‌های کاغذی و الکترونیکی محصولات زیر:\n\n- ۷ ـ ۱ ـ کتاب;\n\n- ۷ ـ ۲ ـ روزنامه;\n\n- ۷ ـ ۳ ـ مجله و نشریه;\n\n**جزء ۸**\n\n۸ ـ کالاهای وارده همراه مسافر برای استفاده شخصی تا میزان معافیت مقرر طبق قانون امور گمرکی;\n\n**جزء ۹**\n\n۹ ـ انواع شمش طلا (وارداتی و داخلی) و انواع حواله‌های کاغذی یا الکترونیکی دارای پشتوانه صد درصد (۱۰۰%) طلا;\n\n**جزء ۱۰**\n\n۱۰ ـ دارایی‌های غیرمنقول و انواع حواله‌های کاغذی یا الکترونیکی مبتنی بر آنها;\n\n**جزء ۱۱**\n\n۱۱ ـ هرگونه انتقال دارایی به/ از صندوق‌های سرمایه‌گذاری پروژه موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی مصوب ۱۳۸۸/۰۹/۲۵ یا شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه، به‌عنوان آورده غیرنقد شرکا در همان صندوق‌های سرمایه‌گذاری پروژه;\n\n- **تبصره:** در صورتی که مالکیت و مدیریت شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه متعلق به صندوق‌های سرمایه‌گذاری پروژه موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی باشد، هرگونه انتقال دارایی به/ از شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه که صرفاً در راستای اجرای پروژه و مرتبط با وظایف صندوق‌های مذکور باشد، مشمول مالیات و عوارض نیست.\n\n**جزء ۱۲**\n\n۱۲ ـ هرگونه انتقال دارایی از/ به نهاد واسط موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی;\n\n**جزء ۱۳**\n\n۱۳ ـ فرش دستباف و مواد اولیه اصلی آن;\n\n**جزء ۱۴**\n\n۱۴ ـ صنایع دستی تولید داخل موضوع ماده (۱) قانون حمایت از هنرمندان، استادکاران و فعالان صنایع دستی مصوب ۱۳۹۶/۱۰/۲۶ مطابق فهرستی که تا پایان دی‌ماه هر سال توسط وزارت میراث فرهنگی، گردشگری و صنایع دستی پیشنهاد می‌شود و به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد;\n\n**جزء ۱۵**\n\n۱۵ ـ انواع دارو و واکسن (انسانی و دامی)، لوازم مصرفی درمانی و لوازم توانبخشی;\n\n**جزء ۱۶**\n\n۱۶ ـ رادار و تجهیزات کمک ناوبری هوانوردی، تجهیزات نظامی و اطلاعاتی موضوع بندهای «پ»، «ت» و «ث» ماده (۱۱۹) قانون امور گمرکی با رعایت ترتیبات مقرر در بندهای مذکور.\n\n- **تبصره:** معافیت این جزء در خصوص اقلام موضوع بند «پ» ماده (۱۱۹) قانون امور گمرکی در حوزه دفاعی با تأیید وزارت دفاع و پشتیبانی نیروهای مسلح قابل اعمال است.\n\n**جزء ۱۷**\n\n۱۷ ـ تجهیزات و اقلام با کاربرد صرفاً دفاعی، نظامی، انتظامی، امنیتی و اطلاعاتی. فهرست این تجهیزات و اقلام با پیشنهاد وزارت دفاع و پشتیبانی نیروهای مسلح و هماهنگی ستاد کل نیروهای مسلح به‌تصویب هیأت وزیران می‌رسد.\n\n- **تبصره ۱:** واردات کالاهای موضوع جزءهای (۲)، (۶)، (۷)، (۹)، (۱۳)، (۱۶) و (۱۷) بند «الف» این ماده معاف از پرداخت مالیات و عوارض می‌باشد. واردات کالاهای موضوع جزءهای (۱)، (۳) و (۵) بند «الف» این ماده مشمول معافیت نبوده و مالیات و عوارض با نرخ استاندارد نه درصد (۹%) در مبادی گمرکی به آن تعلق می‌گیرد. عرضه این کالاها در داخل کشور، مانند عرضه کالاهای مشابه داخلی از پرداخت مالیات و عوارض معاف است. در خصوص جزء (۱۵) این بند، در صورتی که با تأیید وزیر بهداشت، درمان و آموزش پزشکی کالای مورد نظر مشابه داخلی نداشته باشد، واردات آن از پرداخت مالیات و عوارض معاف می‌باشد و اگر واردات کالای موردنظر به دلیل کمبود تولید داخل نسبت به نیاز بازار، ضرورت داشته باشد، واردات کالای مزبور با رعایت قانون حداکثر استفاده از توان تولیدی و خدماتی کشور و حمایت از کالای ایرانی، مشمول مالیات و عوارض با نرخ سه‌درصد (۳%) در مبادی گمرکی می‌باشد. عرضه این کالاها در داخل کشور، مانند عرضه کالاهای مشابه داخلی از پرداخت مالیات و عوارض معاف است.\n\n- **تبصره ۲:** تولیدکنندگان و یا عرضه‌کنندگان کالاهای موضوع این بند مکلفند که برچسب معافیت از مالیات بر ارزش افزوده را بر روی بسته‌بندی کالاهای مذکور درج نمایند. سازمان مکلف است فهرست کالاها و خدمات معاف از مالیات و عوارض را از طریق شیوه‌های مناسب از جمله درج در سامانه عملیات الکترونیکی سازمان به اطلاع عموم مردم برساند. سازمان مکلف است امکان دریافت گزارش‌های مردمی مبنی بر دریافت مالیات و عوارض توسط عرضه‌کنندگان کالاها و خدمات معاف از مالیات و عوارض را از طریق سامانه عملیات الکترونیکی خود و استرداد مبالغ اضافه دریافتی از خریداران فراهم نماید. دریافت مالیات و عوارض از کالاها و خدمات معاف توسط عرضه‌کنندگان آنها مشمول جریمه‌ای معادل دو برابر مالیات و عوارض دریافتی بوده و قابل بخشودگی نمی‌باشد. سازمان مکلف است حداکثر سه ماه پس از دریافت گزارش، نسبت به تأیید یا رد و حسب مورد استرداد مبالغ اضافه دریافتی از خریداران اقدام نماید. نحوه استرداد این مبالغ به موجب دستورالعملی است که حداکثر پس از سه ماه از لازم‌الاجراء شدن این قانون توسط سازمان با همکاری اتاق بازرگانی، صنایع، معادن و کشاورزی ایران تهیه و به تصویب وزیر امور اقتصادی و دارایی می‌رسد.\n\n- **تبصره ۳:** واردات کالاهای اهدایی به صورت بلاعوض به جمعیت هلال احمر جمهوری اسلامی ایران، سازمان اورژانس کشور، سازمان بهزیستی کشور، آستان‌های مقدسه و کمیته امداد امام خمینی (ره) با تأیید وزیر امور اقتصادی و دارایی، حوزه‌های علمیه با تأیید مرکز مدیریت حوزه علمیه استان مربوط و مؤسسات خیریه با اعلام مراجع صادرکننده مجوز آنها و تأیید وزیر امور اقتصادی و دارایی از پرداخت مالیات و عوارض معاف است;\n\n- **تبصره ۴:** اعمال معافیت‌های مالیاتی در خصوص مواد خوراکی مذکور در اجزای این بند، منوط به أخذ گواهی سلامت محصول از مراجع قانونی ذی‌صلاح از قبیل سازمان ملی استاندارد ایران و سازمان غذا و دارو است.\n\n#### ب ـ خدمات\n\n**جزء ۱**\n\n۱ ـ خدمات درمانی، تشخیصی و پیشگیری، خدمات توانبخشی و حمایتی و خدمات آرامستان‌ها;\n\n**جزء ۲**\n\n۲ ـ خدمات درمانی و پیشگیری دامی و گیاهی، واحدهای ماشینی‌کردن (مکانیزاسیون) آب کشاورزی، کشت بافت و تولید اندام‌های تکثیری گیاهان;\n\n**جزء ۳**\n\n۳ ـ خدمات زینک، چاپ، انتشار روزنامه اعم از کاغذی یا الکترونیکی، کتاب، نشریه و خدمات نشر و توزیع آنها به استثنای مؤسسات کمک آموزشی و کنکور و هرگونه تبلیغات کالاها و خدمات داخلی در روزنامه‌ها و نشریات;\n\n**جزء ۴**\n\n۴ ـ ارائه خدماتی که مابه‌ازای آن به صورت حقوق و دستمزد پرداخت می‌شود در صورتی که مشمول فصل مالیات بر درآمد حقوق موضوع قانون مالیات‌های مستقیم باشد;\n\n- **تبصره:** در ارائه خدمت توسط شرکت‌های تأمین نیروی انسانی و شرکت‌هایی که از طریق قراردادهای حجمی خدمات خود را با در اختیار گذاشتن نیروی کار به متقاضی ارائه می‌کنند (مانند شرکت‌های ارائه‌دهنده خدمات پرستاری و خدمات نظافتی)، بخشی از قرارداد که مربوط به هزینه‌های حقوق و دستمزد است، معاف می‌باشد. حکم این بند مشروط به تأیید میزان حقوق و دستمزد و مزایا توسط سازمان بیمه‌گر است.\n\n**جزء ۵**\n\n۵ ـ عملیات و خدمات بانکی شامل دریافت سپرده، اعطای تسهیلات و یا ایجاد اعتبار، ارائه ضمانت‌نامه و انتقال وجه در چهارچوب قوانین مربوط و مصوبات شورای پول و اعتبار;\n\n**جزء ۶**\n\n۶ ـ خدمات اعتباری قرض‌الحسنه صندوق‌های قرض‌الحسنه دارای مجوز فعالیت از بانک مرکزی جمهوری اسلامی ایران یا سایر مراجع مورد تأیید بانک مذکور و همچنین صندوق‌های قرض‌الحسنه که به موجب قانون تأسیس شده یا می‌شوند;\n\n**جزء ۷**\n\n۷ ـ خدمات مالی و اعتباری اعطای تسهیلات توسط صندوق‌های حمایتی، ضمانت صادرات، سرمایه‌گذاری، بیمه‌ای و پژوهش و فناوری که به موجب قانون یا با مجوز قانون تأسیس شده یا می‌شوند در چهارچوب اساسنامه آنها.\n\n**جزء ۸**\n\n۸ ـ خدمات بیمه‌های زندگی، خدمات بیمه‌های محصولات کشاورزی، خدمات بیمه اجتماعی و درمان تکمیلی;\n\n**جزء ۹**\n\n۹ ـ خدمات بازار سرمایه شامل خدمات معاملات و تسویه اوراق بهادار و کالا در بورس‌ها و بازارهای خارج از بورس به تشخیص شورای‌عالی بورس و اوراق بهادار.\n\n**جزء ۱۰**\n\n۱۰ ـ خدمات انتشار و نقل و انتقال سهام، حق تقدم، سهم‌الشرکه و سایر اوراق بهادار موضوع بند (۲۴) ماده (۱) قانون بازار اوراق بهادار جمهوری اسلامی ایران مصوب ۱۳۸۴/۰۹/۰۱ با اصلاحات بعدی;\n\n**جزء ۱۱**\n\n۱۱ ـ صدور و ابطال، نقل و انتقال واحدهای سرمایه‌گذاری صندوق‌های سرمایه‌گذاری دارای مجوز از سازمان بورس اوراق بهادار;\n\n**جزء ۱۲**\n\n۱۲ ـ منحصراً سود تسهیلات اعطائی شرکت‌های واسپاری (لیزینگ) دارای مجوز فعالیت از بانک مرکزی جمهوری اسلامی ایران به مشتریان (مصرف‌کنندگان).\n\n- **تبصره:** مالیات بر ارزش افزوده بهای دارایی‌ها و اموال مورد واگذاری موضوع قرارداد شرکت‌های واسپاری (لیزینگ) با مشتریان مشمول این فعالیت نمی‌باشند.\n\n**جزء ۱۳**\n\n۱۳ ـ خدمات حمل و نقل (اعم از بار و مسافر) درون و برون‌شهری و بین‌المللی جاده‌ای، ریلی و دریایی;\n\n**جزء ۱۴**\n\n۱۴ ـ خدمات آموزشی، پژوهشی و ورزشی دارای مجوز از مراجع ذی‌صلاح طبق آیین‌نامه‌ای که با پیشنهاد مشترک وزارتخانه‌های امور اقتصادی و دارایی (سازمان)، علوم، تحقیقات و فناوری، آموزش و پرورش، تعاون، کار و رفاه اجتماعی، بهداشت، درمان و آموزش پزشکی، ورزش و جوانان و دفاع و پشتیبانی نیروهای مسلح و مرکز مدیریت حوزه‌های علمیه ظرف شش‌ماه از تاریخ ابلاغ این قانون تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد;\n\n**جزء ۱۵**\n\n۱۵ ـ خدمات اقامتی هتل‌های سه ستاره و پایین‌تر، مهمانپذیرها و سایر مراکز اقامتی دارای مجوز از وزارت میراث فرهنگی، گردشگری و صنایع دستی یا اتحادیه‌های ذی‌ربط;\n\n**جزء ۱۶**\n\n۱۶ ـ قدرالسهم هزینه مشترک (شارژ) دریافتی توسط شرکت‌های خدماتی موضوع قانون نحوه واگذاری مالکیت و اداره امور شهرک‌های صنعتی مصوب ۱۳۸۷/۰۲/۳۱ از واحدهای تولیدی، صنعتی و خدماتی مستقر در شهرک‌های صنعتی بابت ارائه خدمات به آنها.\n\n**جزء ۱۷**\n\n۱۷ ـ خدمات فنی، بازسازی، تعمیر و نگهداری کالاهای موضوع جزء (۱۷) بند «الف» این ماده که توسط مرکز وابسته به دستگاه‌های نظامی، انتظامی و امنیتی ارائه می‌شود، مطابق فهرستی که با تصویب وزرای دفاع و پشتیبانی نیروهای مسلح و امور اقتصادی و دارایی ابلاغ می‌شود.\n\n- **تبصره:** در مواردی که دریافت وجه توسط یک مودی مستند به فروش کالا یا ارائه خدمت نیست، مانند دریافت هرگونه خسارت، درآمدهای حاصل از تسعیر دارایی‌های ارزی، انواع سود، انواع جریمه (مادامی که بخشی از بهای کالا و خدمات تلقی نگردد)، آورده نقدی یا غیرنقدی به‌عنوان سرمایه و انواع کمک‌های دولتی، عرضه خدمت محسوب نمی‌شود و مأخذ محاسبه مالیات و عوارض نمی‌باشد."},{"t":"ماده ۱۰","x":"موارد زیر از پرداخت مالیات و عوارض معاف هستند و مالیات و عوارض خرید نهاده‌های آنها مسترد می‌شود:\n\n- **بند الف ـ** صادرات کالاها به خارج از کشور از طریق مبادی خروجی رسمی با ارائه پروانه سبز گمرکی صادره توسط گمرک یا برگ خروجی (در مورد صادرات کالا) و صادرات خدمات با ارائه قرارداد مربوط و گواهی انجام کار که به تأیید نزدیک‌ترین نمایندگی رسمی جمهوری اسلامی ایران
