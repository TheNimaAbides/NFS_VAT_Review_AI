امور مالیاتی استان و حساب تمرکز وجوه وزارت کشور واریز می‌شود.\n\n- **تبصره:** عوارض و جریمه‌های سهم شهرداری‌ها، دهیاری‌ها و روستاهای فاقد دهیاری موضوع این قانون به حساب‌های رابطی که بنا به درخواست سازمان و وزارت کشور توسط خزانه‌داری کل کشور حسب مورد به نام حساب تمرکز وجوه اداره کل مالیاتی استان و وزارت کشور افتتاح می‌گردد، واریز می‌شود. عوارض سهم شهرداری‌ها، دهیاری‌ها و روستاهای فاقد دهیاری و جریمه‌های متعلق به آن، درآمد دولت نبوده و سازمان موظف است صددرصد (۱۰۰%) آن را مطابق با مقررات ماده (۳۹) این قانون به صورت ماهانه به حساب‌های ذی‌ربط مذکور واریز نماید."},{"t":"ماده ۳۹","x":"سهم شهرداری‌ها، دهیاری‌ها، روستاهای فاقد دهیاری و مناطق عشایری، بر اساس ترتیبات ذیل به حساب تمرکز وجوه وزارت کشور و حساب تمرکز وجوه اداره کل امور مالیاتی استان ذی‌ربط نزد خزانه‌داری کل کشور برای توزیع بین شهرداری‌ها و دهیاری‌ها واریز می‌شود:\n\n- **بند الف ـ** نود درصد (۹۰%) از عوارض و جریمه‌های مربوط به ماده (۷) و بندهای «ب» و «پ» ماده (۲۶) این قانون پس از واریز به حساب تمرکز وجوه اداره کل امور مالیاتی استان بر اساس شاخص جمعیت میان شهرداری‌ها، دهیاری‌ها، اداره امور عشایر هر شهرستان (سهم مناطق عشایری) و فرمانداری‌های همان استان (سهم روستاهای فاقد دهیاری) توزیع و ده درصد (۱۰%) مابقی به حساب تمرکز وجوه وزارت کشور واریز تا به موجب آیین‌نامه‌ای که براساس شاخص‌های توسعه‌نیافتگی سه ماه پس از لازم‌الاجراء شدن این قانون توسط سازمان برنامه و بودجه کشور و وزارت کشور تهیه می‌شود و به تصویب هیأت وزیران می‌رسد بین شهرداری‌ها، دهیاری‌ها، اداره امور عشایر شهرستان (سهم مناطق عشایری) و روستاهای فاقد دهیاری (به حساب فرمانداری‌ها) توزیع گردد.\n\n- **بند ب ـ** عوارض و جریمه‌های مربوط به بندهای «الف» و «ت» ماده (۲۶) و ماده (۲۸) این قانون به حساب تمرکز وجوه وزارت کشور واریز می‌شود تا به نسبت دوازده درصد (۱۲%) سهم کلان‌شهرها، پنجاه و سه درصد (۵۳%) سهم سایر شهرها و سی و پنج درصد (۳۵%) سهم روستاها و مناطق عشایری و بر اساس شاخص‌های جمعیت و توسعه‌نیافتگی مذکور در بند «الف» این ماده توزیع گردد. دستورالعمل اجرائی این بند توسط وزارت کشور با همکاری سازمان برنامه و بودجه کشور تهیه و ابلاغ می‌شود.\n\n- **تبصره ۱:** سهم روستاهای فاقد دهیاری به حساب فرمانداری شهرستان مربوط واریز می‌شود تا با مشارکت سایر دستگاه‌های اجرائی مربوطه برای امور عمرانی و آبادانی همان روستاها هزینه شود. دستورالعمل اجرائی این تبصره ظرف سه‌ماه پس از ابلاغ این قانون توسط وزارت کشور و وزارت امور اقتصادی و دارایی (سازمان) تصویب می‌شود.\n\n- **تبصره ۲:** سهم مناطق عشایری از عوارض و جریمه‌های مربوط به مواد (۷) و (۲۶) این قانون به اداره کل امور عشایر هر استان واریز می‌شود تا براساس شاخص جمعیت میان مناطق عشایری توزیع گردد.\n\n- **تبصره ۳:** در راستای اجرای احکام این ماده شهرهای جدید تازه تأسیس فاقد شهرداری از نظر موضوع این ماده حسب مورد واجد شهرداری تلقی می‌شوند.\n\n- **تبصره ۴:** محل أخذ مالیات ارزش افزوده واحدهای تولیدی محل استقرار آنها می‌باشد.\n\n- **تبصره ۵:** سهم شهرداری‌ها و دهیاری‌ها از محل منابع حاصل از بندهای «پ» و «ت» ماده (۲۶) این قانون باید مطابق با سیاست‌های ابلاغی شورای عالی سلامت و امنیت غذایی هزینه گردد. تصمیم‌گیری در خصوص نحوه هزینه‌کرد منابع مزبور در کلان‌شهرها برعهده کمیته‌ای متشکل از فرماندار، شهردار و نماینده وزارت بهداشت، درمان و آموزش پزشکی است.\n\n- **تبصره ۶:** هرگونه برداشت از حساب تمرکز وجوه به‌جز پرداخت به شهرداری‌ها و دهیاری‌ها و اشخاص مذکور در این ماده ممنوع است.\n\n- **تبصره ۷:** سهم عوارض ارزش افزوده دریافتی از شرکت‌های فناور مستقر در پارک‌های علم و فناوری پس از واریز به خزانه‌داری کل کشور، به صورت صد درصد (۱۰۰%) به همان پارک بابت ایجاد، توسعه و نگهداری زیرساخت‌ها و فضاهای عمومی، آموزشی، پژوهشی و فناوری و ارائه خدمات شهری اختصاص می‌یابد. آیین‌نامه اجرائی این تبصره ظرف سه ماه از تاریخ لازم‌الاجراءشدن این قانون توسط معاونت علمی و فناوری ریاست جمهوری با همکاری وزارت علوم، تحقیقات و فناوری و وزارت بهداشت، درمان و آموزش پزشکی تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد.\n\n- **تبصره ۸:** کارگروهی مرکب از وزارت کشور، سازمان و یک ناظر از مجلس شورای اسلامی برای نظارت بر حسن اجرای این ماده تشکیل و گزارش عملکرد این ماده همه‌ساله توسط سازمان و وزارت کشور به کمیسیون اقتصادی مجلس شورای اسلامی ارائه می‌گردد.\n\n- **تبصره ۹:** سازمان مکلف است در مقاطع سه‌ماهه میزان وصول مالیات بر ارزش افزوده و سهم هریک از شهرداری‌ها، دهیاری‌ها، فرمانداری‌ها و مناطق عشایری را از طرق مناسب به اطلاع عموم مردم برساند."},{"t":"ماده ۴۰","x":"عوارض و جریمه‌های آلایندگی موضوع ماده (۲۷) این قانون پس از واریز به حساب تمرکز وجوه اداره کل امور مالیاتی استان برای هر شهرستان به نسبت جمعیت بین شهرداری‌ها، دهیاری‌ها و فرمانداری‌های (سهم روستاهای فاقد دهیاری و مناطق عشایری) همان شهرستان توزیع می‌گردد. در صورتی که آلودگی واحدهای بزرگ تولیدی (پنجاه نفر و بیشتر) به بیش از یک شهرستان در یک استان سرایت کند، عوارض آلایندگی هر شهرستان به نسبت جمعیت، اثرپذیری و فاصله از واحد آلاینده، در کمیته‌ای مرکب از رئیس سازمان برنامه و بودجه استان و فرمانداران شهرستان‌های ذی‌ربط، مدیرکل محیط‌زیست و مدیرکل امور مالیاتی استان بین شهرستان‌های متأثر توزیع می‌شود.\n\n- **تبصره ۱:** در صورتی که شهرستان‌های متأثر از آلودگی در دو یا چند استان واقع شده باشند، اعضای کمیته توزیع‌کننده عوارض آلودگی واحدهای بزرگ (پنجاه نفر و بیشتر) متشکل از نماینده سازمان برنامه و بودجه کشور، رؤسای سازمان‌های مدیریت و برنامه‌ریزی استان‌های ذی‌ربط، نماینده سازمان حفاظت محیط‌زیست و نماینده ادارات کل امور مالیاتی استان‌های مربوطه براساس سیاست‌های اعلامی سازمان برنامه و بودجه کشور اقدام به توزیع عوارض آلایندگی می‌کنند.\n\n- **تبصره ۲:** عوارض و جریمه‌های آلایندگی در مناطق آزاد تجاری ـ صنعتی و ویژه اقتصادی در مواردی که شهرداری و یا دهیاری در مناطق مذکور مستقر نمی‌باشد، حسب مورد به حساب منطقه آزاد تجاری ـ صنعتی و یا ویژه اقتصادی مربوط واریز می‌گردد."},{"t":"ماده ۴۱","x":"عوارض و جریمه‌های موضوع بندهای «الف» و «ب» ماده (۲۹) این قانون مستقیماً به حساب شهرداری‌ها و یا دهیاری‌های محل سکونت مالک که هنگام صدور پلاک انتظامی ثبت شده است، واریز می‌گردد. شهرداری‌های شهرهای آلوده مکلفند صددرصد (۱۰۰%) درآمد حاصل از عوارض موضوع بند «ب» ماده (۲۹) این قانون را برای کمک به توسعه و نوسازی ناوگان حمل‌ونقل عمومی شهرهای آلوده هزینه نمایند."},{"t":"ماده ۴۲","x":"معادل دوازده در هزار ارزش گمرکی کالاهای وارداتی که حقوق ورودی آنها وصول می‌شود، توسط گمرک جمهوری اسلامی ایران به حساب تمرکز وجوه وزارت کشور واریز شده تا به نسبت سیزده درصد (۱۳%) کلان‌شهرها، سی و پنج درصد (۳۵%) دهیاری‌ها و روستاهای فاقد دهیاری و عشایر و پنجاه و دو درصد (۵۲%) سایر شهرداری‌ها و بر اساس شاخص‌هایی که با پیشنهاد وزارت کشور به تصویب هیأت دولت می‌رسد، صرف کمک و ایجاد درآمد پایدار برای شهرداری‌ها و دهیاری‌ها و روستاهای فاقد دهیاری و عشایر گردد. وزارت کشور مکلف است وصولی هر ماه را تا پانزدهم ماه بعد براساس سهم‌های تعیین‌شده به حساب شهرداری‌ها و دهیاری‌ها واریز نماید و هرگونه برداشت از حساب تمرکز وجوه به جز پرداخت به شهرداری‌ها و دهیاری‌ها و روستاهای فاقد دهیاری و عشایر ممنوع است."},{"t":"ماده ۴۳","x":"یک‌نهم مالیات‌ها و عوارض وصولی موضوع ماده (۷) و بندهای «الف» و «ب» ماده (۲۶) این قانون به‌عنوان «مالیات سلامت»، همزمان با دریافت توسط سازمان امور مالیاتی، به حساب خزانه‌داری کل کشور واریز می‌گردد. خزانه مکلف است مبالغ دریافتی هر ماه را تا پایان پانزدهم ماه بعد به حساب وزارت بهداشت، درمان و آموزش پزشکی واریز نماید. عدم تخصیص مبلغ مذکور در حکم تصرف غیرمجاز در اموال عمومی است. صد درصد (۱۰۰%) منابع دریافتی موضوع این ماده از طریق ردیف یا ردیف‌هایی که برای این منظور در قوانین بودجه سنواتی پیش‌بینی می‌شود به پیشگیری و پوشش کامل درمان افراد ساکن در روستاها و شهرهای دارای بیست هزار نفر جمعیت و پایین‌تر و جامعه عشایری (در چهارچوب نظام ارجاع)، اختصاص می‌یابد و پس از تحقق هدف مذکور نسبت به تکمیل و تأمین تجهیزات بیمارستانی و مراکز بهداشتی و درمانی با اولویت بیمارستان‌های مناطق توسعه‌نیافته، مصارف هیأت امنای ارزی و ارتقای سطح بیمه بیماران صعب‌العلاج و افراد تحت پوشش نهادهای حمایتی خارج از روستاها و شهرهای بالای بیست هزار نفر جمعیت اقدام می‌شود. هرگونه پرداخت هزینه‌های نیروی انسانی نظیر حقوق و مزایا، اضافه کار، کمک‌های رفاهی، پاداش، فوق‌العاده‌های مأموریت، کارانه، بهره‌وری، مدیریت، نوبت‌کاری، دیون و مانند آن و هزینه‌های اداری نظیر اقلام مصرفی اداری و تأمین اثاثیه و منصوبات اداری از این محل ممنوع است."},{"t":"ماده ۴۴","x":"منابع حاصل از مالیات‌های موضوع مواد (۳۰) و (۳۱) این قانون سهم دولت است و به حساب خزانه‌داری کل کشور واریز می‌شود."},{"t":"ماده ۴۵","x":"دولت موظف است از محل منابع حاصل از مالیات دریافتی سهم خود موضوع ماده (۷) این قانون، سالانه مجموع کمک‌های نقدی پرداختی به هر فرد تحت پوشش نهادهای حمایتی را علاوه بر سایر افزایش‌های سنواتی، حداقل معادل نرخ مالیات بر ارزش افزوده افزایش داده و به منظور جبران مالیات دریافتی به افراد مذکور پرداخت نماید. نهادهای حمایتی مذکور مکلفند نسبت به شناسایی اشخاص نیازمندی که تحت پوشش نیستند، اقدام و آنها را مشمول دریافت افزایش مذکور نمایند. آیین‌نامه اجرائی این ماده شامل چگونگی شناسایی اشخاص نیازمند و نحوه حمایت از آنها حداکثر سه ماه پس از لازم‌الاجراء شدن این قانون توسط وزارت تعاون، کار و رفاه اجتماعی با همکاری سازمان بهزیستی کشور و کمیته امداد امام خمینی (ره) تهیه و به تصویب هیأت وزیران می‌رسد."}]},{"h":"فصل دهم: سایر مقررات (از ماده ۴۶ تا ماده ۵۷)","a":[{"t":"ماده ۴۶","x":"کلیه عوارض و مالیات موضوع این قانون که توسط گمرک جمهوری اسلامی ایران به صورت قطعی وصول و به حساب‌های مربوطه واریز می‌شود، مشمول حکم ماده (۱۶۰) قانون امور گمرکی می‌باشد."},{"t":"ماده ۴۷","x":"پرونده‌های مالیات بر ارزش افزوده که تاریخ تعلق آنها قبل از لازم‌الاجراء شدن این قانون است، از نظر تعیین مأخذ مشمول مالیات و نرخ مالیات، جرایم و تکالیف مودیان و مأموران مالیاتی و نحوه رسیدگی تابع قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ می‌باشد، اما در مورد رفع اختلاف سازمان با مودی، قطعیت، وصول، توزیع و تسویه، تابع احکام و مقررات این قانون است."},{"t":"ماده ۴۸","x":"متن زیر جایگزین ماده (۲۳۸) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۳۸ ـ در مواردی که برگ تشخیص مالیات صادر و به مودی ابلاغ می‌شود، چنانچه مودی نسبت به آن معترض باشد می‌تواند ظرف سی‌روز از تاریخ ابلاغ شخصاً یا به وسیله وکیل تام‌الاختیار خود با ارائه دلایل و اسناد و مدارک کتباً از اداره امور مالیاتی تقاضای رسیدگی مجدد نماید.\n\n>\n\n> مسوول/مسوولان مربوط که از طرف سازمان امور مالیاتی مشخص می‌شوند، موظفند پس از ثبت درخواست مودی و ظرف مهلتی که بیش از چهل و پنج روز از تاریخ ثبت درخواست نباشد به موضوع رسیدگی و در صورتی که دلایل و اسناد و مدارک ابرازشده را برای رد مندرجات برگ تشخیص کافی دانستند، آن را رد و در صورتی که دلایل و اسناد و مدارک ابرازی را مؤثر در تعدیل درآمد تشخیص دهند موارد تعدیل درآمد مشمول مالیات را مشخص نمایند. چنانچه مودی نظر مسوول/مسوولان مربوط در تعدیل درآمد مشمول مالیات را قبول نماید درآمد مشمول مالیات تعدیل‌شده، قطعی است. در غیر این صورت برای رسیدگی به مابه‌التفاوت تا مبلغ مورد اعتراض مودی، موضوع به هیأت حل اختلاف مالیاتی ارجاع می‌شود. همچنین هرگاه دلایل و اسناد و مدارک ابرازی مودی را برای رد برگ تشخیص یا تعدیل درآمد مؤثر تشخیص ندهند باید موضوع را مستدلاً در پرونده منعکس و مراتب را برای رسیدگی به هیأت حل اختلاف مالیاتی ارجاع نمایند.\n\n>\n\n> **تبصره ۱ ـ** دستورالعمل اجرائی این ماده با پیشنهاد سازمان امور مالیاتی به تصویب وزیر امور اقتصادی و دارایی می‌رسد.\n\n>\n\n> **تبصره ۲ ـ** در مواردی که مودی اطلاعات مربوطه را از طریق سامانه مودیان اظهار کرده باشد، مطابق احکام قانون سامانه مودیان و پایانه‌های فروشگاهی رفتار خواهد شد.»"},{"t":"ماده ۴۹","x":"متن زیر جایگزین تبصره ماده (۲۳۹) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> **تبصره ـ** در مواردی که برگ تشخیص مالیات طبق مقررات تبصره (۱) و قسمت أخیر تبصره (۲) ماده (۲۰۳) و ماده (۲۰۸) این قانون ابلاغ شده باشد و مودی به شرح مقررات این ماده اقدام نکرده باشد در حکم معترض به برگ تشخیص مالیات شناخته می‌شود و پرونده امر برای رسیدگی به هیأت حل اختلاف مالیاتی ارجاع می‌گردد.»"},{"t":"ماده ۵۰","x":"متن زیر جایگزین ماده (۲۴۴) قانون مالیات‌های مستقیم و تبصره‌های آن می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۴۴ ـ مرجع رسیدگی به کلیه اختلاف‌های مالیاتی جز در مواردی که ضمن مقررات این قانون مرجع دیگری پیش‌بینی شده، هیأت حل اختلافات مالیاتی است. هر هیأت حل اختلاف مالیاتی از سه نفر به شرح زیر تشکیل می‌شود:\n\n>\n\n> ۱. یک نفر نماینده سازمان امور مالیاتی کشور؛\n\n>\n\n> ۲. یک نفر از میان قضات بازنشسته یا حقوق‌دانان مطلع در امور مالیاتی با شرط وثاقت و امانت به درخواست سازمان امور مالیاتی و انتخاب رئیس کل دادگستری هر استان؛\n\n>\n\n> ۳. یک نفر نماینده از اتاق بازرگانی، صنایع و معادن و کشاورزی ایران، اتاق تعاون ایران، جامعه حسابداران رسمی ایران، جامعه مشاوران رسمی مالیاتی ایران، مجامع حرفه‌ای، اتاق اصناف ایران، شورای اسلامی شهر، کانون وکلا، مرکز وکلا، کارشناسان رسمی و مشاوران خانواده که برای مدت سه سال منصوب می‌شوند. مودی همزمان با اعتراض به برگ تشخیص یا مطالبه مالیات یکی از مراجع این بند را به‌عنوان نماینده خود جهت شرکت در جلسات هیأت حل اختلاف مالیاتی معرفی می‌نماید. در صورتی که برگ تشخیص مالیات ابلاغ قانونی شده باشد و یا همزمان با تسلیم اعتراض به برگ تشخیص در مهلت قانونی مودی انتخاب خود را اعلام ننماید، با توجه به نوع فعالیت مودی یا موضوع مالیات مورد رسیدگی، از بین نمایندگان مزبور با رعایت تبصره (۵) این ماده یک نفر انتخاب می‌شود.\n\n>\n\n> **تبصره ۱ ـ** جلسات هیأت‌های حل اختلاف مالیاتی با حضور هر سه عضو رسمیت می‌یابد و رأی هیأت با اکثریت آراء قطعی و لازم‌الاجراء است، ولی نظر اقلیت باید در متن رأی قید گردد.\n\n>\n\n> **تبصره ۲ ـ** هیأت‌های حل اختلاف مالیاتی دارای استقلال کامل بوده و صرفاً اداره امور دبیرخانه‌ای هیأت‌های حل اختلاف مالیاتی و تشکیل جلسات هیأت‌ها به عهده سازمان امور مالیاتی می‌باشد. انشای رأی با رعایت اصل عدالت و بی‌طرفی کلیه اعضا و متکی به اسناد و مدارک مثبته و دلایل و شواهد متقن در همان جلسه و یا حداکثر ظرف سه روز کاری پس از برگزاری جلسه، توسط نماینده بند (۲) این ماده به عمل آمده و به امضای تمامی اعضا می‌رسد. مودی یا نماینده قانونی وی مجاز به حضور کامل در جلسه و ارائه دفاعیات به صورت کتبی یا شفاهی است. اظهارات شفاهی باید در صورت‌جلسه قید و به امضای وی برسد. سازمان امور مالیاتی به‌منظور اعمال نظارت مؤثر بر عملکرد هیأت‌های حل اختلاف مالیاتی، مکلف است نسبت به مستندسازی فرآیند برگزاری جلسات هیأت به نحو مقتضی اقدام کند.\n\n>\n\n> **تبصره ۳ ـ** تعیین حق‌الزحمه اعضای موضوع بندهای (۲) و (۳) این ماده متناسب با تعداد و مدت جلسات و نیز مراحل، منابع مالیاتی و پرونده‌های مورد رسیدگی از محل اعتباری که به همین منظور در بودجه سالانه سازمان امور مالیاتی کشور پیش‌بینی می‌شود، مطابق دستورالعملی است که توسط سازمان مذکور تهیه و ابلاغ می‌گردد. حق‌الزحمه اعضا به صورت متمرکز از طرف سازمان امور مالیاتی کشور به حساب اعضا پرداخت می‌شود.\n\n>\n\n> **تبصره ۴ ـ** سازمان امور مالیاتی مکلف است نمایندگان معرفی‌شده در اجرای بندهای (۲) و (۳) این ماده را به‌عنوان اعضای هیأت‌های حل اختلاف مالیاتی بپذیرد و با رعایت تبصره (۵) این ماده از آنها جهت شرکت در هیأت‌های مزبور دعوت نماید.\n\n>\n\n> **تبصره ۵ ـ** اسامی کلیه افراد معرفی‌شده توسط رئیس کل دادگستری هر استان، مدیر کل مالیاتی استان و مراجع مذکور در بند (۳) این ماده به تفکیک شهرستان‌ها در سامانه‌ای که به صورت متمرکز و حداکثر ظرف سه ماه پس از لازم‌الاجراء شدن این قانون توسط سازمان امور مالیاتی کشور ایجاد می‌شود، درج می‌گردد. انتخاب افراد موضوع بندهای (۱)، (۲) و (۳) برای هر پرونده در مواردی که در شهرستان مورد نظر بیشتر از یک نفر وجود داشته باشد، به صورت تصادفی توسط سامانه مزبور انجام می‌شود. این سامانه مستقیماً زیر نظر رئیس کل سازمان امور مالیاتی، مدیریت می‌گردد.\n\n>\n\n> **تبصره ۶ ـ** سازمان امور مالیاتی کشور مکلف است حداقل یک هفته قبل از تشکیل جلسه هیأت به نحو مقتضی زمینه دسترسی اعضای هیأت حل اختلاف مالیاتی را برابر مقررات مربوط به مندرجات پرونده مورد اعتراض فراهم نماید.\n\n>\n\n> **تبصره ۷ ـ** هر یک از افراد مذکور در بندهای (۲) و (۳) این ماده در صورتی که بیشتر از سه جلسه متوالی یا چهار جلسه متناوب در یک سال از حضور در جلسات هیأت خودداری نمایند، حکم آنان لغو می‌شود و رئیس کل دادگستری هر استان و مرجع مربوط، حسب مورد، موظف است ظرف ده روز کاری فرد جایگزین را معرفی نماید.\n\n>\n\n> **تبصره ۸ ـ** به منظور اجرای عدالت و اصل استقلال و بی‌طرفی و رعایت حقوق شهروندی و نظارت مؤثر، سازمان امور مالیاتی مکلف است ساختار اداره هیأت‌های حل اختلاف مالیاتی را به صورت مستقل، تحت عنوان مرکز دادرسی مالیاتی در ساختار خود ذیل رئیس کل سازمان ایجاد نماید. واحدهای دادرسی مالیاتی در هر استان مستقل از اداره کل مالیاتی استان تشکیل می‌شود.\n\n>\n\n> **تبصره ۹ ـ** پس از استقرار سامانه مودیان، ثبت اعتراض توسط مودی، انتخاب یکی از مراجع موضوع بند (۳) این ماده، ارائه هرگونه لایحه به هیأت‌های حل اختلاف، مشاهده اسناد، مدارک و اطلاعات مورد نیاز، ابلاغ تاریخ تشکیل جلسات هیأت، اطلاع از نتایج دادرسی و هرگونه اطلاع دیگر در خصوص پرونده دادرسی مالیاتی از طریق سامانه مذکور انجام می‌شود.\n\n>\n\n> **تبصره ۱۰ ـ** سازمان امور مالیاتی کشور مکلف است زمینه دسترسی کامل مودی و یا نماینده قانونی وی به مفاد پرونده مورد اعتراض را حداقل یک هفته قبل از تشکیل هیأت فراهم نماید.\n\n>\n\n> **تبصره ۱۱ ـ** عضویت همزمان در فهرست نمایندگان بندهای (۲) و (۳) موضوع این ماده ممنوع است.»"},{"t":"ماده ۵۱","x":"متن زیر جایگزین ماده (۲۵۱) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۵۱ ـ مودی یا دادستان انتظامی مالیاتی می‌توانند ظرف دو ماه از تاریخ ابلاغ رأی قطعی هیأت حل اختلاف مالیاتی تجدیدنظر، به استناد عدم رعایت قوانین و مقررات موضوعه یا نقص رسیدگی، با اعلام دلایل کافی به شورای عالی مالیاتی اعتراض نموده و تجدید رسیدگی را درخواست کنند.»"},{"t":"ماده ۵۲","x":"در بند (۳) ماده (۲۵۵) قانون مالیات‌های مستقیم عبارت «نظر اکثریت اعضای شورای عالی مالیاتی» به عبارت «نظر اکثریت اعضای هیأت عمومی شورای‌عالی مالیاتی موضوع ماده (۲۵۸) این قانون» تغییر می‌یابد."},{"t":"ماده ۵۳","x":"تبصره ذیل به ماده (۲۵۸) قانون مالیات‌های مستقیم الحاق می‌شود:\n\n> «تبصره ـ حکم این ماده در مواردی که نسبت به موارد مشابه آرای متفاوتی توسط هیأت‌های حل اختلاف مالیاتی صادر شده باشد نیز جاری است.»"},{"t":"ماده ۵۴","x":"در تبصره (۲) ماده (۲۷۴) قانون مالیات‌های مستقیم عبارت «سازمان امور مالیاتی کشور» جایگزین عبارت «دادستانی انتظامی مالیاتی» می‌گردد. حکم این تبصره و احکام فصل نهم از باب چهارم قانون مالیات‌های مستقیم (به استثنای ماده (۲۱۷)) به این قانون تسری می‌یابد."},{"t":"ماده ۵۵","x":"از تاریخ لازم‌الاجراء شدن این قانون، احکام مربوط به مالیات و عوارض در قوانین زیر نسخ می‌گردد:\n\n1. قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ با اصلاحات و الحاقات بعدی (به استثنای حکم ماده (۲۸) قانون مذکور نسبت به جامعه مشاوران رسمی مالیاتی ایران، ماده (۵۰) قانون مذکور و تبصره‌های ذیل آن و تبصره (۱) ماده (۳۹) آن قانون نسبت به عوارض موضوع بند (۲) ماده (۳۸) این قانون)؛\n\n2. بند «ب» ماده (۶) و بند «ر» ماده (۳۳) و ماده (۷۳) و ماده (۹۴) قانون برنامه پنج‌ساله ششم توسعه اقتصادی، اجتماعی و فرهنگی جمهوری اسلامی ایران مصوب ۱۳۹۵/۱۲/۱۴؛\n\n3. ماده (۶۹) قانون الحاق برخی مواد به قانون تنظیم بخشی از مقررات مالی دولت (۲) مصوب ۱۳۹۳/۱۲/۰۴؛\n\n4. احکام ماده (۳۴) قانون رفع موانع تولید رقابت‌پذیر و ارتقای نظام مالی کشور مصوب ۱۳۹۴/۰۲/۰۱ در خصوص مالیات بر ارزش افزوده؛\n\n5. مواد (۱۸) و (۴۷) قانون اصلاح نظام صنفی کشور مصوب ۱۳۹۲/۰۶/۱۲."},{"t":"ماده ۵۶","x":"اجرای احکام این قانون نافی اجرای احکام و مقررات ذیل نیست:\n\n1. قانون برنامه پنج‌ساله
