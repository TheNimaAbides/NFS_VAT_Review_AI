)؟","a":"به حساب بستانکاری فروشنده منظور می‌شود و برای خریدار غیرمصرف‌کننده‌ی نهائی اعتبار مالیاتی است"},{"id":"c50","q":"گمرک مالیات کالاهای وارداتی و متروکه را چه زمانی وصول می‌کند؟","a":"وارداتی: ترخیص قطعی؛ متروکه: قبل از ترخیص نهائی؛ و برخط به حساب سازمان واریز می‌کند"},{"id":"c51","q":"واردات خدمتی که محل ارائه و مصرف آن خارج از کشور است؟","a":"مشمول حکم مالیات واردات خدمت نیست (تبصره ۴ ماده ۱۷)"},{"id":"c52","q":"مالیات آب، برق، گاز و فرآورده‌های نفتی چند بار وصول می‌شود؟","a":"فقط یک‌بار، در زمان فروش و در انتهای زنجیره‌ی تولید و توزیع (تبصره ۵ ماده ۱۷)"},{"id":"c53","q":"اگر کارفرما قرارداد پیمانکاری را ظرف یک ماه ثبت نکند؟","a":"سازمان اطلاعات ثبت‌شده توسط پیمانکاران را مورد قبول کارفرما تلقی می‌کند (ماده ۱۸)"},{"id":"c54","q":"مؤدیان دارای شعب متعدد چند کارپوشه دارند؟","a":"یک کارپوشه‌ی واحد (بند ب ماده ۲۰)"},{"id":"c55","q":"در مشارکت مدنی تکالیف مالیاتی را چه کسی انجام می‌دهد؟","a":"نماینده‌ی منتخب شرکا؛ در غیر این صورت قطع دسترسی به سامانه و مسدودشدن پایانه‌ی فروشگاهی (بند پ ماده ۲۰)"},{"id":"c56","q":"با غیرفعال‌شدن کارپوشه چه بر سر دستگاه‌های pos می‌آید؟","a":"بانک مرکزی باید ترتیبی دهد که همه‌ی پایانه‌های فروشگاهی مرتبط به‌محض غیرفعال‌شدن کارپوشه غیرفعال شوند (ماده ۲۴)"},{"id":"c57","q":"مأخذ مالیات خرده‌فروشی بنزین و نفت‌گاز توسط جایگاه‌های غیردولتی؟","a":"مابه‌التفاوت قیمت خرید از پالایش (با مالیات و عوارض) و قیمت عرضه به مصرف‌کننده؛ اعتبار مالیاتی خرید برای جایگاه‌دار منظور نمی‌شود (تبصره ۲)"},{"id":"c58","q":"جریمه‌ی کتمان یا عدم ثبت معاملات طلا، جواهر و پلاتین؟","a":"۹٪ ارزش اصل طلا، جواهر و پلاتین، غیرقابل بخشودگی، علاوه بر جریمه‌ی بند «ب» ماده ۳۶"},{"id":"c59","q":"مهلت استفاده‌ی واحدهای زنجیره‌ی طلا از پایانه‌ی فروشگاهی؟","a":"حداکثر دو ماه پس از لازم‌الاجراشدن؛ در غیر این صورت پروانه‌ی آنها باطل می‌شود"},{"id":"c60","q":"تغییرات فهرست کالاهای آسیب‌رسان کی تصویب می‌شود؟","a":"تا انتهای دی‌ماه هر سال، برای اجرا در سال بعد (بند پ ماده ۲۶)"},{"id":"c61","q":"سقف نرخ‌های دخانیات پس از افزایش سالانه‌ی ۵ واحد درصد؟","a":"تولید داخل ۵۵٪، داخل با نشان بین‌المللی ۹۵٪، وارداتی ۱۲۵٪"},{"id":"c62","q":"نرخ‌های عوارض سبز؟","a":"۰/۵٪، ۱٪ و ۱/۵٪ به مأخذ فروش، بر اساس شدت، مدت، نوع و مکان آلایندگی"},{"id":"c63","q":"تولید کارمزدی واحد آلاینده در عوارض سبز؟","a":"درآمد ناشی از آن با پنج برابر نرخ‌ها مشمول است (تبصره ۲ ماده ۲۷)"},{"id":"c64","q":"مهلت اعلام نظر محیط‌زیست و پیامد عدم اعلام؟","a":"حداکثر یک ماه از درخواست واحد؛ در صورت عدم اعلام، واحد خودکار از فهرست خارج می‌شود (تبصره ۶ ماده ۲۷)"},{"id":"c65","q":"رتبه‌های A و B انرژی در جدول ماده ۲۸ چه نرخی دارند؟","a":"صفر برای همه‌ی انواع (تولید داخل و وارداتی)؛ رتبه‌ی G بیشترین نرخ را دارد (مثلاً سواری و دوکابین ۵٪ داخلی، ۹٪ وارداتی)"},{"id":"c66","q":"خودروی فاقد برچسب انرژی مورد تأیید استاندارد؟","a":"مصداق ردیف G است (تبصره ۴ ماده ۲۸)"},{"id":"c67","q":"مهلت اظهارنامه‌ی ماهانه‌ی واردکننده و تولیدکننده‌ی خودرو (تبصره ۵ ماده ۲۸)؟","a":"حداکثر تا پانزدهم ماه بعد؛ عدم پرداخت: جریمه‌ی غیرقابل بخشودگی ۱۰٪"},{"id":"c68","q":"نرخ عوارض سالانه‌ی وسائط نقلیه (ماده ۲۹ بند الف)؟","a":"داخلی یک در هزار قیمت فروش کارخانه؛ وارداتی یک و نیم در هزار (ارزش گمرکی + حقوق ورودی)"},{"id":"c69","q":"تخفیف و جریمه‌ی عوارض سالانه؟","a":"پرداخت تا پایان همان سال: ۲۰٪ تخفیف؛ بعد از موعد: جریمه ۱۰٪؛ تأخیر بیش از یک ماه: علاوه بر آن ۲٪ در ماه"},{"id":"c70","q":"چه زمانی نیروی انتظامی خودرو را توقف می‌کند؟","a":"عدم پرداخت عوارض به مدت پنج سال از سال مالکیت، یا بدهی بیش از ۵٪ نصاب معاملات کوچک (تبصره ۸ ماده ۲۹)"},{"id":"c71","q":"نرخ مالیات نقل و انتقال خودرو و کاهش مأخذ؟","a":"داخلی ۱٪ و وارداتی ۲٪؛ مأخذ تا شش سال سالانه ۱۰٪ کاهش و از سال ششم به بعد ۴۰٪ مأخذ"},{"id":"c72","q":"عوارض شهرداری حمل‌ونقل برون‌شهری مسافر (ماده ۳۲)؟","a":"۵٪ بهای بلیط؛ واریز حداکثر تا پانزدهم ماه بعد به حساب شهرداری مبدأ سفر؛ تأخیر ۲٪ در ماه"},{"id":"c73","q":"جریمه‌ی عدم تسلیم اظهارنامه (بند الف ماده ۳۶)؟","a":"ده میلیون ریال یا دو برابر مالیات و عوارض پرداخت‌نشده تا موعد ماده ۴، هر کدام بیشتر باشد"},{"id":"c74","q":"جریمه‌ی کتمان معامله و کم‌اظهاری (بند ب ماده ۳۶) و تکرار آن؟","a":"دو برابر مالیات و عوارض پرداخت‌نشده؛ در صورت تکرار قبل از دو سال سه برابر"},{"id":"c75","q":"جریمه‌ی تأخیر (ماده ۳۷) و بخشودگی آن؟","a":"۲٪ در ماه؛ اگر مؤدی خارج از اراده امکان پرداخت نداشته و در هیأت حل اختلاف با اسناد ثابت کند، بخشیده می‌شود"},{"id":"c76","q":"مالیات سلامت چقدر است و از کجا تأمین می‌شود؟","a":"یک‌نهم وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶؛ به وزارت بهداشت (مواد ۳۸ و ۴۳)"},{"id":"c77","q":"توزیع باقی‌مانده پس از مالیات سلامت (ماده ۳۸)؟","a":"به نسبت مساوی: سهم درآمد عمومی و سهم شهرداری‌ها و دهیاری‌ها"},{"id":"c78","q":"نسبت توزیع بند «ب» ماده ۳۹؟","a":"۱۲٪ کلان‌شهرها، ۵۳٪ سایر شهرها، ۳۵٪ روستاها و مناطق عشایری"},{"id":"c79","q":"نسبت توزیع ماده ۴۲ (دوازده در هزار ارزش گمرکی)؟","a":"۱۳٪ کلان‌شهرها، ۳۵٪ دهیاری‌ها و روستاهای فاقد دهیاری و عشایر، ۵۲٪ سایر شهرداری‌ها"},{"id":"c80","q":"چه هزینه‌هایی از مالیات سلامت ممنوع است؟","a":"هزینه‌های نیروی انسانی (حقوق، مزایا، اضافه‌کار، کارانه و مانند آن) و هزینه‌های اداری (ماده ۴۳)"},{"id":"c81","q":"مهلت اعتراض به برگ تشخیص و درخواست رسیدگی مجدد (ماده ۴۸)؟","a":"سی روز از تاریخ ابلاغ؛ شخصاً یا با وکیل تام‌الاختیار، کتباً از اداره‌ی امور مالیاتی"},{"id":"c82","q":"مهلت رسیدگی مسؤول مالیاتی پس از ثبت درخواست مؤدی؟","a":"حداکثر ۴۵ روز از تاریخ ثبت درخواست (ماده ۴۸)"},{"id":"c83","q":"اگر مؤدی نظر تعدیل مسؤول را بپذیرد یا نپذیرد؟","a":"بپذیرد: درآمد تعدیل‌شده قطعی است؛ نپذیرد: مابه‌التفاوت تا مبلغ مورد اعتراض به هیأت حل اختلاف ارجاع می‌شود"},{"id":"c84","q":"ترکیب هیأت حل اختلاف مالیاتی (ماده ۵۰)؟","a":"سه نفر: نماینده‌ی سازمان، یک قاضی بازنشسته یا حقوق‌دان مطلع (انتخاب رئیس کل دادگستری استان)، و یک نماینده از مراجع بند ۳ (اتاق‌ها، جوامع حرفه‌ای، کانون وکلا و ...)"},{"id":"c85","q":"رسمیت جلسه و رأی هیأت (تبصره ۱ ماده ۵۰)؟","a":"حضور هر سه عضو؛ رأی با اکثریت قطعی و لازم‌الاجرا؛ نظر اقلیت در متن رأی قید می‌شود"},{"id":"c86","q":"مهلت انشای رأی هیأت؟","a":"در همان جلسه یا حداکثر ظرف سه روز کاری؛ توسط نماینده‌ی بند ۲، با امضای همه‌ی اعضا (تبصره ۲)"},{"id":"c87","q":"مهلت اعتراض به شورای‌عالی مالیاتی (ماده ۵۱)؟","a":"دو ماه از ابلاغ رأی قطعی هیأ دام گروه از مالیات خروج از کشور مستثنی است؟","c":"دانشجویان شاغل به تحصیل در خارج (دارای اجازه‌ی خروج دانشجویی)","w":["بازرگانان صادرکننده","گردشگران داخلی","کارگران فصلی"],"exp":"تبصره ۱ ماده ۳۱.","topic":"خودرو"},{"id":"q149","q":"عوارض ۵٪ بلیط حمل‌ونقل برون‌شهری حداکثر تا چه زمانی به حساب شهرداری مبدأ واریز می‌شود؟","c":"پانزدهم ماه بعد","w":["پنجم ماه بعد","سی‌ام ماه بعد","پایان همان ماه"],"exp":"ماده ۳۲.","topic":"خودرو"},{"id":"q150","q":"جریمه‌ی کتمان معامله و کم‌اظهاری (بند ب ماده ۳۶)؟","c":"دو برابر مالیات و عوارض پرداخت‌نشده تا موعد ماده ۴","w":["ده میلیون ریال","۲٪ در ماه","سه برابر مالیات در همان بار اول"],"exp":"بند ب ماده ۳۶.","topic":"جریمه‌ها"},{"id":"q151","q":"شهرداری‌های شهرهای آلوده ۱۰۰٪ عوارض بند «ب» ماده ۲۹ را صرف چه می‌کنند؟","c":"توسعه و نوسازی ناوگان حمل‌ونقل عمومی","w":["ساخت پارک‌ها","عمران روستایی","هزینه‌های اداری شهرداری"],"exp":"ماده ۴۱.","topic":"توزیع"},{"id":"q152","q":"دستورالعمل ثبت اطلاعات محرمانه‌ی نیروهای مسلح حداکثر چه مدتی پس از لازم‌الاجراشدن قانون به تصویب می‌رسد؟","c":"شش ماه","w":["سه ماه","یک سال","ده روز"],"exp":"ماده ۱۶.","topic":"سامانه"},{"id":"q153","q":"شروع یا خاتمه‌ی فعالیت مؤدی در میانه‌ی دوره؟","c":"زمان فعالیت او در آن دوره، یک دوره‌ی مالیاتی محسوب می‌شود","w":["دوره‌ی مالیاتی محسوب نمی‌شود","دو دوره‌ی مالیاتی محسوب می‌شود","نیم دوره‌ی مالیاتی محسوب می‌شود"],"exp":"تبصره ماده ۱۹.","topic":"وظایف"},{"id":"q154","q":"اگر مؤدی اطلاعات را از طریق سامانه مؤدیان اظهار کرده باشد، رسیدگی مجدد (ماده ۴۸) چگونه است؟","c":"طبق احکام قانون سامانه مؤدیان و پایانه‌های فروشگاهی","w":["طبق قانون مالیات‌های مستقیم","طبق نظر شهرداری","رسیدگی نمی‌شود"],"exp":"تبصره ۲ ماده ۴۸.","topic":"سایر مقررات"}],"gloss":[{"id":"g1","term":"عرضه","def":"واگذاری کالا یا ارائه خدمت به غیر از طریق هر نوع معامله یا عقد قانونی"},{"id":"g2","term":"مؤدی","def":"شخصی که به عرضه کالا، ارائه خدمت، واردات یا صادرات مبادرت می‌نماید"},{"id":"g3","term":"اعتبار مالیاتی","def":"مالیات و عوارضی که مؤدی بابت خرید کالا یا خدمت پرداخت کرده است"},{"id":"g4","term":"معافیت مالیاتی","def":"عدم تعلق مالیات و عوارض این قانون بر کالاها و خدمات"},{"id":"g5","term":"واردات","def":"ورود کالا یا خدمت از خارج به قلمرو گمرکی یا مناطق آزاد و ویژه"},{"id":"g6","term":"سامانه مؤدیان","def":"سامانه‌ای که معاملات مؤدیان در آن ثبت می‌شود؛ ثبت در آن به منزله ثبت در دفاتر قانونی است"},{"id":"g7","term":"عوارض","def":"مبالغی که به موجب این قانون همراه مالیات برای شهرداری‌ها و دهیاری‌ها وضع می‌شود"},{"id":"g8","term":"سازمان","def":"سازمان امور مالیاتی کشور"},{"id":"g9","term":"عرضه کالا به خود","def":"کالا و خدمات مشمول که توسط مؤدیان حقیقی خریداری، تحصیل یا تولید و برای مصارف شخصی برداشته شود؛ مشمول مالیات و عوارض است (تبصره ۱ ماده ۲)"},{"id":"g10","term":"معاوضه","def":"عرضه کالا و ارائه خدمت از طرف هر یک از متعاملین محسوب می‌شود (تبصره ۲ ماده ۲)"},{"id":"g11","term":"تاریخ تعلق مالیات","def":"تاریخ صدور صورتحساب مطابق مقررات (ماده ۳)"},{"id":"g12","term":"مالیات و عوارض فروش","def":"مالیات و عوارض متعلق به عرضه کالاها و خدمات مشمول توسط مؤدی در یک دوره‌ی معین (بند «ت» ماده ۱)"},{"id":"g13","term":"مالیات و عوارض خرید","def":"مالیات و عوارض متعلق به خرید کالاها و خدمات مشمول برای فعالیت‌های اقتصادی مؤدی در یک دوره‌ی معین (بند «ث» ماده ۱)"},{"id":"g14","term":"مالیات بر ارزش افزوده","def":"مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره‌ی معین (بند «ج» ماده ۱)"},{"id":"g15","term":"دوره‌ی مالیاتی","def":"هر سه ماه، منطبق بر فصول سال شمسی (بند «خ» ماده ۱)"},{"id":"g16","term":"صادرات","def":"صدور کالا یا خدمت به خارج از کشور (بند «پ» ماده ۱)"},{"id":"g17","term":"پایانه فروشگاهی","def":"موضوع بند «ب» ماده ۱ قانون پایانه‌های فروشگاهی و سامانه مؤدیان مصوب ۱۳۹۸/۰۷/۲۱ (بند «ژ» ماده ۱)"},{"id":"g18","term":"قانون مالیات‌های مستقیم","def":"قانون مصوب ۱۳۶۶/۱۲/۳ و اصلاحات بعدی (بند «ر» ماده ۱)"},{"id":"g19","term":"حقوق ورودی","def":"حقوق گمرکی و سود بازرگانی؛ مالیات و عوارض این قانون جزء حقوق ورودی نیست (ماده ۶)"},{"id":"g20","term":"ارزش گمرکی","def":"ارزش موضوع ماده ۱۴ قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲ که با حقوق ورودی، مأخذ مالیات واردات را می‌سازد (ماده ۶)"},{"id":"g21","term":"مأخذ مؤدیان عضو سامانه","def":"ارزش فروش مندرج در صورتحساب الکترونیکی ثبت‌شده در سامانه مؤدیان (ماده ۵)"},{"id":"g22","term":"هیأت حل اختلاف مالیاتی","def":"مرجع رسیدگی به همه‌ی اختلاف‌های مالیاتی (به‌جز موارد دارای مرجع دیگر)، مرکب از سه نفر: نماینده‌ی سازمان، قاضی بازنشسته یا حقوق‌دان، و نماینده‌ی مراجع بند ۳ (ماده ۵۰)"},{"id":"g23","term":"مرکز دادرسی مالیاتی","def":"ساختار مستقل هیأت‌ها ذیل رئیس کل سازمان که واحدهای دادرسی هر استان مستقل از اداره‌ی کل امور مالیاتی استان‌اند (تبصره ۸ ماده ۵۰)"},{"id":"g24","term":"مالیات سلامت","def":"یک‌نهم وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶ که برای وزارت بهداشت خزانه واریز می‌کند (مواد ۳۸ و ۴۳)"},{"id":"g25","term":"عوارض سبز","def":"عوارض واحدهای آلاینده با نرخ‌های ۰/۵٪، ۱٪ و ۱/۵٪ به مأخذ فروش، بر اساس شدت، مدت، نوع و مکان آلایندگی (ماده ۲۷)"},{"id":"g26","term":"سوآپ","def":"خدمات معاوضه‌ی نفت خام، فرآورده‌های نفتی، گاز طبیعی و برق که معاف است و مالیات خرید نهاده‌هایش مسترد می‌شود (بند ب ماده ۱۰)"},{"id":"g27","term":"بنکرینگ","def":"فروش سوخت دارای پروانه‌ی صادراتی گمرک به کشتی‌ها که صادرات محسوب می‌شود (تبصره ۱ ماده ۱۰)"},{"id":"g28","term":"پروانه‌ی سبز گمرکی","def":"سند صادره از گمرک برای صادرات کالا از مبادی خروجی رسمی؛ همراه با برگ خروجی سند معافیت صادرات است (بند الف ماده ۱۰)"},{"id":"g29","term":"گواهی سپرده‌ی کالایی","def":"قالبی از فروش کالا در بهابازارهای (بورس‌های) کالایی که فروش همه‌ی کالاها در آن معاف است (بند پ ماده ۱۰)"},{"id":"g30","term":"کارپوشه","def":"کارپوشه‌ی مؤدی در سامانه مؤدیان؛ فعال‌بودن آن یعنی از نظر سازمان، مؤدی شرایط دریافت مالیات و عوارض از خریداران را دارد (ماده ۲۴)"},{"id":"g31","term":"برگ تشخیص","def":"برگی که به مؤدی ابلاغ می‌شود و او می‌تواند ظرف سی روز از ابلاغ، رسیدگی مجدد را درخواست کند (ماده ۴۸)"},{"id":"g32","term":"شورای‌عالی مالیاتی","def":"مرجعی که مؤدی یا دادستان انتظامی ظرف دو ماه از ابلاغ رأی قطعی هیأت تجدیدنظر، به استناد عدم رعایت قوانین یا نقص رسیدگی، در آن اعتراض می‌کنند؛ تعداد شعب آن برای این قانون دو برابر می‌شود (ماده ۵۱ و ۲۵)"},{"id":"g33","term":"مالیات نقل و انتقال خودرو","def":"مالیات نقل و انتقال خودرو و موتورسیکلت: تولید داخل ۱٪ و وارداتی ۲٪ به مأخذ سال تولید، با کاهش مأخذ در سال‌های بعد (ماده ۳۰)"},{"id":"g34","term":"مالیات خروج از کشور","def":"مالیاتی که سازمان از هر مسافر ایرانی هنگام خروج از مرزهای هوایی، دریایی و زمینی دریافت می‌کند؛ مستثنیان در تبصره ۱ ماده ۳۱ آمده‌اند"},{"id":"g35","term":"رتبه‌ی انرژی","def":"رتبه‌ی تأییدشده توسط سازمان ملی استاندارد که مبنای نرخ مالیات و عوارض سبز شماره‌گذاری خودرو در جدول ماده ۲۸ است"},{"id":"g36","term":"عوارض سالانه‌ی وسائط نقلیه","def":"عوارض بند الف ماده ۲۹: تولید داخل یک در هزار قیمت فروش کارخانه و وارداتی یک و نیم در هزار مجموع ارزش گمرکی و حقوق ورودی"},{"id":"g37","term":"کالاهای خاص","def":"کالاهایی که ماده ۲۶ برایشان نرخ ویژه تعیین کرده است: نفتی، طلا و جواهر، نوشابه‌ی قندی و کالاهای آسیب‌رسان، سیگار و محصولات دخانی"},{"id":"g38","term":"واحد بزرگ آلاینده","def":"در ماده ۴۰: واحد با ۵۰ نفر و بیشتر که آلودگی‌اش به بیش از یک شهرستان سرایت کند؛ توزیع عوارض آن را کمیته‌ی ویژه انجام می‌دهد"},{"id":"g39","term":"دادستان انتظامی مالیاتی","def":"مقامی که در کنار مؤدی می‌تواند به رأی قطعی هیأت تجدیدنظر در شورای‌عالی مالیاتی اعتراض کند (ماده ۵۱)"}],"essay":[{"id":"e1","q":"مالیات بر ارزش افزوده را تعریف کنید و مهلت پرداخت آن را بنویسید.","a":"مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره معین؛ پرداخت حداکثر تا پایان ماه پس از انقضای دوره، پس از کسر اعتبار مالیاتی."},{"id":"e2","q":"مأخذ مالیات واردات و نرخ آن؟","a":"ارزش گمرکی به‌اضافه حقوق ورودی؛ نرخ ۹٪."},{"id":"e3","q":"در چه شرایطی مالیات خرید قابل استرداد نیست؟","a":"اگر مؤدی فقط کالا و خدمات معاف عرضه کند (تبصره ۲ ماده ۸)؛ استثنا: ماشین‌آلات خطوط تولید."},{"id":"e4","q":"نرخ مالیات کالاهای نفتی را بنویسید.","a":"بنزین و سوخت هواپیما ۳۰٪؛ نفت‌گاز، نفت سفید، نفت کوره، گاز طبیعی و گاز مایع ۱۵٪."},{"id":"e5","q":"نرخ مالیات سیگار و محصولات دخانی را بنویسید.","a":"داخلی ۲۵٪؛ داخلی با نشان بین‌المللی ۴۰٪؛ وارداتی ۶۵٪؛ توتون خام وارداتی ۱۰٪؛ خرمن توتون ۳۵٪."},{"id":"e6","q":"تبصره ۲ ماده ۴ درباره‌ی معاملات غیرنقدی چه می‌گوید؟","a":"تاریخ تعلق همان تاریخ صدور صورتحساب است؛ اما مؤدی می‌تواند پرداخت مالیات را تا زمان پرداخت ثمن یا مبلغ قرارداد توسط خریدار یا کارفرما، متناسباً به تأخیر بیندازد و مشمول جریمه‌ی تأخیر نمی‌شود؛ تا آن زمان اعتبار مالیاتی برای خریدار منظور نمی‌شود."},{"id":"e7","q":"مواردی را که جزء مأخذ محاسبه مالیات نیستند نام ببرید (تبصره ۲ ماده ۵).","a":"تخفیفات اعطائی؛ مالیات و عوارض قبلاً پرداخت‌شده؛ سایر مالیات‌های غیرمستقیم و عوارض؛ وجوه واریزی به درآمد عمومی یا شهرداری‌ها؛ کمک‌های شهرداری‌ها به سازمان‌های غیرانتفاعی وابسته؛ یارانه‌ی دولت؛ وجوه جابه‌جاشده بین شرکت‌های تابعه بابت غیر از خرید و فروش (با شرایط ذکرشده)."},{"id":"e8","q":"کالاهای مذکور در جزء ۵ بند «الف» ماده ۹ را نام ببرید.","a":"شیر، پنیر و ماست؛ تخم ماکیان؛ آرد و نان؛ انواع گوشت و فرآورده‌های گوشتی (طبق فهرست وزارت بهداشت)؛ برنج، حبوبات، سویا و پروتئین سویا؛ روغن‌های خوراکی گیاهی و حیوانی؛ شیرخشک مخصوص کودکان؛ تخم مرغ نطفه‌دار و تبدیل آن به جوجه‌ی یک‌روزه."},{"id":"e9","q":"عملیات و خدمات بانکی معاف و حدود آن را بنویسید (ماده ۹).","a":"دریافت سپرده، اعطای تسهیلات یا ایجاد اعتبار، ارائه ضمانت‌نامه و انتقال وجه در چهارچوب قوانین مربوط و مصوبات شورای پول و اعتبار؛ از جمله خدمات قرض‌الحسنه، تسهیلات صندوق‌های حمایتی قانونی، و فقط سود تسهیلات شرکت‌های لیزینگ."},{"id":"e10","q":"شرایط صادرات محسوب‌شدن خدمات اشخاص مقیم ایران را بنویسید (تبصره ۳ ماده ۱۰).","a":"خدماتی که اشخاص مقیم ایران (حقیقی یا حقوقی ایرانی یا شعب شرکت‌های خارجی مقیم ایران) ارائه می‌کنند، چه محل مصرف یا مقصد داخل باشد چه خارج، در صورتی که مستقیم یا غیرمستقیم ارز حاصل و وارد کشور شود، صادرات محسوب می‌شود."},{"id":"e11","q":"مسئولیت انتقال‌دهنده و خریدار واحد صنفی را طبق ماده ۲۲ بنویسید.","a":"دارنده تا اتمام انتقال مسئول اجرای مقررات و همه‌ی تکالیف دوره‌های مالیاتی (صورتحساب، ثبت معاملات و ...) است؛ خریدار قبل از اتمام انتقال مسئولیتی ندارد مگر به موجب سند رسمی بپذیرد. انتقال‌دهنده باید حداکثر ظرف ده روز سازمان را از زمان اتمام فعالیت مطلع کند، وگرنه با مؤدی جدید در پرداخت مالیات و جریمه‌ها مسئولیت تضامنی دارد."},{"id":"e12","q":"نرخ و احکام مالیات طلا، جواهر و پلاتین را بنویسید (بند ب ماده ۲۶).","a":"اصل طلا، جواهر و پلاتین معاف؛ اجرت ساخت، حق‌العمل و سود فروشنده ۹٪. ثبت همه‌ی معاملات در سامانه و درج تفکیکی ارزش اصل، اجرت، حق‌العمل و سود در صورتحساب الزامی است؛ کتمان یا عدم ثبت: جریمه‌ی غیرقابل بخشودگی ۹٪ ارزش اصل طلا، جواهر و پلاتین، علاوه بر جریمه‌ی بند ب ماده ۳۶. استفاده از پایانه‌ی فروشگاهی حداکثر تا دو ماه پس از لازم‌الاجراشدن قانون الزامی است، وگرنه پروانه باطل می‌شود."},{"id":"e13","q":"احکام مالیات نقل و انتقال خودرو (ماده ۳۰) را بنویسید.","a":"تولید داخل ۱٪ و وارداتی ۲٪ به مأخذ تبصره ۱ ماده ۲۸ برای سال تولید؛ مأخذ تا شش سال پس از تولید سالانه ۱۰٪ کاهش می‌یابد و از سال ششم به بعد ۴۰٪ آن است. ثبت سند و تعویض پلاک منوط به پرداخت است و مراجع متخلف ملزم به پرداخت دو برابر مالیات پرداخت‌نشده‌اند. اولین انتقال از کارخانه، مونتاژکننده یا واردکننده و انتقال صلح و هبه به نفع دولت مشمول است؛ پلاک مناطق آزاد مشمول نیست."},{"id":"e14","q":"نحوه‌ی توزیع مالیات و عوارض مواد ۷، ۲۶ و ۲۸ را طبق ماده ۳۸ بنویسید.","a":"پس از کسر کسورات قانونی: یک‌نهم از وصولی ماده ۷ و بندهای «الف» و «ب» ماده ۲۶ به‌عنوان مالیات سلامت به وزارت بهداشت اختصاص می‌یابد. باقی‌مانده به نسبت مساوی میان سهم درآمد عمومی (مالیات؛ به خزانه‌داری کل) و سهم شهرداری‌ها و دهیاری‌ها (عوارض؛ به حساب تمرکز وجوه اداره‌ی کل امور مالیاتی استان و وزارت کشور) تقسیم می‌شود. سهم عوارض و جریمه‌ی شهرداری‌ها و دهیاری‌ها درآمد دولت نیست و سازمان ۱۰۰٪ آن را ماهانه واریز می‌کند."},{"id":"e15","q":"ترکیب هیأت حل اختلاف مالیاتی و ویژگی‌های جلسه و رأی را بنویسید (ماده ۵۰).","a":"سه نفر: نماینده‌ی سازمان امور مالیاتی؛ یک قاضی بازنشسته یا حقوق‌دان مطلع (انتخاب رئیس کل دادگستری استان به درخواست سازمان)؛ و یک نماینده از مراجع بند ۳ (اتاق‌ها، جوامع حرفه‌ای، کانون وکلا و ...) که برای سه سال منصوب می‌شود. جلسه با حضور هر سه عضو رسمی است؛ رأی با اکثریت قطعی و لازم‌الاجرا است و نظر اقلیت در متن می‌آید. هیأت مستقل است و سازمان فقط دبیرخانه را اداره می‌کند. رأی در همان جلسه یا حداکثر سه روز کاری انشاء و به امضای همه‌ی اعضا می‌رسد و مؤدی حق حضور و دفاع کتبی یا شفاهی دارد."},{"id":"e16","q":"اصلاحات قانون مالیات‌های مستقیم در مواد ۵۱ تا ۵۴ را به‌طور خلاصه بنویسید.","a":"ماده ۵۱: اعتراض به شورای‌عالی مالیاتی ظرف دو ماه از ابلاغ رأی قطعی هیأت تجدیدنظر (جایگزین ماده ۲۵۱). ماده ۵۲: در بند ۳ ماده ۲۵۵ عبارت به «اعضای هیأت عمومی شورای‌عالی مالیاتی موضوع ماده ۲۵۸» تغییر می‌کند. ماده ۵۳: تبصره‌ی الحاقی به ماده ۲۵۸ درباره‌ی آرای متفاوت هیأت‌ها در موارد مشابه. ماده ۵۴: در تبصره ۲ ماده ۲۷۴ «سازمان امور مالیاتی کشور» جایگزین «دادستانی انتظامی مالیاتی» می‌شود و حکم آن و فصل نهم باب چهارم (به‌جز ماده ۲۱۷) به این قانون تسری می‌یابد."},{"id":"e17","q":"مؤدیان ملزم به عضویت و ثبت معاملات در سامانه را طبق مواد ۱۲ و ۱۵ بنویسید.","a":"ماده ۱۲: عرضه‌کنندگان کالا و خدمات معاف و فعالان مستقر در مناطق آزاد و ویژه که حجم معاملات سالانه‌شان از مبلغ مصوب هیأت وزیران بیشتر باشد؛ با جریمه‌ی ۹٪ ارزش معاملات ثبت‌نشده در صورت تخلف. ماده ۱۵: دستگاه‌های اجرائی موضوع ماده ۵ قانون مدیریت خدمات کشوری و ماده ۲۹ قانون برنامه‌ی ششم و سازمان‌های وابسته به آنها."}]}}</script>
<script>var LAW=[{"h":"مشخصات قانون","a":[{"t":"مشخصات قانون","x":"قانون مالیات بر ارزش افزوده ۱۴۰۰/۰۳/۰۲ (با آخرین اصلاحات)\n\n- **نوع:** قانون\n\n- **تاریخ تصویب:** ۱۴۰۰/۰۳/۰۲\n\n- **مرجع تصویب:** مجلس شورای اسلامی\n\n- **تاریخ لازم‌الاجرا:** ۱۴۰۰/۱۰/۱۰"}]},{"h":"فصل اول: تعاریف و کلیات (از ماده ۱ تا ماده ۴)","a":[{"t":"ماده ۱","x":"مفاهیم و اصطلاحات زیر، در این قانون، دارای تعاریف مشروحه ذیل می‌باشند:\n\n- **الف ـ عرضه:** واگذاری کالا یا ارائه خدمت به غیر، از طریق هر نوع معامله یا عقد قانونی؛\n\n- **ب ـ واردات:** ورود کالا یا خدمت از خارج از کشور به قلمرو گمرکی کشور یا مناطق آزاد تجاری ـ صنعتی یا مناطق ویژه اقتصادی؛\n\n- **پ ـ صادرات:** صدور کالا یا خدمت به خارج از کشور؛\n\n- **ت ـ مالیات و عوارض فروش:** مالیات و عوارض متعلق به عرضه کالاها و ارائه خدمات مشمول مالیات و عوارض توسط مؤدی در یک دوره معین؛\n\n- **ث ـ مالیات و عوارض خرید:** مالیات و عوارض متعلق به خرید کالاها و خدمات مشمول مالیات و عوارض برای فعالیت‌های اقتصادی مؤدی در یک دوره معین؛\n\n- **ج ـ مالیات بر ارزش افزوده:** مابه‌التفاوت مالیات و عوارض فروش با مالیات و عوارض خرید در یک دوره معین؛\n\n- **چ ـ عوارض:** مبالغی که به موجب این قانون به همراه مالیات برای شهرداری‌ها و دهیاری‌ها وضع می‌شود. در این قانون، هر جا مراد، نوع دیگری از عوارض بوده، به صراحت بیان شده است؛ از جمله عوارض واحدهای آلایندگی و عوارض سالانه خودرو؛\n\n- **ح ـ مؤدی:** شخصی است که به عرضه کالا، ارائه خدمت، واردات یا صادرات مبادرت می‌نماید.\n\n- **خ ـ دوره مالیاتی:** دوره مالیاتی هر سه ماه می‌باشد و منطبق بر فصول سال شمسی است.\n\n- **د ـ اعتبار مالیاتی:** مالیات و عوارضی که مؤدی بابت خرید کالا (اعم از نهاده و کالای نهائی) یا خدمت به موجب این قانون پرداخت کرده است.\n\n- **ذ ـ معافیت مالیاتی:** عدم تعلق مالیات و عوارض موضوع این قانون بر کالاها و خدمات.\n\n- **ر ـ قانون مالیات‌های مستقیم:** قانون مالیات‌های مستقیم مصوب ۳/۱۲/۱۳۶۶ و اصلاحات بعدی آن.\n\n- **ز ـ سازمان:** سازمان امور مالیاتی کشور.\n\n- **ژ ـ پایانه فروشگاهی:** پایانه موضوع بند «ب» ماده (۱) قانون پایانه‌های فروشگاهی و سامانه مؤدیان مصوب ۱۳۹۸/۰۷/۲۱.\n\n- **س ـ سامانه مؤدیان:** سامانه موضوع بند «پ» ماده (۱) قانون پایانه‌های فروشگاهی و سامانه مؤدیان."},{"t":"ماده ۲","x":"عرضه کالاها و ارائه خدمات در ایران و واردات و صادرات آنها، از لحاظ مالیات و عوارض مشمول مقررات این قانون است.\n\n- **تبصره ۱:** کالاها و خدمات مشمول موضوع این قانون که توسط مودیان حقیقی خریداری، تحصیل یا تولید می‌شود، در صورتی که برای مصارف شخصی برداشته شود عرضه کالا به خود محسوب می‌شود و مشمول مالیات و عوارض خواهد شد. در صورتی که عرضه کالا به خود برای استفاده شغلی باشد مشمول مالیات و عوارض نخواهد شد.\n\n- **تبصره ۲:** معاوضه کالاها و خدمات در این قانون، عرضه کالا و ارائه خدمت از طرف هر یک از متعاملین محسوب می‌شود و مشمول مقررات این قانون است."},{"t":"ماده ۳","x":"تاریخ تعلق مالیات و عوارض تاریخ صدور صورتحساب مطابق با مقررات است.\n\n- **تبصره:** قبوض آب، برق، گاز و مخابرات از آنجا که سند فروش کالا یا خدمت محسوب می‌شوند، در حکم صورتحساب هستند."},{"t":"ماده ۴","x":"مودی مکلف است حداکثر تا پایان ماه پس از انقضای هر دوره مالیاتی، کل مالیات و عوارضی را که طی آن دوره به فروش کالا و یا ارائه خدمات توسط وی تعلق گرفته است، با رعایت تبصره (۲) این ماده و پس از کسر اعتبار مالیاتی خود، به ترتیبی که سازمان مقرر می‌کند، پرداخت نماید.\n\n- **تبصره ۱:** مطابق این قانون، اصل بر نقدی بودن معاملات است; مگر اینکه نسیه بودن معاملات و دریافت و پرداخت‌های مرتبط با آن در سامانه مودیان ثبت شده و به تأیید طرفین رسیده باشد. در مواردی که معامله یا قرارداد در سامانه مودیان ثبت نشده باشد، آن معامله یا قرارداد، نقدی تلقی می‌شود.\n\n- **تبصره ۲:** در معاملات غیرنقدی نظیر فروش اقساطی و اجاره به شرط تملیک و قراردادهای پیمانکاری و مشاوره‌ای، تاریخ تعلق مالیات و عوارض همان تاریخ صدور صورتحساب است; لکن مودی با رعایت تبصره فوق مجاز است پرداخت مالیات و عوارض فروش این نوع معاملات را تا زمان پرداخت ثمن معامله توسط خریدار یا مبلغ قرارداد توسط کارفرما، متناسباً، به تأخیر بیندازد و سازمان تا زمان پرداخت مالیات و عوارض فروش این نوع معاملات توسط کارفرما یا خریدار، مؤدی را مشمول جریمه تأخیر در پرداخت نخواهد کرد. در خصوص معاملات مذکور، تا زمان پرداخت مالیات و عوارض توسط خریدار، اعتبار مالیاتی برای وی از این بابت منظور نخواهد شد.\n\n- **تبصره ۳:** کلیه کارفرمایان موضوع ماده (۵) قانون مدیریت خدمات کشوری مصوب ۱۳۸۶/۰۷/۰۸ و ماده (۲۹) قانون برنامه پنجساله ششم توسعه اقتصادی، اجتماعی و فرهنگی جمهوری اسلامی ایران مصوب ۱۳۹۵/۱۲/۱۴ موظفند علاوه بر ثبت اصل قرارداد پیمانکاری، کلیه پرداخت‌های خود به پیمانکار را نیز در سامانه مودیان ثبت نموده، همزمان با هر پرداخت، مالیات و عوارض متناسب با آن را به پیمانکار پرداخت کنند. چنانچه کارفرما از پرداخت مالیات و عوارض فروش خودداری کند، بعد از انقضای مهلت قانونی، اصل مالیات و عوارض و جریمه‌های متعلق به آن توسط سازمان از طریق عملیات اجرائی از کارفرما وصول و اصل مالیات و عوارض به حساب پیمانکار منظور خواهد شد.\n\n- **تبصره ۴:** پیمانکاران و مهندسان مشاور موضوع این ماده می‌توانند از اوراق تسویه خزانه موضوع ماده (۲) قانون رفع موانع تولید رقابت‌پذیر و ارتقای نظام مالی کشور مصوب ۱۳۹۴/۰۲/۰۱ و اوراق مالی اسلامی که توسط دولت منتشر می‌شود (منوط به دریافت مستقیم از دولت) برای تسویه مالیات و عوارض خود استفاده نمایند. سازمان مکلف به پذیرش این اوراق به عنوان مالیات و عوارض به میزان ارزش تنزیل‌شده آن (با نرخ حفظ قدرت خرید اسناد خزانه یا نرخ سود اوراق مالی ـ اسلامی) متناسب با سال‌های باقی‌مانده تا سررسید است. میزان مالیات وصولی از این محل به عنوان عملکرد وصولی نقدی سازمان در سال پذیرش اوراق محسوب می‌شود. در اجرای این تبصره سازمان مکلف است که معادل سهم عوارض از پذیرش اوراق مذکور را از محل وصولی‌های جاری به حساب عوارض شهرداری‌ها و دهیاری‌های مربوط منظور نماید.\n\n- **تبصره ۵:** چنانچه وجه واردات خدمت در دوره یا دوره‌های بعد پرداخت شود، مالیات و عوارض آن هم در همان دوره پرداخت می‌شود."}]},{"h":"فصل دوم: مأخذ، نرخ و نحوه محاسبه (از ماده ۵ تا ماده ۸)","a":[{"t":"ماده ۵","x":"مأخذ محاسبه مالیات و عوارض فروش کالاها و خدمات، در مورد مؤدیان عضو سامانه مؤدیان، ارزش فروش مندرج در صورتحساب الکترونیکی است که توسط آنان در سامانه مزبور ثبت شده است.\n\n- **تبصره ۱:** مأخذ محاسبه مالیات و عوارض فروش کالاها و خدمات در مورد مودیانی که عضو سامانه مودیان نیستند و نیز مودیان متخلف موضوع ماده (۹) قانون پایانه‌های فروشگاهی و سامانه مودیان، ارزش روز کالا یا خدمت در زمان تعلق می‌باشد که توسط سازمان بر اساس اطلاعات موجود در سامانه مودیان، استعلام از مراجع ذی‌صلاح یا تعیین کارشناس یا هیأت کارشناسی مشخص می‌شود. همچنین سازمان می‌تواند برای تعیین مأخذ مشمول مالیات مودیان مزبور، از دفاتر، اسناد و مدارک (اعم از الکترونیکی یا غیرالکترونیکی) آنها استفاده نماید. مودی مکلف است دفاتر، اسناد و مدارک مذکور را در صورت درخواست مأموران مالیاتی، کارشناس یا هیأت کارشناسی به آنان ارائه کند.\n\n- **تبصره ۲:** موارد زیر جزء مأخذ محاسبه مالیات و عوارض نمی‌باشد:\n\n  - **الف ـ** انواع تخفیفات اعطائی؛\n\n  - **ب ـ** مالیات و عوارض موضوع این قانون که قبلاً توسط عرضه‌کننده کالا یا ارائه‌دهنده خدمت پرداخت شده است؛\n\n  - **پ ـ** سایر مالیات‌های غیرمستقیم و عوارضی که به موجب قوانین موضوعه هنگام عرضه کالا یا ارائه خدمت به آن تعلق گرفته است؛\n\n  - **ت ـ** وجوهی که به موجب سایر قوانین وصول می‌شود و به حساب درآمد عمومی یا به حساب درآمد شهرداری‌ها واریز می‌گردد؛\n\n  - **ث ـ** کمک‌های پرداختی شهرداری‌ها و دهیاری‌ها به سازمان‌های غیرانتفاعی وابسته به خود طبق قوانین و مقررات موضوعه، مشروط به آنکه مالیات متعلقه به عنوان بخشی از آن احتساب نشده باشد؛\n\n  - **ج ـ** یارانه پرداختی دولت بابت جبران تمام یا قسمتی از قیمت کالاها و خدمات مشمول قیمت‌گذاری؛ مشروط به آنکه مالیات فروش به عنوان بخشی از آن احتساب نشده باشد.\n\n  - **چ ـ** وجوهی که از ردیف‌های بودجه‌ای مصوب دستگاه‌ها بین شرکت‌های تابعه در قوانین بودجه سنواتی جا به جا می‌شود مشروط بر آنکه بابت خرید یا فروش کالا و خدمات نباشد."},{"t":"ماده ۶","x":"مأخذ محاسبه مالیات و عوارض واردات کالا، مجموع ارزش گمرکی (موضوع ماده (۱۴) قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲) و حقوق ورودی (حقوق گمرکی و سود بازرگانی) می‌باشد. مالیات و عوارض مذکور جزء حقوق ورودی محسوب نمی‌شود."},{"t":"ماده ۷","x":"نرخ مالیات و عوارض کالاها و خدمات مطابق با مأخذ موضوع ماده (۵) این قانون، به استثنای کالاهای خاص که نرخ آنها در ماده (۲۶) این قانون تصریح شده، نه درصد (۹%) می‌باشد."},{"t":"ماده ۸","x":"مالیات و عوارضی که مؤدیان برای خرید کالاها و خدمات مورد نیاز برای انجام فعالیت‌های اقتصادی خود پرداخت می‌کنند، به عنوان اعتبار مالیاتی آنان منظور شده و از مالیات و عوارض فروش آنها کسر می‌شود. در صورتی که جمع اعتبار مالیاتی مؤدی در هر دوره مالیاتی بیشتر از مالیات و عوارض فروش وی باشد، سازمان موظف است مبلغ مازاد را به دوره و یا دوره‌های بعد منتقل نماید. در صورتی که مؤدی درخواست کند که مازاد مزبور به وی مسترد گردد، سازمان موظف است حداکثر ظرف یک‌ماه از تاریخ ثبت درخواست، نسبت به استرداد مابه‌التفاوت مذکور از محل وصولی‌های جاری اقدام نماید، در غیر این صورت، مشمول خسارتی به میزان دو درصد (۲%) در ماه از تاریخ ثبت درخواست نسبت به مبلغ قابل استرداد و مدت تأخیر می‌باشد که توسط سازمان و از محل وصولی‌های جاری پرداخت می‌گردد. متخلفین از اجرای این حکم با درخواست مؤدی و رأی هیأت رسیدگی به تخلفات اداری به مجازات بند «د» ماده (۹) قانون رسیدگی به تخلفات اداری مصوب ۱۳۷۲/۹/۷ محکوم می‌شوند.\n\n- **تبصره ۱:** مالیات و عوارض خرید نهاده‌های مربوط به طرح‌های تملک دارایی‌های سرمایه‌ای (عمرانی) دولت قابل استرداد نیست و جزء بهای تمام‌شده دارایی‌های مزبور منظور می‌گردد.\n\n- **تبصره ۲:** در صورتی که مودی فقط به عرضه کالاها و ارائه خدمات معاف اشتغال داشته باشد و یا طبق مقررات این قانون کالا و خدمات وی مشمول مالیات و عوارض نباشد، مالیات و عوارض پرداختی بابت خرید نهاده‌های آنها قابل تهاتر یا استرداد نمی‌باشد.\n\n- **تبصره ۳:** در صورتی که مودی به عرضه توأم کالاها و خدمات مشمول و معاف اشتغال داشته باشد، صرفاً مالیات و عوارضی که بابت خرید نهاده‌های مورد نیاز برای تولید کالاها و خدمات مشمول پرداخت کرده است، حسب مورد، قابل کسر، تهاتر یا استرداد است.\n\n- **تبصره ۴:** صرف‌نظر از آنکه مودی به عرضه کالاها و خدمات معاف یا مشمول اشتغال داشته باشد، مالیات و عوارض خرید مربوط به ماشین‌آلات خطوط تولید وی قابل کسر، تهاتر و استرداد می‌باشد.\n\n- **تبصره ۵:** آن قسمت از مالیات و عوارض پرداختی مودیان که طبق مقررات این قانون قابل تهاتر یا استرداد نیست، به عنوان هزینه‌های قابل قبول موضوع قانون مالیات‌های مستقیم محسوب می‌شود.\n\n- **تبصره ۶:** سازمان مکلف است با رعایت تبصره‌های (۲) و (۴) این ماده مالیات و عوارض پرداختی واحدهای تولیدی یا معدنی دارای مجوز تأسیس را که در دوره‌های قبل از بهره‌برداری جهت خرید کالاها و خدمات مورد نیاز برای تأسیس و راه‌اندازی واحد موردنظر پرداخت کرده‌اند، مسترد نماید.\n\n- **تبصره ۷:** مالیات و عوارضی که در موقع خرید کالاها و خدمات توسط شهرداری‌ها و دهیاری‌ها برای انجام وظایف و خدمات قانونی پرداخت می‌گردد، طبق مقررات این قانون قابل تهاتر و یا استرداد است.\n\n- **تبصره ۸:** مالیات و عوارض پرداخت‌شده توسط سفارتخانه‌ها، مأموریت‌های دیپلماتیک، پست‌های کنسولی، مأموران دیپلماتیک و کارکنان اداری و فنی آنها که تبعه دولت جمهوری اسلامی ایران نمی‌باشند، به شرط عمل متقابل و همچنین مالیات و عوارض پرداخت‌شده توسط دفاتر سازمان‌های بین‌المللی و اعضای آنان که مقیم جمهوری اسلامی ایران می‌باشند (اتباع غیرایرانی)، با ارائه اسناد و مدارک مثبته، قابل استرداد است. نحوه استرداد به موجب دستورالعملی است که توسط وزارتخانه‌های امور خارجه و امور اقتصادی و دارایی (سازمان) تصویب و ابلاغ می‌شود."}]},{"h":"فصل سوم: معافیت‌ها (از ماده ۹ تا ماده ۱۲)","a":[{"t":"ماده ۹","x":"عرضه کالاها و ارائه خدمات زیر از پرداخت مالیات و عوارض معاف می‌باشد:\n\n#### الف ـ کالاها\n\n**جزء ۱**\n\n۱ ـ کلیه محصولات کشاورزی فرآوری نشده مشتمل بر محصولات خام زراعی و باغی، گیاهان دارویی، محصولات مرتعی، محصولات جنگل (از جمله چوب خام)، محصولات گلخانه (از جمله سبزی، صیفی، گل و گیاه و انواع قارچ).\n\n- **تبصره:** فعالیت‌های مربوط به مراحل بسته‌بندی، انبارداری و نگهداری محصول در دمای مناسب در سردخانه، انجماد محصول (شامل سردخانه)، پاک کردن، درجه‌بندی، بوجاری بذور، پوست‌گیری مانند شالی‌کوبی، شستشو، تمیزکاری، تفکیک، همگن‌سازی، خشک‌کردن انواع محصولات مانند چای، کشمش و خرما با روش‌های مختلف، تفت‌دادن مانند پخت نخود و پنبه‌پاک‌کنی، فرآوری محصولات کشاورزی محسوب نمی‌شود. ارائه خدمات مزبور به محصولات کشاورزی مشمول مالیات و عوارض فروش نیست.\n\n**جزء ۲**\n\n۲ ـ دام زنده و خوراک آن، کلیه مواد اصلی تولید مثل دام زنده مطابق پروانه صادره توسط وزارت جهاد کشاورزی، پوسال (کمپوست)، کشت بافت و بستر آماده کشت بافت;\n\n- **تبصره:** دام به حیواناتی (شامل چهارپایان، پرندگان، آبزیان و حشرات) اطلاق می‌گردد که برای امور تغذیه انسان یا دام و فعالیت‌های اقتصادی، تولیدی و آزمایشگاهی، تولید، نگهداری و پرورش داده می‌شوند.\n\n**جزء ۳**\n\n۳ ـ بذر، نشاء، نهال، سم و کود;\n\n**جزء ۴**\n\n۴ ـ آب مصارف کشاورزی;\n\n**جزء ۵**\n\n۵ ـ کالاهای زیر:\n\n- ۵ ـ ۱ ـ شیر، پنیر و ماست;\n\n- ۵ ـ ۲ ـ تخم ماکیان;\n\n- ۵ ـ ۳ ـ آرد و نان;\n\n- ۵ ـ ۴ ـ انواع گوشت و فرآورده‌های گوشتی مطابق با فهرستی که هر سال وزارت بهداشت، درمان و آموزش پزشکی تا پایان دی‌ماه برای اجراء در سال بعد به سازمان ارسال می‌کند;\n\n- ۵ ـ ۵ ـ برنج، حبوبات، سویا و پروتئین سویا;\n\n- ۵ ـ ۶ ـ انواع روغن‌های خوراکی; اعم از گیاهی و حیوانی;\n\n- ۵ ـ ۷ ـ شیرخشک مخصوص تغذیه کودکان;\n\n- ۵ ـ ۸ ـ تخم مرغ نطفه‌دار و تبدیل آن به جوجه یک‌روزه;\n\n**جزء ۶**\n\n۶ ـ انواع کالاهای زیر:\n\n- ۶ ـ ۱ ـ خمیر کاغذ و کاغذ باطله;\n\n- ۶ ـ ۲ ـ دفتر تحریر;\n\n- ۶ ـ ۳ ـ کاغذ چاپ، تحریر و روزنامه;\n\n**جزء ۷**\n\n۷ ـ نسخه‌های کاغذی و الکترونیکی محصولات زیر:\n\n- ۷ ـ ۱ ـ کتاب;\n\n- ۷ ـ ۲ ـ روزنامه;\n\n- ۷ ـ ۳ ـ مجله و نشریه;\n\n**جزء ۸**\n\n۸ ـ کالاهای وارده همراه مسافر برای استفاده شخصی تا میزان معافیت مقرر طبق قانون امور گمرکی;\n\n**جزء ۹**\n\n۹ ـ انواع شمش طلا (وارداتی و داخلی) و انواع حواله‌های کاغذی یا الکترونیکی دارای پشتوانه صد درصد (۱۰۰%) طلا;\n\n**جزء ۱۰**\n\n۱۰ ـ دارایی‌های غیرمنقول و انواع حواله‌های کاغذی یا الکترونیکی مبتنی بر آنها;\n\n**جزء ۱۱**\n\n۱۱ ـ هرگونه انتقال دارایی به/ از صندوق‌های سرمایه‌گذاری پروژه موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی مصوب ۱۳۸۸/۰۹/۲۵ یا شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه، به‌عنوان آورده غیرنقد شرکا در همان صندوق‌های سرمایه‌گذاری پروژه;\n\n- **تبصره:** در صورتی که مالکیت و مدیریت شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه متعلق به صندوق‌های سرمایه‌گذاری پروژه موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی باشد، هرگونه انتقال دارایی به/ از شرکت‌های فرعی صندوق‌های سرمایه‌گذاری پروژه که صرفاً در راستای اجرای پروژه و مرتبط با وظایف صندوق‌های مذکور باشد، مشمول مالیات و عوارض نیست.\n\n**جزء ۱۲**\n\n۱۲ ـ هرگونه انتقال دارایی از/ به نهاد واسط موضوع قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی;\n\n**جزء ۱۳**\n\n۱۳ ـ فرش دستباف و مواد اولیه اصلی آن;\n\n**جزء ۱۴**\n\n۱۴ ـ صنایع دستی تولید داخل موضوع ماده (۱) قانون حمایت از هنرمندان، استادکاران و فعالان صنایع دستی مصوب ۱۳۹۶/۱۰/۲۶ مطابق فهرستی که تا پایان دی‌ماه هر سال توسط وزارت میراث فرهنگی، گردشگری و صنایع دستی پیشنهاد می‌شود و به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد;\n\n**جزء ۱۵**\n\n۱۵ ـ انواع دارو و واکسن (انسانی و دامی)، لوازم مصرفی درمانی و لوازم توانبخشی;\n\n**جزء ۱۶**\n\n۱۶ ـ رادار و تجهیزات کمک ناوبری هوانوردی، تجهیزات نظامی و اطلاعاتی موضوع بندهای «پ»، «ت» و «ث» ماده (۱۱۹) قانون امور گمرکی با رعایت ترتیبات مقرر در بندهای مذکور.\n\n- **تبصره:** معافیت این جزء در خصوص اقلام موضوع بند «پ» ماده (۱۱۹) قانون امور گمرکی در حوزه دفاعی با تأیید وزارت دفاع و پشتیبانی نیروهای مسلح قابل اعمال است.\n\n**جزء ۱۷**\n\n۱۷ ـ تجهیزات و اقلام با کاربرد صرفاً دفاعی، نظامی، انتظامی، امنیتی و اطلاعاتی. فهرست این تجهیزات و اقلام با پیشنهاد وزارت دفاع و پشتیبانی نیروهای مسلح و هماهنگی ستاد کل نیروهای مسلح به‌تصویب هیأت وزیران می‌رسد.\n\n- **تبصره ۱:** واردات کالاهای موضوع جزءهای (۲)، (۶)، (۷)، (۹)، (۱۳)، (۱۶) و (۱۷) بند «الف» این ماده معاف از پرداخت مالیات و عوارض می‌باشد. واردات کالاهای موضوع جزءهای (۱)، (۳) و (۵) بند «الف» این ماده مشمول معافیت نبوده و مالیات و عوارض با نرخ استاندارد نه درصد (۹%) در مبادی گمرکی به آن تعلق می‌گیرد. عرضه این کالاها در داخل کشور، مانند عرضه کالاهای مشابه داخلی از پرداخت مالیات و عوارض معاف است. در خصوص جزء (۱۵) این بند، در صورتی که با تأیید وزیر بهداشت، درمان و آموزش پزشکی کالای مورد نظر مشابه داخلی نداشته باشد، واردات آن از پرداخت مالیات و عوارض معاف می‌باشد و اگر واردات کالای موردنظر به دلیل کمبود تولید داخل نسبت به نیاز بازار، ضرورت داشته باشد، واردات کالای مزبور با رعایت قانون حداکثر استفاده از توان تولیدی و خدماتی کشور و حمایت از کالای ایرانی، مشمول مالیات و عوارض با نرخ سه‌درصد (۳%) در مبادی گمرکی می‌باشد. عرضه این کالاها در داخل کشور، مانند عرضه کالاهای مشابه داخلی از پرداخت مالیات و عوارض معاف است.\n\n- **تبصره ۲:** تولیدکنندگان و یا عرضه‌کنندگان کالاهای موضوع این بند مکلفند که برچسب معافیت از مالیات بر ارزش افزوده را بر روی بسته‌بندی کالاهای مذکور درج نمایند. سازمان مکلف است فهرست کالاها و خدمات معاف از مالیات و عوارض را از طریق شیوه‌های مناسب از جمله درج در سامانه عملیات الکترونیکی سازمان به اطلاع عموم مردم برساند. سازمان مکلف است امکان دریافت گزارش‌های مردمی مبنی بر دریافت مالیات و عوارض توسط عرضه‌کنندگان کالاها و خدمات معاف از مالیات و عوارض را از طریق سامانه عملیات الکترونیکی خود و استرداد مبالغ اضافه دریافتی از خریداران فراهم نماید. دریافت مالیات و عوارض از کالاها و خدمات معاف توسط عرضه‌کنندگان آنها مشمول جریمه‌ای معادل دو برابر مالیات و عوارض دریافتی بوده و قابل بخشودگی نمی‌باشد. سازمان مکلف است حداکثر سه ماه پس از دریافت گزارش، نسبت به تأیید یا رد و حسب مورد استرداد مبالغ اضافه دریافتی از خریداران اقدام نماید. نحوه استرداد این مبالغ به موجب دستورالعملی است که حداکثر پس از سه ماه از لازم‌الاجراء شدن این قانون توسط سازمان با همکاری اتاق بازرگانی، صنایع، معادن و کشاورزی ایران تهیه و به تصویب وزیر امور اقتصادی و دارایی می‌رسد.\n\n- **تبصره ۳:** واردات کالاهای اهدایی به صورت بلاعوض به جمعیت هلال احمر جمهوری اسلامی ایران، سازمان اورژانس کشور، سازمان بهزیستی کشور، آستان‌های مقدسه و کمیته امداد امام خمینی (ره) با تأیید وزیر امور اقتصادی و دارایی، حوزه‌های علمیه با تأیید مرکز مدیریت حوزه علمیه استان مربوط و مؤسسات خیریه با اعلام مراجع صادرکننده مجوز آنها و تأیید وزیر امور اقتصادی و دارایی از پرداخت مالیات و عوارض معاف است;\n\n- **تبصره ۴:** اعمال معافیت‌های مالیاتی در خصوص مواد خوراکی مذکور در اجزای این بند، منوط به أخذ گواهی سلامت محصول از مراجع قانونی ذی‌صلاح از قبیل سازمان ملی استاندارد ایران و سازمان غذا و دارو است.\n\n#### ب ـ خدمات\n\n**جزء ۱**\n\n۱ ـ خدمات درمانی، تشخیصی و پیشگیری، خدمات توانبخشی و حمایتی و خدمات آرامستان‌ها;\n\n**جزء ۲**\n\n۲ ـ خدمات درمانی و پیشگیری دامی و گیاهی، واحدهای ماشینی‌کردن (مکانیزاسیون) آب کشاورزی، کشت بافت و تولید اندام‌های تکثیری گیاهان;\n\n**جزء ۳**\n\n۳ ـ خدمات زینک، چاپ، انتشار روزنامه اعم از کاغذی یا الکترونیکی، کتاب، نشریه و خدمات نشر و توزیع آنها به استثنای مؤسسات کمک آموزشی و کنکور و هرگونه تبلیغات کالاها و خدمات داخلی در روزنامه‌ها و نشریات;\n\n**جزء ۴**\n\n۴ ـ ارائه خدماتی که مابه‌ازای آن به صورت حقوق و دستمزد پرداخت می‌شود در صورتی که مشمول فصل مالیات بر درآمد حقوق موضوع قانون مالیات‌های مستقیم باشد;\n\n- **تبصره:** در ارائه خدمت توسط شرکت‌های تأمین نیروی انسانی و شرکت‌هایی که از طریق قراردادهای حجمی خدمات خود را با در اختیار گذاشتن نیروی کار به متقاضی ارائه می‌کنند (مانند شرکت‌های ارائه‌دهنده خدمات پرستاری و خدمات نظافتی)، بخشی از قرارداد که مربوط به هزینه‌های حقوق و دستمزد است، معاف می‌باشد. حکم این بند مشروط به تأیید میزان حقوق و دستمزد و مزایا توسط سازمان بیمه‌گر است.\n\n**جزء ۵**\n\n۵ ـ عملیات و خدمات بانکی شامل دریافت سپرده، اعطای تسهیلات و یا ایجاد اعتبار، ارائه ضمانت‌نامه و انتقال وجه در چهارچوب قوانین مربوط و مصوبات شورای پول و اعتبار;\n\n**جزء ۶**\n\n۶ ـ خدمات اعتباری قرض‌الحسنه صندوق‌های قرض‌الحسنه دارای مجوز فعالیت از بانک مرکزی جمهوری اسلامی ایران یا سایر مراجع مورد تأیید بانک مذکور و همچنین صندوق‌های قرض‌الحسنه که به موجب قانون تأسیس شده یا می‌شوند;\n\n**جزء ۷**\n\n۷ ـ خدمات مالی و اعتباری اعطای تسهیلات توسط صندوق‌های حمایتی، ضمانت صادرات، سرمایه‌گذاری، بیمه‌ای و پژوهش و فناوری که به موجب قانون یا با مجوز قانون تأسیس شده یا می‌شوند در چهارچوب اساسنامه آنها.\n\n**جزء ۸**\n\n۸ ـ خدمات بیمه‌های زندگی، خدمات بیمه‌های محصولات کشاورزی، خدمات بیمه اجتماعی و درمان تکمیلی;\n\n**جزء ۹**\n\n۹ ـ خدمات بازار سرمایه شامل خدمات معاملات و تسویه اوراق بهادار و کالا در بورس‌ها و بازارهای خارج از بورس به تشخیص شورای‌عالی بورس و اوراق بهادار.\n\n**جزء ۱۰**\n\n۱۰ ـ خدمات انتشار و نقل و انتقال سهام، حق تقدم، سهم‌الشرکه و سایر اوراق بهادار موضوع بند (۲۴) ماده (۱) قانون بازار اوراق بهادار جمهوری اسلامی ایران مصوب ۱۳۸۴/۰۹/۰۱ با اصلاحات بعدی;\n\n**جزء ۱۱**\n\n۱۱ ـ صدور و ابطال، نقل و انتقال واحدهای سرمایه‌گذاری صندوق‌های سرمایه‌گذاری دارای مجوز از سازمان بورس اوراق بهادار;\n\n**جزء ۱۲**\n\n۱۲ ـ منحصراً سود تسهیلات اعطائی شرکت‌های واسپاری (لیزینگ) دارای مجوز فعالیت از بانک مرکزی جمهوری اسلامی ایران به مشتریان (مصرف‌کنندگان).\n\n- **تبصره:** مالیات بر ارزش افزوده بهای دارایی‌ها و اموال مورد واگذاری موضوع قرارداد شرکت‌های واسپاری (لیزینگ) با مشتریان مشمول این فعالیت نمی‌باشند.\n\n**جزء ۱۳**\n\n۱۳ ـ خدمات حمل و نقل (اعم از بار و مسافر) درون و برون‌شهری و بین‌المللی جاده‌ای، ریلی و دریایی;\n\n**جزء ۱۴**\n\n۱۴ ـ خدمات آموزشی، پژوهشی و ورزشی دارای مجوز از مراجع ذی‌صلاح طبق آیین‌نامه‌ای که با پیشنهاد مشترک وزارتخانه‌های امور اقتصادی و دارایی (سازمان)، علوم، تحقیقات و فناوری، آموزش و پرورش، تعاون، کار و رفاه اجتماعی، بهداشت، درمان و آموزش پزشکی، ورزش و جوانان و دفاع و پشتیبانی نیروهای مسلح و مرکز مدیریت حوزه‌های علمیه ظرف شش‌ماه از تاریخ ابلاغ این قانون تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد;\n\n**جزء ۱۵**\n\n۱۵ ـ خدمات اقامتی هتل‌های سه ستاره و پایین‌تر، مهمانپذیرها و سایر مراکز اقامتی دارای مجوز از وزارت میراث فرهنگی، گردشگری و صنایع دستی یا اتحادیه‌های ذی‌ربط;\n\n**جزء ۱۶**\n\n۱۶ ـ قدرالسهم هزینه مشترک (شارژ) دریافتی توسط شرکت‌های خدماتی موضوع قانون نحوه واگذاری مالکیت و اداره امور شهرک‌های صنعتی مصوب ۱۳۸۷/۰۲/۳۱ از واحدهای تولیدی، صنعتی و خدماتی مستقر در شهرک‌های صنعتی بابت ارائه خدمات به آنها.\n\n**جزء ۱۷**\n\n۱۷ ـ خدمات فنی، بازسازی، تعمیر و نگهداری کالاهای موضوع جزء (۱۷) بند «الف» این ماده که توسط مرکز وابسته به دستگاه‌های نظامی، انتظامی و امنیتی ارائه می‌شود، مطابق فهرستی که با تصویب وزرای دفاع و پشتیبانی نیروهای مسلح و امور اقتصادی و دارایی ابلاغ می‌شود.\n\n- **تبصره:** در مواردی که دریافت وجه توسط یک مودی مستند به فروش کالا یا ارائه خدمت نیست، مانند دریافت هرگونه خسارت، درآمدهای حاصل از تسعیر دارایی‌های ارزی، انواع سود، انواع جریمه (مادامی که بخشی از بهای کالا و خدمات تلقی نگردد)، آورده نقدی یا غیرنقدی به‌عنوان سرمایه و انواع کمک‌های دولتی، عرضه خدمت محسوب نمی‌شود و مأخذ محاسبه مالیات و عوارض نمی‌باشد."},{"t":"ماده ۱۰","x":"موارد زیر از پرداخت مالیات و عوارض معاف هستند و مالیات و عوارض خرید نهاده‌های آنها مسترد می‌شود:\n\n- **بند الف ـ** صادرات کالاها به خارج از کشور از طریق مبادی خروجی رسمی با ارائه پروانه سبز گمرکی صادره توسط گمرک یا برگ خروجی (در مورد صادرات کالا) و صادرات خدمات با ارائه قرارداد مربوط و گواهی انجام کار که به تأیید نزدیک‌ترین نمایندگی رسمی جمهوری اسلامی ایران در کشور مقصد رسیده باشد یا گواهی ارزآوری با تأیید بانک مرکزی یا سایر اسناد و مدارک مثبته. صادرات کالاها و خدمات از قلمرو گمرکی سرزمین اصلی به مناطق آزاد تجاری ـ صنعتی خارج از نقاط جمعیتی که دارای تراز تجاری مثبت باشند، در صورتی که محصور بودن آنها به صورت سالانه به تأیید گمرک جمهوری اسلامی ایران برسد، مشمول این بند خواهد بود.\n\n- **بند ب ـ** خدمات معاوضه (سوآپ) نفت خام، فرآورده‌های نفتی (بنزین، نفت‌گاز، نفت کوره، نفت سفید، گازمایع و سوخت هوایی)، گازطبیعی و برق;\n\n- **بند پ ـ** فروش کلیه کالاها در قالب گواهی سپرده کالایی در بهابازار (بورس)های کالایی.\n\n- **تبصره ۱:** فروش کلیه فرآورده‌های تولیدی شرکت‌های پالایش به صورت ارزی (فروش سوخت‌های هوایی به شرکت‌های هواپیمایی خارجی در فرودگاه‌های داخلی)، مرزی (فروش سوخت در جایگاه‌های مستقر در نواحی مرزی کشور) و همچنین فروش سوخت دارای پروانه صادراتی گمرک جمهوری اسلامی ایران به کشتی‌ها (بنکرینگ) صادرات محسوب می‌شود.\n\n- **تبصره ۲:** استرداد مالیات و عوارض خرید برای صادرات مواد خام و مواد اولیه تولید که در فهرست مربوط به ماده (۱۴۱) قانون مالیات‌های مستقیم ذکر شده‌اند، ممنوع است.\n\n- **تبصره ۳:** خدماتی که توسط اشخاص مقیم ایران (اشخاص حقیقی یا حقوقی ایرانی و یا شعب شرکت‌های خارجی مقیم ایران) ارائه می‌شود و محل مصرف خدمات و یا مقصد خدمات داخل باشد یا خارج از کشور، در صورتی که مستقیم یا غیرمستقیم ارز حاصل و وارد کشور بشود صادرات محسوب می‌گردد.\n\n- **تبصره ۴:** در صورتی که کالاهای موضوع بند «پ» مشمول مالیات و عوارض فروش باشد، تحویل‌گیرنده از انبارهای پذیرش‌شده در بهابازار (بورس)های کالایی موظف به تسویه مالیات و عوارض خرید کالا بر اساس قیمت اعلامیه خرید خود با سازمان امور مالیاتی کشور است. اعلامیه خرید، در حکم صورتحساب است."},{"t":"ماده ۱۱","x":"مالیات و عوارض پرداختی بابت خرید کالاها در داخل ایران که ظرف دو ماه از تاریخ خرید همراه مسافران اعم از ایرانی و خارجی از کشور خارج می‌شود و نیز، مالیات و عوارض پرداختی گردشگران خارجی بابت بلیط پرواز خارجی خریداری‌شده از شرکت‌های هواپیمایی ایرانی، هنگام خروج از کشور با ارائه صورتحساب الکترونیکی و یا اسناد و مدارک مثبته، توسط سازمان، از محل وصولی‌های جاری مسترد می‌گردد. آیین‌نامه اجرائی این ماده ظرف شش‌ماه از تاریخ ابلاغ این قانون توسط سازمان تهیه می‌شود و به تصویب هیأت وزیران می‌رسد."},{"t":"ماده ۱۲","x":"عرضه‌کنندگان کالاها و خدمات که به موجب این قانون و سایر قوانین از مالیات و عوارض معاف می‌باشند و همچنین فعالان اقتصادی مستقر در مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی که حجم معاملات سالانه آنها از مبلغی که به پیشنهاد سازمان به تأیید هیأت وزیران می‌رسد، بیشتر باشد، مکلف به عضویت و ثبت معاملات در سامانه مودیان هستند. این حکم شامل کلیه مناطق کشور از جمله مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی می‌شود. متخلفان از حکم این ماده علاوه بر جریمه موضوع بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان مشمول جریمه‌ای معادل نه درصد (۹%) ارزش معاملات ثبت‌نشده در سامانه مذکور می‌شوند. آیین‌نامه اجرائی این ماده در خصوص مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی ظرف سه‌ماه پس از ابلاغ این قانون به پیشنهاد سازمان و دبیرخانه شورای‌عالی مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد."}]},{"h":"فصل چهارم: وظایف و تکالیف مؤدیان و اشخاص ثالث (از ماده ۱۳ تا ماده ۲۲)","a":[{"t":"ماده ۱۳","x":"پس از راه‌اندازی سامانه مودیان، همه مشمولان این قانون موظفند به ترتیبی که سازمان مقرر و اعلام می‌کند، در سامانه مزبور ثبت‌نام نموده و معاملات خود را در آن ثبت نمایند. ثبت معاملات (خرید و فروش) در سامانه مودیان، به منزله ثبت در دفاتر قانونی است. تا آن زمان، ترتیبات ثبت‌نام، نحوه ارائه اظهارنامه‌های مالیاتی و رسیدگی به آنها حسب مقررات قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ و اصلاحات بعدی آن است. در سایر موارد، مفاد این قانون جاری است."},{"t":"ماده ۱۴","x":"چنانچه سازمان در مهلت مقرر در قانون پایانه‌های فروشگاهی و سامانه مؤدیان نتواند سامانه مؤدیان را مستقر کند، مکلف است رسیدگی به اظهارنامه مؤدیان موضوع این قانون را که بعد از اتمام مهلت مزبور به سازمان تسلیم می‌شود، صرفاً به میزانی که در تبصره این ماده آمده است، محدود نموده و سایر اظهارنامه‌ها را بدون رسیدگی قبول نماید.\n\n- **تبصره:** بعد از استقرار سامانه مودیان سازمان مجاز است حداکثر یک درصد (۱%) از پرونده‌های مالیاتی مودیان عضو سامانه مودیان را با اولویت مودیان بزرگ مورد رسیدگی قرار دهد. چگونگی انتخاب مودیانی که پرونده آنها باید مورد رسیدگی قرار گیرد، در دستورالعملی که با پیشنهاد سازمان به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد، معین می‌شود. سازمان مکلف است تا پایان مهرماه هر سال فهرست اسامی مودیانی که مشمول رسیدگی قرار می‌گیرند را در سامانه عملیات الکترونیکی خود اعلام عمومی کند."},{"t":"ماده ۱۵","x":"دستگاه‌های اجرائی موضوع ماده (۵) قانون مدیریت خدمات کشوری و ماده (۲۹) قانون برنامه ششم توسعه و سازمان‌های وابسته به آنها مکلف به ثبت معاملات خود در سامانه مودیان می‌باشند. وزارت صنعت، معدن و تجارت موظف است ترتیبی اتخاذ کند که اطلاعات معاملات ثبت‌شده در سامانه تدارکات الکترونیکی دولت موضوع تبصره (۵) ماده (۱۶۹) قانون مالیات‌های مستقیم عیناً و به‌صورت برخط به سامانه مودیان منتقل شود."},{"t":"ماده ۱۶","x":"ارائه اسناد، دفاتر و مدارک، ثبت قراردادهای پیمانکاری و معاملات و اطلاعات نیروهای مسلح و وزارت دفاع و پشتیبانی نیروهای مسلح و سایر دستگاه‌های انتظامی، اطلاعاتی و امنیتی در سامانه مودیان موضوع تبصره (۳) ماده (۴)، تبصره (۱) ماده (۵) و مواد (۱۳) و (۱۵) این قانون و همچنین سایر اقلام محرمانه در سامانه مذکور با رعایت ملاحظات امنیتی، مطابق دستورالعملی است که توسط وزارتخانه‌های امور اقتصادی و دارایی (سازمان)، اطلاعات و دفاع و پشتیبانی نیروهای مسلح و ستاد کل نیروهای مسلح تهیه می‌شود و حداکثر شش ماه پس از لازم‌الاجراءشدن این قانون به تصویب شورای امنیت کشور می‌رسد."},{"t":"ماده ۱۷","x":"مؤدیان مکلفند مالیات و عوارض فروش موضوع این قانون را از خریدار یا کارفرما وصول کنند و پس از کسر مالیات و عوارض پرداختی، مطابق مقررات به حساب سازمان واریز نمایند.\n\n- **تبصره ۱:** سازمان می‌تواند تمام یا برخی از مودیان مشمول این قانون یا مشتریان آنها را مکلف کند مالیات و عوارض متعلقه را همزمان با صدور صورتحساب به حساب سازمان واریز نمایند. آیین‌نامه اجرائی این تبصره، مشتمل بر فهرست مودیانی که مشمول این حکم می‌شوند و نحوه پرداخت مالیات و عوارض متعلقه با پیشنهاد سازمان، به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد. مالیات و عوارضی که به این ترتیب به سازمان پرداخت می‌شود، به حساب بستانکاری فروشنده منظور می‌شود و برای خریدار، در صورتی که مصرف‌کننده نهائی نباشد، اعتبار مالیاتی به‌حساب می‌آید.\n\n- **تبصره ۲:** گمرک جمهوری اسلامی ایران مکلف است مالیات و عوارض کالاهای وارداتی را در زمان ترخیص قطعی و مالیات و عوارض کالاهای متروکه را قبل از ترخیص نهائی وصول و به‌صورت برخط به حساب سازمان واریز کند. گمرک جمهوری اسلامی ایران موظف است ضمن درج اطلاعات پرداخت در پروانه‌های گمرکی و یا فرم‌های مربوط، امکان دسترسی برخط سازمان به پایگاه‌های اطلاعاتی ذی‌ربط را فراهم نماید. گمرک مکلف است در «ورود موقت» و «ورود موقت برای پردازش»، تضمینات لازم را بر اساس مقررات تبصره ماده (۵۳) قانون امور گمرکی أخذ کند.\n\n- **تبصره ۳:** واردکنندگان کالا از مناطق آزاد تجاری ـ صنعتی به سرزمین اصلی مکلفند کالاهای مزبور را به گمرک اظهار نمایند. گمرک موظف است از قسمتی از کالاهای اظهارشده که به‌موجب بند «ب» ماده (۶۵) قانون احکام دائمی برنامه‌های توسعه کشور مصوب ۱۳۹۵/۱۱/۱۰، «تولید داخل» محسوب می‌شود، فقط مالیات و عوارض، و از قسمت باقی‌مانده که «کالای وارداتی» محسوب می‌شود، مالیات و عوارض و حقوق ورودی را دریافت و مالیات و عوارض آن را به حساب سازمان واریز کند.\n\n- **تبصره ۴:** واردکنندگان خدمت مکلفند با رعایت تبصره (۳) ماده (۱۰) این قانون، مالیات و عوارض متعلقه را محاسبه و طبق مقررات این قانون پرداخت نمایند. چنانچه محل ارائه خدمت و مصرف آن در خارج از کشور باشد، مشمول این حکم نمی‌باشند.\n\n- **تبصره ۵:** مالیات و عوارض آب، برق و گاز با توجه به مالیات و عوارض مندرج در صورتحساب (قبوض) مصرف‌کنندگان و همچنین نفت تولیدی (نفت خام، میعانات گازی و گاز طبیعی خام) و فرآورده‌های تولیدی و وارداتی، فقط یک‌بار در زمان فروش (صدور صورتحساب)، در انتهای زنجیره تولید و توزیع آنها توسط شرکت‌های تابعه وزارت نفت (بابت پنج فرآورده اصلی و سوخت هوایی) و یا شرکت‌های پالایش نفت (بابت سایر فرآورده‌ها) و شرکت‌های گاز استانی و شرکت‌های تابع ذی‌ربط وزارت نیرو و شرکت‌های توزیع برق، آب و فاضلاب شهری و روستایی استانی بر مبنای قیمت فروش مصوب داخلی محاسبه، ثبت و وصول و پس از کسر اعتبارات مالیات و عوارض زنجیره مذکور به حساب سازمان نزد خزانه‌داری کل کشور واریز می‌شود. آیین‌نامه اجرائی این تبصره در خصوص نحوه ثبت مالیات و عوارض در دفاتر یا سامانه مودیان تعیین شرکت‌های فعال در زنجیره قبل از انتهای زنجیره توزیع و فروش، نحوه انتقال اعتبارات مالیات و عوارض به انتهای زنجیره، رسیدگی، مطالبه، تهاتر، استرداد، وصول و واریز به‌حساب تعیین‌شده سازمان ظرف شش‌ماه پس از تصویب این قانون با پیشنهاد مشترک سازمان، شرکت ملی نفت ایران و توانیر به‌تصویب وزیران امور اقتصادی و دارایی، نفت و نیرو می‌رسد."},{"t":"ماده ۱۸","x":"کلیه کارفرمایان موضوع ماده (۵) قانون مدیریت خدمات کشوری و ماده (۲۹) قانون برنامه ششم توسعه موظفند اطلاعات مربوط به قراردادهای پیمانکاری را حداکثر تا یک ماه پس از انعقاد قرارداد در سامانه مودیان ثبت نمایند، در غیر این‌صورت، سازمان مکلف است با رعایت ماده (۹) قانون پایانه‌های فروشگاهی و سامانه مودیان اطلاعات ثبت‌شده توسط پیمانکاران در سامانه مذکور را مورد قبول کارفرما تلقی نماید."},{"t":"ماده ۱۹","x":"وزیر امور اقتصادی و دارایی مجاز است با پیشنهاد سازمان مدت دوره مالیاتی را برای هر گروه از مودیان دو یا یک‌ماهه تعیین نماید; مشروط بر آنکه تغییرات مذکور حداقل سه‌ماه قبل از شروع دوره مالیاتی، از طریق سامانه مودیان، پایگاه اطلاع‌رسانی سازمان و حداقل یکی از روزنامه‌های کثیرالانتشار اطلاع‌رسانی عمومی شود.\n\n- **تبصره:** در صورتی که شروع یا خاتمه فعالیت مودی در خلال یک دوره مالیاتی باشد، زمان فعالیت مودی طی دوره مربوط، یک دوره مالیاتی تلقی می‌شود."},{"t":"ماده ۲۰","x":"- **بند الف ـ** سازمان می‌تواند برای اشخاص حقیقی که بیش از یک نوع واحد مشمول مالیات در یک مکان یا مکان‌های متعدد دارند، در سامانه مودیان کارپوشه واحد ایجاد کند.\n\n- **بند ب ـ** مودیانی که دارای واحد مشمول مالیات در شعب متعدد هستند، مکلفند از یک کارپوشه واحد در سامانه مودیان استفاده کنند.\n\n- **بند پ ـ** در مشارکت‌های مدنی، اعم از اختیاری و قهری، اشخاص حقیقی در هر واحد شغلی مکلفند از بین خود یک نفر را به‌عنوان نماینده واحد شغلی انتخاب نمایند. کلیه تکالیف مالیاتی واحد شغلی، از جمله ثبت‌نام و ثبت معاملات در سامانه مودیان و پرداخت مالیات توسط وی به نمایندگی شرکا انجام می‌شود، در غیر این‌صورت، سازمان موظف است دسترسی واحد مزبور به سامانه مودیان را قطع و پایانه فروشگاهی آن را مسدود نماید.\n\n- **بند ت ـ** برای مودیانی که مکان ثابت برای شغل خود ندارند، محل سکونت آنان، از لحاظ امور مالیاتی ملاک اعتبار است. در صورتی که مودی مکان‌های متعدد برای سکونت خود داشته باشد، مکلف است یکی از آنها را برای انجام تکالیف مالیاتی معرفی نماید، در غیر این‌صورت، سازمان یکی از مکان‌های سکونت مودی را برای انجام تکالیف مالیاتی انتخاب و به وی اعلام می‌کند."},{"t":"ماده ۲۱","x":"در مورد اشخاص حقوقی که حکم به انحلال آنها داده شده است تا زمان ختم تصفیه، شخص حقوقی مزبور کماکان مودی محسوب می‌شود و مدیر یا مدیران تصفیه مکلف به انجام تکالیف مقرر در این قانون می‌باشند."},{"t":"ماده ۲۲","x":"در انتقال یک واحد صنفی، شخص دارنده واحد صنفی تا اتمام انتقال، مسئولیت اجرای مقررات و تمامی تکالیف دوره‌های مالیاتی مربوط از جمله صدور صورتحساب، ثبت معاملات در سامانه مودیان و سایر تکالیف قانونی را برعهده دارد. خریدار مسئولیتی در قبال تکالیف واحد صنفی قبل از اتمام انتقال ندارد; مگر اینکه به موجب سند رسمی این مسئولیت را پذیرفته باشد.\n\n- **تبصره:** انتقال‌دهنده باید حداکثر ظرف ده روز سازمان را نسبت به زمان اتمام فعالیت خود مطلع سازد. در صورت عدم اطلاع و شروع فعالیت توسط مودی جدید، در پرداخت مالیات و جریمه‌ها با وی مسئولیت تضامنی خواهد داشت."}]},{"h":"فصل پنجم: ساختار سازمانی مالیات بر ارزش افزوده، وظایف و اختیارات آن (از ماده ۲۳ تا ماده ۲۵)","a":[{"t":"ماده ۲۳","x":"ساختار و تشکیلات مورد نیاز سازمان در سطح کشور و استان‌ها متناسب با شرایط اقتصادی هر منطقه و با توجه به شاخص‌هایی مانند میزان وصول مالیات، تعداد پرونده‌ها و تعداد مودیان بدون الزام به رعایت سطح تقسیمات کشوری با رعایت بند «الف» ماده (۲۸) قانون برنامه ششم توسعه از طریق وزیر امور اقتصادی و دارایی به سازمان اداری و استخدامی کشور پیشنهاد و پس از تصویب هیأت وزیران قابل اجراء است."},{"t":"ماده ۲۴","x":"پس از استقرار سامانه مودیان، فعال بودن کارپوشه مودی در سامانه مزبور به این معنی است که او از نظر سازمان، شرایط لازم برای دریافت مالیات و عوارض از خریداران را دارد. در صورتی که مودی شرایط لازم برای دریافت مالیات و عوارض را از دست بدهد، سازمان موظف است بلافاصله کارپوشه وی را در سامانه مودیان غیرفعال نماید. بانک مرکزی موظف است ترتیبی اتخاذ کند که به‌محض غیرفعال شدن کارپوشه مودی در سامانه مودیان، کلیه دستگاه‌های پایانه فروشگاهی (pos) مرتبط با آن، غیرفعال شوند.\n\n- **تبصره:** غیرفعال نمودن کارپوشه مودی باید مستند به آیین‌نامه‌ای باشد که حداکثر ظرف سه‌ماه پس از ابلاغ این قانون، با پیشنهاد سازمان به‌تصویب هیأت وزیران می‌رسد."},{"t":"ماده ۲۵","x":"- **بند الف ـ** مواد (۱۶۱)، (۱۶۲)، (۱۶۷)، (۱۶۹ مکرر)، (۱۷۱)، تبصره (۱) ماده (۱۷۷)، (۱۷۸)، (۱۸۲)، (۱۸۶) و تبصره (۱) آن، (۱۹۱)، (۱۹۸)، (۲۰۲)، احکام مربوط به فصل هشتم باب چهارم و مواد (۲۱۰) تا (۲۱۶)، (۲۱۸)، (۲۱۹)، (۲۳۱)، (۲۳۲)، (۲۳۵)، (۲۴۲)، (۲۴۳)، احکام مربوط به فصل سوم باب پنجم، مواد (۲۵۷)، (۲۷۴) منهای بند (۳) آن، (۲۷۵)، (۲۷۶)، (۲۷۷) و (۲۷۹) قانون مالیات‌های مستقیم در مورد این قانون جاری است. احکام مربوط به درآمد مشمول مالیات در مواد فوق، در مورد محاسبه مأخذ مالیات بر ارزش افزوده نیز جاری است. احکام فصل سوم باب پنجم قانون مالیات‌های مستقیم در خصوص مواد (۲۹) و (۳۲) این قانون جاری نمی‌باشد.\n\n  - **تبصره ۱:** شناسایی، تشخیص درآمد مشمول مالیات و رسیدگی موضوع ماده (۲۱۹) قانون مالیات‌های مستقیم در مورد مودیان قابل اعتماد موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان جاری نمی‌باشد. این حکم شامل مواردی که سازمان براساس ماده (۱۴) این قانون و تبصره (۱) ماده (۱۹) قانون پایانه‌های فروشگاهی و سامانه مودیان اجازه رسیدگی به اظهارنامه‌های مالیاتی مودیان را دارد، نمی‌باشد. در هر صورت مفاد ماده (۲۱۹) قانون مالیات‌های مستقیم نباید مانع اجرای احکام موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان شود.\n\n  - **تبصره ۲:** در خصوص مودیان عضو سامانه مودیان، سازمان مکلف است اوراق ابلاغ‌شده به مودی را در کارپوشه وی نیز بارگذاری نماید.\n\n  - **تبصره ۳:** به منظور رسیدگی به پرونده‌های قابل طرح این قانون در شورای‌عالی مالیاتی، تعداد شعب شورای مذکور به دو برابر افزایش می‌یابد.\n\n- **بند ب ـ** در صورت عدم عضویت مودیان در سامانه مودیان مواد (۹۷)، (۱۶۹)، (۱۸۱)، (۲۳۰) و بند (۳) ماده (۲۷۴) قانون مالیات‌های مستقیم در مورد مالیات‌های این قانون، جاری است.\n\n  - **تبصره:** ماده (۲۷۲) قانون مالیات‌های مستقیم و تبصره‌های آن تا قبل از اتمام مهلت مقرر در ماده (۳) قانون پایانه‌های فروشگاهی و سامانه مودیان، در مورد مالیات‌های این قانون جاری است."}]},{"h":"فصل ششم: مالیات کالاهای خاص (ماده ۲۶)","a":[{"t":"ماده ۲۶","x":"نرخ مالیات و عوارض کالاهای نفتی، فلزات گرانبها، سیگار، نوشابه و سایر کالاهای آسیب‌رسان به سلامت به شرح زیر تعیین می‌شود:\n\n#### الف ـ کالاهای نفتی\n\n۱ ـ انواع بنزین و سوخت هواپیما سی‌درصد (۳۰%);\n\n۲ ـ نفت‌گاز، نفت سفید، نفت کوره، گاز طبیعی و گاز مایع پانزده‌درصد (۱۵%).\n\n- **تبصره ۱:** نفت خام، میعانات گازی، و گاز طبیعی خام که توسط وزارت نفت (شرکت‌های تابعه) که به شرکت‌های داخل زنجیره تولید فرآورده‌های نفتی فروخته می‌شود، همچنین واردات بنزین و سوخت هواپیما و گاز طبیعی توسط وزارت نفت (شرکت‌های تابعه)، در این مرحله مستلزم محاسبه و دریافت مالیات و عوارض ارزش افزوده از حلقه بعدی و نیز پرداخت در مرحله واردات حسب مورد نمی‌باشد. مالیات و عوارض فروش فرآورده‌های تولیدشده از کالای مزبور و نیز بنزین و سوخت هواپیما و گاز طبیعی وارداتی در مراحل بعدی عرضه، حسب مقررات مربوط محاسبه و وصول می‌شود.\n\n- **تبصره ۲:** مأخذ محاسبه مالیات و عوارض فروش در خرده‌فروشی بنزین و نفت گاز توسط شرکت‌های غیردولتی دارای مجوز از وزارت نفت، عبارت است از مابه‌التفاوت قیمت خرید محصولات فوق از شرکت‌های پالایش (با احتساب مالیات و عوارض موضوع بند «الف» این ماده)، با قیمت عرضه آنها به مصرف‌کننده. مابه‌التفاوت مزبور به‌عنوان درآمد ناشی از ارائه خدمات توسط جایگاه‌های عرضه بنزین و نفت‌گاز تلقی شده و با نرخ مذکور در ماده (۷) این قانون مشمول مالیات و عوارض می‌گردد. مالیات و عوارض پرداختی بابت خرید بنزین و نفت‌گاز به‌عنوان اعتبار مالیاتی برای جایگاه‌داران منظور نمی‌شود.\n\n- **تبصره ۳:** مالیات و عوارض پرداختی مودیان بابت کالاهای موضوع این بند، در صورتی که به‌عنوان مواد اولیه اصلی توسط واحدهای تولیدی به‌کار برده شود، به‌عنوان اعتبار مالیاتی آن واحدها قابل پذیرش می‌باشد. همچنین مالیات و عوارض پرداختی توسط واردکنندگان و توزیع‌کنندگان کالاهای مزبور به‌عنوان اعتبار مالیاتی آنان منظور می‌گردد.\n\n- **تبصره ۴:** مالیات و عوارضی که شرکت ملی نفت ایران برای خرید نهاده‌های موردنیاز جهت طرح‌های تملک دارایی‌های سرمایه‌ای پرداخت می‌کند، قابل استرداد یا تهاتر نمی‌باشد. شرکت یادشده مجاز است مبالغ مزبور را به‌عنوان بخشی از بهای تمام‌شده دارایی‌های فوق‌الذکر منظور نماید. سایر مالیات و عوارضی که شرکت مزبور برای مصارفی غیر از تملک دارایی‌های سرمایه‌ای پرداخت می‌کند، با رعایت مقررات، به‌عنوان اعتبار مالیاتی آن شرکت منظور می‌گردد. اعتبار یادشده با تأیید سازمان قابل تهاتر با بدهی مالیاتی آن شرکت یا سایر شرکت‌های تابعه وزارت نفت می‌باشد.\n\n#### ب ـ طلا، جواهر و پلاتین\n\n۱ ـ اصل طلا، جواهر و پلاتین به کار رفته در مصنوعات ساخته‌شده از فلزات مزبور، معاف از مالیات و عوارض می‌باشد.\n\n۲ ـ اجرت ساخت، حق‌العمل و سود فروشنده کالاهای موضوع این بند مشمول مالیات و عوارض با نرخ نه درصد (۹%) می‌باشد.\n\n۳ ـ پس از راه‌اندازی سامانه مودیان، عرضه‌کنندگان کالا و خدمات مربوط به این بند مکلفند کلیه عملیات خرید و فروش خود را در سامانه مزبور ثبت کنند. درج ارزش اصل طلا، جواهر و پلاتین، اجرت ساخت، حق‌العمل و سود فروشنده به تفکیک در صورتحساب الکترونیکی الزامی است. در صورت کتمان و یا عدم ثبت تمام یا برخی از معاملات در سامانه مذکور مشمول جریمه‌ای معادل نه‌درصد (۹%) ارزش اصل طلا، جواهر و پلاتین است که غیرقابل بخشودگی می‌باشد. این جریمه علاوه بر جریمه مذکور در بند «ب» ماده (۳۶) این قانون است.\n\n۴ ـ کلیه واحدهای فعال در زنجیره عرضه کالا و خدمات مربوط به این بند مکلفند حداکثر تا دوماه پس از لازم‌الاجراءشدن این قانون از پایانه فروشگاهی مورد تأیید سازمان استفاده کنند، در غیر این صورت اتحادیه‌های ذی‌ربط و اتاق اصناف ایران موظفند پروانه فعالیت واحدهای موضوع این بند در کل زنجیره مربوط را که بدون استفاده از پایانه فروشگاهی اقدام به فروش کالا یا خدمت می‌کنند، باطل نمایند. نیروی انتظامی موظف است از ادامه فعالیت واحدهای فاقد پروانه جلوگیری کند.\n\n#### پ ـ نوشابه‌های قندی گازدار و بدون گاز و سایر کالاهای آسیب‌رسان به سلامت\n\nنوشابه‌های قندی گازدار و بدون گاز و سایر کالاهای آسیب‌رسان به سلامت (به‌استثنای کالاهای موضوع بند «ت» این ماده) تولید داخل مشمول مالیات و عوارض با نرخ شانزده‌درصد (۱۶%) و واردات آنها مشمول مالیات و عوارض با نرخ سی و شش درصد (۳۶%) می‌باشند. فهرست کالاهای موضوع این بند و واحدهای تولیدکننده آنها حداکثر دوماه پس از ابلاغ این قانون به پیشنهاد وزارت بهداشت، درمان و آموزش پزشکی و حداکثر یک‌ماه بعد از آن توسط کارگروهی مرکب از نمایندگان تام‌الاختیار وزارتخانه مزبور، وزارت صنعت، معدن و تجارت و وزارت امور اقتصادی و دارایی تصویب می‌شود. تغییرات فهرست موردنظر تا انتهای دی‌ماه هر سال (برای اجراء در سال بعد) به ترتیب فوق تصویب و توسط وزارت بهداشت، درمان و آموزش پزشکی برای اجراء اعلام می‌گردد. در صورت عدم تصویب فهرست مزبور در مهلت مقرر، فهرست پیشنهادی وزارت بهداشت، درمان و آموزش پزشکی پس از تأیید شورای‌عالی سلامت و امنیت غذایی، ملاک عمل است.\n\n#### ت ـ انواع سیگار و محصولات دخانی\n\nانواع سیگار و محصولات دخانی به شرح زیر مشمول مالیات و عوارض می‌شوند:\n\n۱ ـ سیگار، توتون پیپ و تنباکوی تولید داخلی، بیست و پنج درصد (۲۵%);\n\n۲ ـ سیگار، توتون پیپ و تنباکوی تولید داخل با نشان بین‌المللی که فهرست آن هر سال توسط وزارت صنعت، معدن و تجارت تهیه و با تصویب هیأت وزیران ابلاغ می‌شود، چهل‌درصد (۴۰%);\n\n۳ ـ سیگار، توتون پیپ و تنباکوی وارداتی، شصت و پنج‌درصد (۶۵%);\n\n۴ ـ توتون خام وارداتی ده‌درصد (۱۰%);\n\n۵ ـ توتون فرآوری‌شده وارداتی (خرمن توتون) سی و پنج‌درصد (۳۵%).\n\n- **تبصره ۱:** نرخ‌های تعیین‌شده از سال دوم اجرای قانون هر سال پنج واحد درصد افزایش می‌یابد تا زمانی که نرخ مذکور برای انواع سیگار و محصولات دخانی، توتون پیپ و تنباکوی تولید داخل به پنجاه و پنج درصد (۵۵%)، برای تولیدات داخل با نشان بین‌المللی به نود و پنج‌درصد (۹۵%) و برای انواع سیگار و محصولات دخانی، توتون پیپ و تنباکوی وارداتی به یکصد و بیست و پنج‌درصد (۱۲۵%) برسد.\n\n- **تبصره ۲:** تولیدکنندگان سیگار و محصولات دخانی مکلفند از زمان لازم‌الاجراءشدن این قانون، قیمت خرده‌فروشی و تاریخ تولید را بر روی پاکت بسته‌بندی محصولات دخانی درج کنند. در صورت تخلف از حکم این تبصره، اعتبار مالیاتی مربوط، پذیرفته نمی‌شود و مشمول مالیات و عوارض فروش به نرخ‌های مذکور است."}]},{"h":"فصل هفتم: مالیات‌ها و عوارض خاص (از ماده ۲۷ تا ماده ۳۴)","a":[{"s":"الف ـ عوارض سبز"},{"t":"ماده ۲۷","x":"واحدهای تولیدی، صنعتی، معدنی و خدماتی آلاینده که به تشخیص سازمان حفاظت محیط‌زیست، حدود مجاز و استانداردهای زیست‌محیطی را رعایت نمی‌کنند، در صورتی که در مهلت زمانی که توسط سازمان مزبور برای آنها تعیین می‌شود، نسبت به رفع آلایندگی خود اقدام ننمایند، براساس معیارهایی نظیر شدت، مدت، نوع و مکان آلایندگی با نرخ‌های نیم‌درصد (۰/۵%)، یک درصد (۱%) و یک و نیم درصد (۱/۵%)، به مأخذ فروش کالا یا خدمات، مشمول عوارض سبز می‌شوند. این حکم در مورد کلیه واحدهای آلاینده، اعم از واحدهای معاف و غیرمعاف، صادراتی و واحدهای مستقر در مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی جاری است. معیارهایی که در تعیین سطح آلایندگی واحدها، مبنای عمل سازمان محیط‌زیست قرار می‌گیرد، حداکثر سه‌ماه پس از لازم‌الاجراءشدن این قانون، توسط کارگروهی متشکل از نمایندگان سازمان حفاظت محیط‌زیست و وزارتخانه‌های بهداشت، درمان و آموزش پزشکی، صنعت، معدن و تجارت، کشور و امور اقتصادی و دارایی (سازمان) تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد. میزان فروش واحدهای موضوع این ماده بر اساس سامانه مودیان یا اظهارنامه‌ای که به همین منظور به سازمان ارائه می‌شود، تعیین می‌گردد.\n\n- **تبصره ۱:** در صورتی که واحدهای موضوع این ماده، دارای خطوط تولیدی مجزا با محصول مستقل از هم باشند عوارض سبز صرفاً از خطوط آلاینده دریافت می‌شود.\n\n- **تبصره ۲:** در صورتی که واحدهای موضوع این ماده، در قبال أخذ کارمزد مشخص از اشخاص نسبت به تولید اقدام نمایند، درآمد این واحدها ناشی از تولید مذکور، با پنج برابر نرخ‌های مذکور در صدر این ماده مشمول عوارض سبز می‌شود. شرکت‌هایی که در زنجیره تولید بنزین و سوخت هواپیما، نفت سفید، نفت کوره، نفت‌گاز، گازطبیعی و برق فعالیت می‌کنند، از شمول حکم این تبصره مستثنی می‌باشند. قیمت فروش فرآورده به مصرف‌کننده نهائی مبنای محاسبه عوارض موضوع این ماده برای شرکت‌های زنجیره تولید بنزین و سوخت هواپیما، نفت سفید، نفت کوره، نفت‌گاز، گازطبیعی و برق می‌باشد که شرکت‌های بالادستی آنها متضامناً مسئول پرداخت عوارض مربوط هستند.\n\n- **تبصره ۳:** سازمان حفاظت محیط‌زیست مکلف است حداکثر ظرف شش‌ماه پس از تاریخ لازم‌الاجراءشدن این قانون، پایگاه اطلاعاتی واحدهای آلاینده را ایجاد نماید و امکان دسترسی برخط سازمان به سامانه مزبور را فراهم کند. سازمان حفاظت محیط‌زیست موظف است نام واحدهای آلاینده و سطح آلایندگی آنها را در پایگاه مزبور درج نموده و آن را مستمراً به‌روزرسانی کند.\n\n- **تبصره ۴:** در صورتی که سازمان حفاظت محیط‌زیست نام واحدی را در پایگاه واحدهای آلاینده درج نماید یا سطح آلایندگی آن واحد را در پایگاه مزبور افزایش دهد، واحد موردنظر از ابتدای دوره مالیاتی بعد، حسب مورد، مشمول عوارض سبز می‌شود، یا نرخ عوارض مزبور برای آن واحد افزایش می‌یابد.\n\n- **تبصره ۵:** در صورتی که سازمان حفاظت محیط‌زیست نام واحدی را از پایگاه واحدهای آلاینده حذف نماید، یا سطح آلایندگی آن واحد را در پایگاه مزبور کاهش دهد، واحد موردنظر از ابتدای همان دوره، حسب مورد، از پرداخت عوارض سبز معاف می‌شود، یا نرخ عوارض مزبور برای آن واحد کاهش می‌یابد.\n\n- **تبصره ۶:** سازمان حفاظت محیط‌زیست موظف است حداکثر ظرف یک‌ماه از تاریخ درخواست واحد آلاینده، در خصوص رفع یا کاهش آلایندگی آن واحد اعلام نظر نماید و هرگونه تغییر در وضعیت واحد موردنظر را در پایگاه اطلاعاتی واحدهای آلاینده منعکس نماید. در صورت عدم اعلام نظر سازمان حفاظت محیط‌زیست در مهلت مقرر، واحد مزبور به صورت خودکار از فهرست واحدهای آلاینده خارج می‌شود.\n\n- **تبصره ۷:** سرمایه‌گذاری‌هایی که به‌منظور رفع یا کاهش آلایندگی واحدهای آلاینده انجام می‌شود، در صورت تأیید رفع یا کاهش آلایندگی توسط سازمان حفاظت محیط‌زیست، در سال اول یا سال‌های بعد، از بدهی عوارض آن واحدها کسر می‌شود و در صورتی که به رفع یا کاهش آلایندگی منجر نشود، به‌عنوان هزینه قابل قبول مالیاتی پذیرفته می‌شود.\n\n- **تبصره ۸:** در صورتی که پالایشگاه‌ها و نیروگاه‌هایی که سوخت اصلی آنها نفت کوره و نفت‌گاز نیست، در مقاطع خاصی از سال با درخواست دولت، مجبور به استفاده از سوخت‌های مزبور شوند، سازمان حفاظت محیط‌زیست موظف است این موضوع را در احتساب سطح و مدت آلایندگی آن واحدها لحاظ نماید و افزایش آلایندگی ناشی از استفاده نفت کوره و نفت گاز را مطابق با قبل از الزام مزبور محاسبه کند.\n\n- **تبصره ۹:** اعلام سازمان حفاظت محیط‌زیست صرفاً برای دوره‌های بعد از ثبت در سامانه ملاک اعتبار است و سازمان مذکور مجاز به اظهار نظر نسبت به رفع و یا آلایندگی واحدهای تولیدی برای دوره‌های ثبت‌شده در سامانه تحت عنوان اصلاح و تصحیح اشتباه نیست.\n\n- **تبصره ۱۰:** یارانه پرداختی دولت موضوع بند «ج» تبصره (۲) ماده (۵) این قانون، جزء مأخذ محاسبه عوارض سبز نیست.\n\n- **تبصره ۱۱:** مودیان موضوع این ماده مکلفند اظهارنامه هر دوره را مطابق نمونه‌ای که سازمان تعیین می‌نماید حداکثر تا پایان ماه پس از انقضای دوره، تسلیم و عوارض را ظرف مهلت مزبور به حساب تعیین‌شده واریز نمایند. عدم تسلیم اظهارنامه در مهلت‌های مقرر موجب تعلق جریمه غیرقابل بخشودگی به میزان ده‌درصد (۱۰%) عوارض موضوع این ماده می‌باشد و در صورت تأخیر در پرداخت عوارض، مشمول جریمه موضوع ماده (۳۷) این قانون می‌شود. واحدهای عضو سامانه مودیان ملزم به ارائه اظهارنامه موضوع این تبصره نبوده و سازمان به استناد فروش ابرازی آنها در سامانه مودیان، عوارض آلایندگی را وصول می‌کند."},{"s":"ب ـ مالیات و عوارض شماره‌گذاری وسائط نقلیه"},{"t":"ماده ۲۸","x":"شماره‌گذاری انواع خودروهای سبک و سنگین و موتورسیکلت، براساس رتبه انرژی آنها، که به تأیید سازمان ملی استاندارد ایران رسیده است، طبق نرخ‌های مندرج در جدول زیر مشمول مالیات و عوارض سبز می‌باشد. مأخذ مالیات و عوارض موضوع این ماده، قیمت فروش کارخانه در مورد تولیدات داخلی و مجموع ارزش گمرکی و حقوق ورودی برای خودروهای وارداتی است.\n\n(ارقام جدول ذیل به درصد می‌باشد)\n\n| رتبه انرژی | سواری و وانت دوکابین: تولید داخل | سواری و وانت دوکابین: وارداتی | وانت تک‌کابین، خودروی سواری با شماره‌گذاری عمومی: تولید داخل | وانت تک‌کابین، خودروی سواری با شماره‌گذاری عمومی: وارداتی | خودروهای سنگین: تولید داخل | خودروهای سنگین: وارداتی | موتورسیکلت: تولید داخل | موتورسیکلت: وارداتی |\n\n|---|---|---|---|---|---|---|---|---|\n\n| A | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ |\n\n| B | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ |\n\n| C | ۰/۵ | ۱ | ۰/۲ | ۰/۴ | ۰ | ۰ | ۰/۲۵ | ۰/۵ |\n\n| D | ۱ | ۳ | ۰/۴ | ۰/۸ | ۰/۱ | ۰/۲ | ۰/۵ | ۱/۵ |\n\n| E | ۲ | ۵ | ۰/۸ | ۱/۶ | ۰/۲ | ۰/۴ | ۱ | ۲/۵ |\n\n| F | ۳ | ۷ | ۱/۲ | ۲/۴ | ۰/۴ | ۰/۶ | ۱/۵ | ۳/۵ |\n\n| G | ۵ | ۹ | ۱/۵ | ۳ | ۰/۶ | ۰/۸ | ۲/۵ | ۵ |\n\n- **تبصره ۱:** مأخذ مالیات و عوارض موضوع این ماده برای انواع خودروهای سبک و سنگین و موتورسیکلت‌های تولید داخل یا وارداتی تا پایان دی‌ماه، توسط سازمان تعیین و برای اجراء در سال بعد اعلام می‌شود. مأخذ مزبور برای وسائط نقلیه‌ای که جدیداً تولید یا وارد می‌شوند، بلافاصله پس از تولید یا واردات توسط سازمان تعیین و اعلام می‌شود.\n\n- **تبصره ۲:** خودروهای سبک و سنگین و موتورسیکلت‌های برقی و تمام برقی (هیبرید پلاگین) به تشخیص وزارت صنعت، معدن و تجارت مشمول مالیات و عوارض موضوع این ماده نمی‌باشد.\n\n- **تبصره ۳:** وزارت صنعت، معدن و تجارت مکلف است ظرف سه ماه از تاریخ ابلاغ این قانون، با همکاری سازمان حفاظت محیط‌زیست و سازمان ملی استاندارد ایران، فهرست کلیه خودروها و موتورسیکلت‌های تولید داخل و وارداتی را با توجه به رتبه انرژی، که در برچسب انرژی آنها درج شده است، به‌صورت برخط به سازمان اعلام نماید و برای اطلاع عموم، منتشر نماید.\n\n- **تبصره ۴:** در صورتی که خودروها و موتورسیکلت‌های موضوع این ماده فاقد برچسب انرژی مورد تأیید سازمان ملی استاندارد ایران باشند، مصداق وسائط نقلیه ردیف (G) تلقی می‌شود.\n\n- **تبصره ۵:** اشخاص حقوقی واردکننده و تولیدکنندگان انواع وسائط نقلیه موضوع این ماده مکلفند اظهارنامه مربوط به مالیات و عوارض شماره‌گذاری و همچنین مشخصات دقیق وسائط نقلیه فروخته‌شده هر ماه را حداکثر تا پانزدهم ماه بعد به نحوی که سازمان اعلام می‌کند، به سازمان تسلیم و مالیات و عوارض متعلق به آن را پرداخت نمایند. عدم پرداخت مذکور در مهلت مقرر، موجب جریمه غیرقابل بخشودگی به میزان ده درصد (۱۰%) مالیات و عوارض موضوع این ماده و در صورت تأخیر در پرداخت آن، مشمول جریمه‌های موضوع ماده (۳۷) این قانون می‌شود.\n\n- **تبصره ۶:** اشخاص حقیقی واردکننده خودرو و موتورسیکلت مکلفند قبل از شماره‌گذاری، با مراجعه به ادارات امور مالیاتی ذی‌ربط، مالیات و عوارض متعلق به آن را به ترتیبی که سازمان تعیین می‌نماید پرداخت کنند. شماره‌گذاری وسائط نقلیه متعلق به دولت و نیروهای نظامی و انتظامی نیز مشمول این ماده است.\n\n- **تبصره ۷:** نیروی انتظامی جمهوری اسلامی ایران (معاونت راهنمایی و رانندگی) مکلف است قبل از شماره‌گذاری وسائط نقلیه واردشده توسط اشخاص حقیقی، گواهی پرداخت مالیات و عوارض را بررسی و از شماره‌گذاری وسائط نقلیه‌ای که مالیات و عوارض آنها پرداخت نشده است، خودداری نماید."},{"s":"پ ـ عوارض سالانه و عوارض سالانه آلایندگی وسائط نقلیه"},{"t":"ماده ۲۹","x":"عوارض سالانه کلیه وسائط نقلیه اعم از خودروهای سبک و سنگین و موتورسیکلت‌ها به شرح ذیل تعیین می‌شود:\n\n- **بند الف ـ** وسائط نقلیه تولید داخل معادل یک در هزار قیمت فروش کارخانه و وسائط نقلیه وارداتی معادل یک و نیم در هزار مجموع ارزش گمرکی و حقوق ورودی مشمول عوارض سالانه می‌شوند. مأخذ محاسبه عوارض موضوع این بند مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون است.\n\n- **بند ب ـ** وسائط نقلیه در شهرهای آلوده تا ده سال پس از تولید با مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون و معادل یک بیستم نرخ‌های مندرج در جدول ماده مذکور مشمول عوارض سالانه آلایندگی وسائط نقلیه علاوه بر عوارض موضوع بند «الف» این ماده می‌شوند. پس از سال دهم تولید، هر سال به میزان ده درصد (۱۰%) به نرخ پایه عوارض آلایندگی وسائط نقلیه مذکور اضافه می‌شود تا حداکثر به دو برابر نرخ پایه افزایش یابد. وسائط نقلیه‌ای که نرخ عوارض سالانه آلایندگی آنها در جدول ذیل ماده (۲۸) صفر می‌باشد، تا سپری شدن پنج سال از سال تولید، از پرداخت عوارض سالانه آلایندگی معاف می‌باشند و پس از آن، وسائط نقلیه سنگین با نرخی معادل یک دهم نرخ‌های مندرج در ردیف (D) جدول ماده (۲۸) و سایر وسائط نقلیه با نرخی معادل یک دهم نرخ‌های مندرج در ردیف (C) جدول مذکور مشمول عوارض سالانه آلایندگی می‌باشند. در مورد خودروهایی که تولید یا واردات آنها متوقف می‌شود، مأخذ محاسبه توسط سازمان و متناسب با آخرین سال تولید یا واردات تعیین می‌شود. فهرست شهرهای آلوده که وسائط نقلیه با پلاک انتظامی متعلق به شهرهای مذکور مشمول عوارض سالانه آلایندگی می‌شوند، حداکثر تا پایان دی‌ماه هر سال با پیشنهاد سازمان حفاظت محیط‌زیست و تصویب هیأت وزیران برای اجراء در سال بعد تعیین می‌شوند.\n\n- **تبصره ۱:** وزارت کشور مکلف است با ایجاد سامانه الکترونیک متمرکز عوارض سالانه وسائط نقلیه، امکان پرداخت و صدور الکترونیکی مفاصاحساب عوارض موضوع بندهای «الف» و «ب» این ماده را برای مالکان و استعلام برخط میزان عوارض پرداخت‌نشده مربوط به وسائط نقلیه را برای نیروی انتظامی و دفاتر اسناد رسمی فراهم کند.\n\n- **تبصره ۲:** پرداخت عوارض موضوع بندهای «الف» و «ب» این ماده بر عهده مالک است. مالکان وسائط نقلیه مکلفند عوارض مذکور هر سال را تا پایان همان سال پرداخت نمایند. چنانچه مالکیت وسائط نقلیه مذکور پس از سال تولید تغییر نماید، پرداخت عوارض سالانه و عوارض سالانه آلایندگی موضوع این ماده از سال انتقال بر عهده مالک جدید است.\n\n- **تبصره ۳:** وسائط نقلیه‌ای که گواهی اسقاط دارند، در سال اسقاط، مشمول عوارض بند «ب» موضوع این ماده نمی‌شوند.\n\n- **تبصره ۴:** کلیه وسائط نقلیه که قبل یا بعد از لازم‌الاجراء شدن این قانون شماره‌گذاری شده باشند نیز مشمول عوارض موضوع این ماده می‌شوند.\n\n- **تبصره ۵:** ثبت سند انتقال وسائط نقلیه توسط دفاتر اسناد رسمی و یا تعویض پلاک توسط نیروی انتظامی جمهوری اسلامی ایران (معاونت راهنمایی و رانندگی)، منوط به تسویه عوارض بندهای «الف» و «ب» این ماده مربوط به وسائط نقلیه مورد معامله و سایر وسائط نقلیه متعلق به انتقال‌دهنده و انتقال‌گیرنده است.\n\n- **تبصره ۶:** پرداخت عوارض موضوع بندهای «الف» و «ب» این ماده هر سال، حداکثر تا پایان همان سال، موجب برخورداری از تخفیف به میزان بیست درصد (۲۰%) است.\n\n- **تبصره ۷:** پرداخت عوارض مذکور پس از موعد مقرر مشمول جریمه غیرقابل بخشودگی معادل ده درصد (۱۰%) عوارض سالانه است و در صورت تأخیر بیش از یک ماه، علاوه بر جریمه مذکور مشمول جریمه‌ای معادل دو درصد (۲%) عوارض سالانه به ازای هر ماه نسبت به مدت تأخیر است.\n\n- **تبصره ۸:** در صورتی که مالک یا مالکان خودروهای سبک و سنگین و موتورسیکلت از پرداخت عوارض موضوع این ماده به مدت پنج سال از سال مالکیت، خودداری نمایند و یا مبلغ عوارض و جریمه پرداخت‌نشده از پنج درصد (۵%) نصاب معاملات کوچک موضوع جزء (۱) ماده (۳) قانون برگزاری مناقصات مصوب ۱۳۸۳/۱/۲۵، بیشتر شود، نیروی انتظامی موظف است بر اساس فهرست اعلامی وزارت کشور نسبت به توقف وسائط نقلیه مزبور تا پرداخت بدهی اقدام کند.\n\n- **تبصره ۹:** نیروی انتظامی جمهوری اسلامی ایران و شهرداری‌ها مکلفند امکان دسترسی برخط به پایگاه اطلاعات وسائط نقلیه خود را با رعایت طبقه‌بندی برای وزارت کشور فراهم کنند.\n\n- **تبصره ۱۰:** وزارت کشور موظف است نسبت به اطلاع‌رسانی در خصوص وظایف و تکالیف مالکان وسائط نقلیه به طرق مقتضی از جمله از طریق ارسال پیامک اقدام کند.\n\n- **تبصره ۱۱:** آیین‌نامه اجرائی این ماده ظرف سه ماه از تاریخ ابلاغ این قانون با پیشنهاد وزارت کشور به تصویب هیأت وزیران می‌رسد."},{"s":"ت ـ مالیات نقل و انتقال وسائط نقلیه"},{"t":"ماده ۳۰","x":"نقل و انتقال انواع خودرو و موتورسیکلت، به استثنای ماشین‌های راه‌سازی، کارگاهی، معدنی، کشاورزی و شناورها، مشمول مالیات نقل و انتقال به شرح ذیل می‌باشند: تولید داخل به میزان یک درصد (۱%) و وارداتی دو درصد (۲%) به مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون برای سال تولید. مأخذ محاسبه مالیات موضوع این ماده تا شش سال پس از سال تولید، سالانه ده درصد (۱۰%) همان مأخذ کاهش می‌یابد و برای سال‌های ششم به بعد، چهل درصد (۴۰%) مأخذ یادشده است.\n\n- **تبصره ۱:** ثبت سند انتقال وسائط نقلیه توسط دفاتر اسناد رسمی و یا تعویض پلاک توسط نیروی انتظامی، منوط به پرداخت مالیات نقل و انتقال موضوع این ماده و به ترتیبی است که سازمان مقرر می‌کند. مراجع مزبور در صورت تخلف از این حکم، ملزم به پرداخت دو برابر مالیات پرداخت‌نشده هستند.\n\n- **تبصره ۲:** اولین انتقال خودرو از کارخانجات سازنده و یا وصل‌کننده قطعات پیش‌ساخته (مونتاژکننده) داخلی و یا واردکنندگان (نمایندگی‌های رسمی شرکت‌های خارجی) به خریداران و همچنین هرگونه انتقال به صورت صلح و هبه به نفع دولت مشمول پرداخت مالیات نقل و انتقال موضوع این ماده می‌شود.\n\n- **تبصره ۳:** نقل و انتقال انواع خودرو و موتورسیکلت با پلاک انتظامی مناطق آزاد تجاری ـ صنعتی مشمول مالیات موضوع این ماده نمی‌شود."},{"s":"ث ـ مالیات خروج از کشور"},{"t":"ماده ۳۱","x":"سازمان مکلف است بابت خروج هر مسافر ایرانی به‌جز موارد تبصره (۱) این ماده از مرزهای هوایی، دریایی و زمینی وجوهی را به عنوان مالیات از مسافران دریافت و به حساب درآمد عمومی نزد خزانه‌داری کل کشور واریز نماید. میزان مالیات مذکور در قوانین بودجه سنواتی پیش‌بینی می‌گردد.\n\n- **تبصره ۱:** دارندگان گذرنامه‌های سیاسی و خدمت، خدمه وسایل نقلیه عمومی زمینی و دریایی و خطوط پروازی، دانشجویان شاغل به تحصیل در خارج از کشور (دارندگان اجازه خروج دانشجویی)، بیمارانی که با مجوز شورای پزشکی جهت درمان به خارج از کشور اعزام می‌گردند، دارندگان پروانه گذر مرزی و مرزنشینان، جانبازان انقلاب اسلامی که برای معالجه به کشورهای دیگر اعزام می‌شوند، زائران ایرانی که در ایام اربعین حسینی (ع) به مقصد عراق از کشور خارج می‌شوند و ایرانیان مقیم خارج از کشور که دارای کارنامه شغلی از وزارت تعاون، کار و رفاه اجتماعی هستند از پرداخت مالیات موضوع این ماده، مستثنی هستند.\n\n- **تبصره ۲:** گردشگران، ساکنین دائم یا موقت مناطق آزاد تجاری ـ صنعتی که صرفاً از مبدأ مناطق مذکور به خارج از کشور عزیمت می‌کنند، مشمول عوارض خروج از کشور موضوع قانون چگونگی اداره مناطق آزاد تجاری ـ صنعتی جمهوری اسلامی مصوب ۱۳۷۲/۰۶/۰۷ با اصلاحات و الحاقات بعدی و آیین‌نامه‌های اجرائی مربوط می‌شوند.\n\n- **تبصره ۳:** نیروی انتظامی جمهوری اسلامی ایران موظف است پرداخت مالیات خروج از کشور مسافران ایرانی که عازم خارج از کشور هستند را به روشی که سازمان تعیین می‌نماید کنترل و از خروج مسافرانی که مالیات مزبور را پرداخت ننموده‌اند، جلوگیری نماید."},{"s":"ج ـ عوارض برون‌شهری مسافر"},{"t":"ماده ۳۲","x":"اشخاصی که مبادرت به حمل و نقل برون‌شهری مسافر و فروش بلیط در داخل کشور با وسائط نقلیه زمینی (به استثنای ریلی) و دریایی می‌کنند، مکلفند پنج درصد (۵%) بهای بلیط را با درج در بلیط و یا قرارداد (صورتحساب)، حسب مورد، به عنوان عوارض شهرداری از مسافران أخذ و هر ماه حداکثر تا پانزدهم ماه بعد به حساب شهرداری مبدأ سفر واریز نمایند. واریز عوارض مذکور بعد از موعد مقرر موجب تعلق جریمه‌ای به میزان دو درصد (۲%) به ازای هر ماه تأخیر خواهد بود. اختلاف و استنکاف از پرداخت عوارض موضوع این ماده مشمول ماده (۷۷) قانون شهرداری مصوب ۱۳۳۴/۰۴/۱۱ با اصلاحات و الحاقات بعدی خواهد بود. آراء صادره در این خصوص، قابل اعتراض در دیوان عدالت اداری است."},{"t":"ماده ۳۳","x":"مالیات و عوارض موضوع این فصل به‌عنوان اعتبار مالیاتی محسوب نمی‌گردد. مالیات و عوارض موضوع مواد (۲۸) و (۳۰) این قانون به‌عنوان هزینه قابل قبول مالیاتی پذیرفته می‌شود."},{"t":"ماده ۳۴","x":"سازمان موظف است برای کلیه مودیان این قانون امکان اظهار و پرداخت مالیات موضوع فصول ششم و هفتم را از طریق سامانه مودیان فراهم کند."}]},{"h":"فصل هشتم: جریمه‌ها (از ماده ۳۵ تا ماده ۳۷)","a":[{"t":"ماده ۳۵","x":"مودیانی که از عضویت در سامانه مودیان امتناع ورزیده‌اند علاوه بر پرداخت جریمه‌های موضوع بند «الف» ماده (۳۶) این قانون و بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان مکلفند اظهارنامه هر دوره مالیاتی خود را حداکثر تا یک‌ماه پس از پایان هر دوره مالیاتی به سازمان تسلیم و مالیات و عوارض فروش خود را به حساب سازمان واریز نمایند."},{"t":"ماده ۳۶","x":"مؤدیان در صورت ارتکاب تخلفات ذیل علاوه بر پرداخت مالیات و عوارض، مشمول جریمه‌هایی به شرح زیر می‌باشند:\n\n- **بند الف ـ** تا زمان استقرار سامانه مودیان «موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان» عدم تسلیم اظهارنامه در هر دوره مالیاتی برای کلیه مودیان و بعد از استقرار سامانه مذکور برای آن دسته از مودیانی که از عضویت در سامانه مودیان امتناع کرده‌اند: ده میلیون (۱۰,۰۰۰,۰۰۰) ریال یا دو برابر مالیات و عوارض پرداخت‌نشده تا موعد مقرر در ماده (۴) این قانون، هر کدام بیشتر باشد. این جریمه علاوه بر جریمه مذکور در بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان است که مودی به دلیل عدم ثبت‌نام در سامانه مودیان باید بپردازد.\n\n- **بند ب ـ** کتمان معامله، بیش‌اظهاری مالیات و عوارض خرید یا کم‌اظهاری مالیات و عوارض فروش، ثبت معامله خود به نام غیر یا معامله غیر به نام خود، استناد به اسناد صوری و هر عمل دیگری که به کم‌اظهاری مالیات یا استرداد غیرواقعی منجر شود: دو برابر مالیات و عوارض پرداخت‌نشده تا موعد مقرر در ماده (۴) این قانون و در صورت تکرار تخلف قبل از دوسال، سه برابر مالیات پرداخت‌نشده.\n\n- **بند ج ـ** دریافت مالیات و عوارض توسط اشخاص غیرمجاز: دو برابر مالیات و عوارض دریافتی."},{"t":"ماده ۳۷","x":"تأخیر در پرداخت مالیات‌ها و عوارض موضوع این قانون در مواعد مقرر با رعایت مفاد ماده (۱۹۱) قانون مالیات‌های مستقیم، موجب تعلق جریمه‌ای به میزان دو درصد (۲%) در ماه، نسبت به مالیات و عوارض پرداخت‌نشده و مدت تأخیر از زمان انقضای مهلت تسلیم اظهارنامه یا سررسید پرداخت مالیات و عوارض، هر یک که مقدم باشد، خواهد بود.\n\n- **تبصره:** چنانچه مودی خارج از اراده خود امکان پرداخت مالیات و عوارض موضوع این قانون را در مواعد مقرر نداشته باشد، می‌تواند به هیأت‌های حل اختلاف مالیاتی اعتراض نماید. در صورتی که ادعای مودی با ارائه اسناد و مدارک مثبته در هیأت‌های حل اختلاف مالیاتی پذیرفته شود، جریمه مذکور بخشیده می‌شود."}]},{"h":"فصل نهم: تخصیص، انتقال و توزیع مالیات (از ماده ۳۸ تا ماده ۴۵)","a":[{"t":"ماده ۳۸","x":"مالیات و عوارض موضوع مواد (۷)، (۲۶) و (۲۸) این قانون و جریمه‌های مربوط به آنها پس از کسر کسورات قانونی، به ترتیب زیر توزیع می‌شود:\n\n۱ ـ یک‌نهم از مالیات‌ها و عوارض وصولی ماده (۷) و بندهای «الف» و «ب» ماده (۲۶) این قانون به‌عنوان مالیات سلامت به وزارت بهداشت، درمان و آموزش پزشکی اختصاص می‌یابد.\n\n۲ ـ باقی‌مانده، به نسبت مساوی سهم درآمد عمومی کشور و سهم شهرداری‌ها و دهیاری‌ها می‌باشد. سهم درآمد عمومی به عنوان مالیات به حساب خزانه‌داری کل کشور واریز می‌شود. سهم شهرداری‌ها و دهیاری‌ها به‌عنوان عوارض حسب مورد به حساب تمرکز وجوه اداره کل
