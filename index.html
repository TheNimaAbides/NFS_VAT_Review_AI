در کشور مقصد رسیده باشد یا گواهی ارزآوری با تأیید بانک مرکزی یا سایر اسناد و مدارک مثبته. صادرات کالاها و خدمات از قلمرو گمرکی سرزمین اصلی به مناطق آزاد تجاری ـ صنعتی خارج از نقاط جمعیتی که دارای تراز تجاری مثبت باشند، در صورتی که محصور بودن آنها به صورت سالانه به تأیید گمرک جمهوری اسلامی ایران برسد، مشمول این بند خواهد بود.\n\n- **بند ب ـ** خدمات معاوضه (سوآپ) نفت خام، فرآورده‌های نفتی (بنزین، نفت‌گاز، نفت کوره، نفت سفید، گازمایع و سوخت هوایی)، گازطبیعی و برق;\n\n- **بند پ ـ** فروش کلیه کالاها در قالب گواهی سپرده کالایی در بهابازار (بورس)های کالایی.\n\n- **تبصره ۱:** فروش کلیه فرآورده‌های تولیدی شرکت‌های پالایش به صورت ارزی (فروش سوخت‌های هوایی به شرکت‌های هواپیمایی خارجی در فرودگاه‌های داخلی)، مرزی (فروش سوخت در جایگاه‌های مستقر در نواحی مرزی کشور) و همچنین فروش سوخت دارای پروانه صادراتی گمرک جمهوری اسلامی ایران به کشتی‌ها (بنکرینگ) صادرات محسوب می‌شود.\n\n- **تبصره ۲:** استرداد مالیات و عوارض خرید برای صادرات مواد خام و مواد اولیه تولید که در فهرست مربوط به ماده (۱۴۱) قانون مالیات‌های مستقیم ذکر شده‌اند، ممنوع است.\n\n- **تبصره ۳:** خدماتی که توسط اشخاص مقیم ایران (اشخاص حقیقی یا حقوقی ایرانی و یا شعب شرکت‌های خارجی مقیم ایران) ارائه می‌شود و محل مصرف خدمات و یا مقصد خدمات داخل باشد یا خارج از کشور، در صورتی که مستقیم یا غیرمستقیم ارز حاصل و وارد کشور بشود صادرات محسوب می‌گردد.\n\n- **تبصره ۴:** در صورتی که کالاهای موضوع بند «پ» مشمول مالیات و عوارض فروش باشد، تحویل‌گیرنده از انبارهای پذیرش‌شده در بهابازار (بورس)های کالایی موظف به تسویه مالیات و عوارض خرید کالا بر اساس قیمت اعلامیه خرید خود با سازمان امور مالیاتی کشور است. اعلامیه خرید، در حکم صورتحساب است."},{"t":"ماده ۱۱","x":"مالیات و عوارض پرداختی بابت خرید کالاها در داخل ایران که ظرف دو ماه از تاریخ خرید همراه مسافران اعم از ایرانی و خارجی از کشور خارج می‌شود و نیز، مالیات و عوارض پرداختی گردشگران خارجی بابت بلیط پرواز خارجی خریداری‌شده از شرکت‌های هواپیمایی ایرانی، هنگام خروج از کشور با ارائه صورتحساب الکترونیکی و یا اسناد و مدارک مثبته، توسط سازمان، از محل وصولی‌های جاری مسترد می‌گردد. آیین‌نامه اجرائی این ماده ظرف شش‌ماه از تاریخ ابلاغ این قانون توسط سازمان تهیه می‌شود و به تصویب هیأت وزیران می‌رسد."},{"t":"ماده ۱۲","x":"عرضه‌کنندگان کالاها و خدمات که به موجب این قانون و سایر قوانین از مالیات و عوارض معاف می‌باشند و همچنین فعالان اقتصادی مستقر در مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی که حجم معاملات سالانه آنها از مبلغی که به پیشنهاد سازمان به تأیید هیأت وزیران می‌رسد، بیشتر باشد، مکلف به عضویت و ثبت معاملات در سامانه مودیان هستند. این حکم شامل کلیه مناطق کشور از جمله مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی می‌شود. متخلفان از حکم این ماده علاوه بر جریمه موضوع بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان مشمول جریمه‌ای معادل نه درصد (۹%) ارزش معاملات ثبت‌نشده در سامانه مذکور می‌شوند. آیین‌نامه اجرائی این ماده در خصوص مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی ظرف سه‌ماه پس از ابلاغ این قانون به پیشنهاد سازمان و دبیرخانه شورای‌عالی مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد."}]},{"h":"فصل چهارم: وظایف و تکالیف مؤدیان و اشخاص ثالث (از ماده ۱۳ تا ماده ۲۲)","a":[{"t":"ماده ۱۳","x":"پس از راه‌اندازی سامانه مودیان، همه مشمولان این قانون موظفند به ترتیبی که سازمان مقرر و اعلام می‌کند، در سامانه مزبور ثبت‌نام نموده و معاملات خود را در آن ثبت نمایند. ثبت معاملات (خرید و فروش) در سامانه مودیان، به منزله ثبت در دفاتر قانونی است. تا آن زمان، ترتیبات ثبت‌نام، نحوه ارائه اظهارنامه‌های مالیاتی و رسیدگی به آنها حسب مقررات قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ و اصلاحات بعدی آن است. در سایر موارد، مفاد این قانون جاری است."},{"t":"ماده ۱۴","x":"چنانچه سازمان در مهلت مقرر در قانون پایانه‌های فروشگاهی و سامانه مؤدیان نتواند سامانه مؤدیان را مستقر کند، مکلف است رسیدگی به اظهارنامه مؤدیان موضوع این قانون را که بعد از اتمام مهلت مزبور به سازمان تسلیم می‌شود، صرفاً به میزانی که در تبصره این ماده آمده است، محدود نموده و سایر اظهارنامه‌ها را بدون رسیدگی قبول نماید.\n\n- **تبصره:** بعد از استقرار سامانه مودیان سازمان مجاز است حداکثر یک درصد (۱%) از پرونده‌های مالیاتی مودیان عضو سامانه مودیان را با اولویت مودیان بزرگ مورد رسیدگی قرار دهد. چگونگی انتخاب مودیانی که پرونده آنها باید مورد رسیدگی قرار گیرد، در دستورالعملی که با پیشنهاد سازمان به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد، معین می‌شود. سازمان مکلف است تا پایان مهرماه هر سال فهرست اسامی مودیانی که مشمول رسیدگی قرار می‌گیرند را در سامانه عملیات الکترونیکی خود اعلام عمومی کند."},{"t":"ماده ۱۵","x":"دستگاه‌های اجرائی موضوع ماده (۵) قانون مدیریت خدمات کشوری و ماده (۲۹) قانون برنامه ششم توسعه و سازمان‌های وابسته به آنها مکلف به ثبت معاملات خود در سامانه مودیان می‌باشند. وزارت صنعت، معدن و تجارت موظف است ترتیبی اتخاذ کند که اطلاعات معاملات ثبت‌شده در سامانه تدارکات الکترونیکی دولت موضوع تبصره (۵) ماده (۱۶۹) قانون مالیات‌های مستقیم عیناً و به‌صورت برخط به سامانه مودیان منتقل شود."},{"t":"ماده ۱۶","x":"ارائه اسناد، دفاتر و مدارک، ثبت قراردادهای پیمانکاری و معاملات و اطلاعات نیروهای مسلح و وزارت دفاع و پشتیبانی نیروهای مسلح و سایر دستگاه‌های انتظامی، اطلاعاتی و امنیتی در سامانه مودیان موضوع تبصره (۳) ماده (۴)، تبصره (۱) ماده (۵) و مواد (۱۳) و (۱۵) این قانون و همچنین سایر اقلام محرمانه در سامانه مذکور با رعایت ملاحظات امنیتی، مطابق دستورالعملی است که توسط وزارتخانه‌های امور اقتصادی و دارایی (سازمان)، اطلاعات و دفاع و پشتیبانی نیروهای مسلح و ستاد کل نیروهای مسلح تهیه می‌شود و حداکثر شش ماه پس از لازم‌الاجراءشدن این قانون به تصویب شورای امنیت کشور می‌رسد."},{"t":"ماده ۱۷","x":"مؤدیان مکلفند مالیات و عوارض فروش موضوع این قانون را از خریدار یا کارفرما وصول کنند و پس از کسر مالیات و عوارض پرداختی، مطابق مقررات به حساب سازمان واریز نمایند.\n\n- **تبصره ۱:** سازمان می‌تواند تمام یا برخی از مودیان مشمول این قانون یا مشتریان آنها را مکلف کند مالیات و عوارض متعلقه را همزمان با صدور صورتحساب به حساب سازمان واریز نمایند. آیین‌نامه اجرائی این تبصره، مشتمل بر فهرست مودیانی که مشمول این حکم می‌شوند و نحوه پرداخت مالیات و عوارض متعلقه با پیشنهاد سازمان، به‌تصویب وزیر امور اقتصادی و دارایی می‌رسد. مالیات و عوارضی که به این ترتیب به سازمان پرداخت می‌شود، به حساب بستانکاری فروشنده منظور می‌شود و برای خریدار، در صورتی که مصرف‌کننده نهائی نباشد، اعتبار مالیاتی به‌حساب می‌آید.\n\n- **تبصره ۲:** گمرک جمهوری اسلامی ایران مکلف است مالیات و عوارض کالاهای وارداتی را در زمان ترخیص قطعی و مالیات و عوارض کالاهای متروکه را قبل از ترخیص نهائی وصول و به‌صورت برخط به حساب سازمان واریز کند. گمرک جمهوری اسلامی ایران موظف است ضمن درج اطلاعات پرداخت در پروانه‌های گمرکی و یا فرم‌های مربوط، امکان دسترسی برخط سازمان به پایگاه‌های اطلاعاتی ذی‌ربط را فراهم نماید. گمرک مکلف است در «ورود موقت» و «ورود موقت برای پردازش»، تضمینات لازم را بر اساس مقررات تبصره ماده (۵۳) قانون امور گمرکی أخذ کند.\n\n- **تبصره ۳:** واردکنندگان کالا از مناطق آزاد تجاری ـ صنعتی به سرزمین اصلی مکلفند کالاهای مزبور را به گمرک اظهار نمایند. گمرک موظف است از قسمتی از کالاهای اظهارشده که به‌موجب بند «ب» ماده (۶۵) قانون احکام دائمی برنامه‌های توسعه کشور مصوب ۱۳۹۵/۱۱/۱۰، «تولید داخل» محسوب می‌شود، فقط مالیات و عوارض، و از قسمت باقی‌مانده که «کالای وارداتی» محسوب می‌شود، مالیات و عوارض و حقوق ورودی را دریافت و مالیات و عوارض آن را به حساب سازمان واریز کند.\n\n- **تبصره ۴:** واردکنندگان خدمت مکلفند با رعایت تبصره (۳) ماده (۱۰) این قانون، مالیات و عوارض متعلقه را محاسبه و طبق مقررات این قانون پرداخت نمایند. چنانچه محل ارائه خدمت و مصرف آن در خارج از کشور باشد، مشمول این حکم نمی‌باشند.\n\n- **تبصره ۵:** مالیات و عوارض آب، برق و گاز با توجه به مالیات و عوارض مندرج در صورتحساب (قبوض) مصرف‌کنندگان و همچنین نفت تولیدی (نفت خام، میعانات گازی و گاز طبیعی خام) و فرآورده‌های تولیدی و وارداتی، فقط یک‌بار در زمان فروش (صدور صورتحساب)، در انتهای زنجیره تولید و توزیع آنها توسط شرکت‌های تابعه وزارت نفت (بابت پنج فرآورده اصلی و سوخت هوایی) و یا شرکت‌های پالایش نفت (بابت سایر فرآورده‌ها) و شرکت‌های گاز استانی و شرکت‌های تابع ذی‌ربط وزارت نیرو و شرکت‌های توزیع برق، آب و فاضلاب شهری و روستایی استانی بر مبنای قیمت فروش مصوب داخلی محاسبه، ثبت و وصول و پس از کسر اعتبارات مالیات و عوارض زنجیره مذکور به حساب سازمان نزد خزانه‌داری کل کشور واریز می‌شود. آیین‌نامه اجرائی این تبصره در خصوص نحوه ثبت مالیات و عوارض در دفاتر یا سامانه مودیان تعیین شرکت‌های فعال در زنجیره قبل از انتهای زنجیره توزیع و فروش، نحوه انتقال اعتبارات مالیات و عوارض به انتهای زنجیره، رسیدگی، مطالبه، تهاتر، استرداد، وصول و واریز به‌حساب تعیین‌شده سازمان ظرف شش‌ماه پس از تصویب این قانون با پیشنهاد مشترک سازمان، شرکت ملی نفت ایران و توانیر به‌تصویب وزیران امور اقتصادی و دارایی، نفت و نیرو می‌رسد."},{"t":"ماده ۱۸","x":"کلیه کارفرمایان موضوع ماده (۵) قانون مدیریت خدمات کشوری و ماده (۲۹) قانون برنامه ششم توسعه موظفند اطلاعات مربوط به قراردادهای پیمانکاری را حداکثر تا یک ماه پس از انعقاد قرارداد در سامانه مودیان ثبت نمایند، در غیر این‌صورت، سازمان مکلف است با رعایت ماده (۹) قانون پایانه‌های فروشگاهی و سامانه مودیان اطلاعات ثبت‌شده توسط پیمانکاران در سامانه مذکور را مورد قبول کارفرما تلقی نماید."},{"t":"ماده ۱۹","x":"وزیر امور اقتصادی و دارایی مجاز است با پیشنهاد سازمان مدت دوره مالیاتی را برای هر گروه از مودیان دو یا یک‌ماهه تعیین نماید; مشروط بر آنکه تغییرات مذکور حداقل سه‌ماه قبل از شروع دوره مالیاتی، از طریق سامانه مودیان، پایگاه اطلاع‌رسانی سازمان و حداقل یکی از روزنامه‌های کثیرالانتشار اطلاع‌رسانی عمومی شود.\n\n- **تبصره:** در صورتی که شروع یا خاتمه فعالیت مودی در خلال یک دوره مالیاتی باشد، زمان فعالیت مودی طی دوره مربوط، یک دوره مالیاتی تلقی می‌شود."},{"t":"ماده ۲۰","x":"- **بند الف ـ** سازمان می‌تواند برای اشخاص حقیقی که بیش از یک نوع واحد مشمول مالیات در یک مکان یا مکان‌های متعدد دارند، در سامانه مودیان کارپوشه واحد ایجاد کند.\n\n- **بند ب ـ** مودیانی که دارای واحد مشمول مالیات در شعب متعدد هستند، مکلفند از یک کارپوشه واحد در سامانه مودیان استفاده کنند.\n\n- **بند پ ـ** در مشارکت‌های مدنی، اعم از اختیاری و قهری، اشخاص حقیقی در هر واحد شغلی مکلفند از بین خود یک نفر را به‌عنوان نماینده واحد شغلی انتخاب نمایند. کلیه تکالیف مالیاتی واحد شغلی، از جمله ثبت‌نام و ثبت معاملات در سامانه مودیان و پرداخت مالیات توسط وی به نمایندگی شرکا انجام می‌شود، در غیر این‌صورت، سازمان موظف است دسترسی واحد مزبور به سامانه مودیان را قطع و پایانه فروشگاهی آن را مسدود نماید.\n\n- **بند ت ـ** برای مودیانی که مکان ثابت برای شغل خود ندارند، محل سکونت آنان، از لحاظ امور مالیاتی ملاک اعتبار است. در صورتی که مودی مکان‌های متعدد برای سکونت خود داشته باشد، مکلف است یکی از آنها را برای انجام تکالیف مالیاتی معرفی نماید، در غیر این‌صورت، سازمان یکی از مکان‌های سکونت مودی را برای انجام تکالیف مالیاتی انتخاب و به وی اعلام می‌کند."},{"t":"ماده ۲۱","x":"در مورد اشخاص حقوقی که حکم به انحلال آنها داده شده است تا زمان ختم تصفیه، شخص حقوقی مزبور کماکان مودی محسوب می‌شود و مدیر یا مدیران تصفیه مکلف به انجام تکالیف مقرر در این قانون می‌باشند."},{"t":"ماده ۲۲","x":"در انتقال یک واحد صنفی، شخص دارنده واحد صنفی تا اتمام انتقال، مسئولیت اجرای مقررات و تمامی تکالیف دوره‌های مالیاتی مربوط از جمله صدور صورتحساب، ثبت معاملات در سامانه مودیان و سایر تکالیف قانونی را برعهده دارد. خریدار مسئولیتی در قبال تکالیف واحد صنفی قبل از اتمام انتقال ندارد; مگر اینکه به موجب سند رسمی این مسئولیت را پذیرفته باشد.\n\n- **تبصره:** انتقال‌دهنده باید حداکثر ظرف ده روز سازمان را نسبت به زمان اتمام فعالیت خود مطلع سازد. در صورت عدم اطلاع و شروع فعالیت توسط مودی جدید، در پرداخت مالیات و جریمه‌ها با وی مسئولیت تضامنی خواهد داشت."}]},{"h":"فصل پنجم: ساختار سازمانی مالیات بر ارزش افزوده، وظایف و اختیارات آن (از ماده ۲۳ تا ماده ۲۵)","a":[{"t":"ماده ۲۳","x":"ساختار و تشکیلات مورد نیاز سازمان در سطح کشور و استان‌ها متناسب با شرایط اقتصادی هر منطقه و با توجه به شاخص‌هایی مانند میزان وصول مالیات، تعداد پرونده‌ها و تعداد مودیان بدون الزام به رعایت سطح تقسیمات کشوری با رعایت بند «الف» ماده (۲۸) قانون برنامه ششم توسعه از طریق وزیر امور اقتصادی و دارایی به سازمان اداری و استخدامی کشور پیشنهاد و پس از تصویب هیأت وزیران قابل اجراء است."},{"t":"ماده ۲۴","x":"پس از استقرار سامانه مودیان، فعال بودن کارپوشه مودی در سامانه مزبور به این معنی است که او از نظر سازمان، شرایط لازم برای دریافت مالیات و عوارض از خریداران را دارد. در صورتی که مودی شرایط لازم برای دریافت مالیات و عوارض را از دست بدهد، سازمان موظف است بلافاصله کارپوشه وی را در سامانه مودیان غیرفعال نماید. بانک مرکزی موظف است ترتیبی اتخاذ کند که به‌محض غیرفعال شدن کارپوشه مودی در سامانه مودیان، کلیه دستگاه‌های پایانه فروشگاهی (pos) مرتبط با آن، غیرفعال شوند.\n\n- **تبصره:** غیرفعال نمودن کارپوشه مودی باید مستند به آیین‌نامه‌ای باشد که حداکثر ظرف سه‌ماه پس از ابلاغ این قانون، با پیشنهاد سازمان به‌تصویب هیأت وزیران می‌رسد."},{"t":"ماده ۲۵","x":"- **بند الف ـ** مواد (۱۶۱)، (۱۶۲)، (۱۶۷)، (۱۶۹ مکرر)، (۱۷۱)، تبصره (۱) ماده (۱۷۷)، (۱۷۸)، (۱۸۲)، (۱۸۶) و تبصره (۱) آن، (۱۹۱)، (۱۹۸)، (۲۰۲)، احکام مربوط به فصل هشتم باب چهارم و مواد (۲۱۰) تا (۲۱۶)، (۲۱۸)، (۲۱۹)، (۲۳۱)، (۲۳۲)، (۲۳۵)، (۲۴۲)، (۲۴۳)، احکام مربوط به فصل سوم باب پنجم، مواد (۲۵۷)، (۲۷۴) منهای بند (۳) آن، (۲۷۵)، (۲۷۶)، (۲۷۷) و (۲۷۹) قانون مالیات‌های مستقیم در مورد این قانون جاری است. احکام مربوط به درآمد مشمول مالیات در مواد فوق، در مورد محاسبه مأخذ مالیات بر ارزش افزوده نیز جاری است. احکام فصل سوم باب پنجم قانون مالیات‌های مستقیم در خصوص مواد (۲۹) و (۳۲) این قانون جاری نمی‌باشد.\n\n  - **تبصره ۱:** شناسایی، تشخیص درآمد مشمول مالیات و رسیدگی موضوع ماده (۲۱۹) قانون مالیات‌های مستقیم در مورد مودیان قابل اعتماد موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان جاری نمی‌باشد. این حکم شامل مواردی که سازمان براساس ماده (۱۴) این قانون و تبصره (۱) ماده (۱۹) قانون پایانه‌های فروشگاهی و سامانه مودیان اجازه رسیدگی به اظهارنامه‌های مالیاتی مودیان را دارد، نمی‌باشد. در هر صورت مفاد ماده (۲۱۹) قانون مالیات‌های مستقیم نباید مانع اجرای احکام موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان شود.\n\n  - **تبصره ۲:** در خصوص مودیان عضو سامانه مودیان، سازمان مکلف است اوراق ابلاغ‌شده به مودی را در کارپوشه وی نیز بارگذاری نماید.\n\n  - **تبصره ۳:** به منظور رسیدگی به پرونده‌های قابل طرح این قانون در شورای‌عالی مالیاتی، تعداد شعب شورای مذکور به دو برابر افزایش می‌یابد.\n\n- **بند ب ـ** در صورت عدم عضویت مودیان در سامانه مودیان مواد (۹۷)، (۱۶۹)، (۱۸۱)، (۲۳۰) و بند (۳) ماده (۲۷۴) قانون مالیات‌های مستقیم در مورد مالیات‌های این قانون، جاری است.\n\n  - **تبصره:** ماده (۲۷۲) قانون مالیات‌های مستقیم و تبصره‌های آن تا قبل از اتمام مهلت مقرر در ماده (۳) قانون پایانه‌های فروشگاهی و سامانه مودیان، در مورد مالیات‌های این قانون جاری است."}]},{"h":"فصل ششم: مالیات کالاهای خاص (ماده ۲۶)","a":[{"t":"ماده ۲۶","x":"نرخ مالیات و عوارض کالاهای نفتی، فلزات گرانبها، سیگار، نوشابه و سایر کالاهای آسیب‌رسان به سلامت به شرح زیر تعیین می‌شود:\n\n#### الف ـ کالاهای نفتی\n\n۱ ـ انواع بنزین و سوخت هواپیما سی‌درصد (۳۰%);\n\n۲ ـ نفت‌گاز، نفت سفید، نفت کوره، گاز طبیعی و گاز مایع پانزده‌درصد (۱۵%).\n\n- **تبصره ۱:** نفت خام، میعانات گازی، و گاز طبیعی خام که توسط وزارت نفت (شرکت‌های تابعه) که به شرکت‌های داخل زنجیره تولید فرآورده‌های نفتی فروخته می‌شود، همچنین واردات بنزین و سوخت هواپیما و گاز طبیعی توسط وزارت نفت (شرکت‌های تابعه)، در این مرحله مستلزم محاسبه و دریافت مالیات و عوارض ارزش افزوده از حلقه بعدی و نیز پرداخت در مرحله واردات حسب مورد نمی‌باشد. مالیات و عوارض فروش فرآورده‌های تولیدشده از کالای مزبور و نیز بنزین و سوخت هواپیما و گاز طبیعی وارداتی در مراحل بعدی عرضه، حسب مقررات مربوط محاسبه و وصول می‌شود.\n\n- **تبصره ۲:** مأخذ محاسبه مالیات و عوارض فروش در خرده‌فروشی بنزین و نفت گاز توسط شرکت‌های غیردولتی دارای مجوز از وزارت نفت، عبارت است از مابه‌التفاوت قیمت خرید محصولات فوق از شرکت‌های پالایش (با احتساب مالیات و عوارض موضوع بند «الف» این ماده)، با قیمت عرضه آنها به مصرف‌کننده. مابه‌التفاوت مزبور به‌عنوان درآمد ناشی از ارائه خدمات توسط جایگاه‌های عرضه بنزین و نفت‌گاز تلقی شده و با نرخ مذکور در ماده (۷) این قانون مشمول مالیات و عوارض می‌گردد. مالیات و عوارض پرداختی بابت خرید بنزین و نفت‌گاز به‌عنوان اعتبار مالیاتی برای جایگاه‌داران منظور نمی‌شود.\n\n- **تبصره ۳:** مالیات و عوارض پرداختی مودیان بابت کالاهای موضوع این بند، در صورتی که به‌عنوان مواد اولیه اصلی توسط واحدهای تولیدی به‌کار برده شود، به‌عنوان اعتبار مالیاتی آن واحدها قابل پذیرش می‌باشد. همچنین مالیات و عوارض پرداختی توسط واردکنندگان و توزیع‌کنندگان کالاهای مزبور به‌عنوان اعتبار مالیاتی آنان منظور می‌گردد.\n\n- **تبصره ۴:** مالیات و عوارضی که شرکت ملی نفت ایران برای خرید نهاده‌های موردنیاز جهت طرح‌های تملک دارایی‌های سرمایه‌ای پرداخت می‌کند، قابل استرداد یا تهاتر نمی‌باشد. شرکت یادشده مجاز است مبالغ مزبور را به‌عنوان بخشی از بهای تمام‌شده دارایی‌های فوق‌الذکر منظور نماید. سایر مالیات و عوارضی که شرکت مزبور برای مصارفی غیر از تملک دارایی‌های سرمایه‌ای پرداخت می‌کند، با رعایت مقررات، به‌عنوان اعتبار مالیاتی آن شرکت منظور می‌گردد. اعتبار یادشده با تأیید سازمان قابل تهاتر با بدهی مالیاتی آن شرکت یا سایر شرکت‌های تابعه وزارت نفت می‌باشد.\n\n#### ب ـ طلا، جواهر و پلاتین\n\n۱ ـ اصل طلا، جواهر و پلاتین به کار رفته در مصنوعات ساخته‌شده از فلزات مزبور، معاف از مالیات و عوارض می‌باشد.\n\n۲ ـ اجرت ساخت، حق‌العمل و سود فروشنده کالاهای موضوع این بند مشمول مالیات و عوارض با نرخ نه درصد (۹%) می‌باشد.\n\n۳ ـ پس از راه‌اندازی سامانه مودیان، عرضه‌کنندگان کالا و خدمات مربوط به این بند مکلفند کلیه عملیات خرید و فروش خود را در سامانه مزبور ثبت کنند. درج ارزش اصل طلا، جواهر و پلاتین، اجرت ساخت، حق‌العمل و سود فروشنده به تفکیک در صورتحساب الکترونیکی الزامی است. در صورت کتمان و یا عدم ثبت تمام یا برخی از معاملات در سامانه مذکور مشمول جریمه‌ای معادل نه‌درصد (۹%) ارزش اصل طلا، جواهر و پلاتین است که غیرقابل بخشودگی می‌باشد. این جریمه علاوه بر جریمه مذکور در بند «ب» ماده (۳۶) این قانون است.\n\n۴ ـ کلیه واحدهای فعال در زنجیره عرضه کالا و خدمات مربوط به این بند مکلفند حداکثر تا دوماه پس از لازم‌الاجراءشدن این قانون از پایانه فروشگاهی مورد تأیید سازمان استفاده کنند، در غیر این صورت اتحادیه‌های ذی‌ربط و اتاق اصناف ایران موظفند پروانه فعالیت واحدهای موضوع این بند در کل زنجیره مربوط را که بدون استفاده از پایانه فروشگاهی اقدام به فروش کالا یا خدمت می‌کنند، باطل نمایند. نیروی انتظامی موظف است از ادامه فعالیت واحدهای فاقد پروانه جلوگیری کند.\n\n#### پ ـ نوشابه‌های قندی گازدار و بدون گاز و سایر کالاهای آسیب‌رسان به سلامت\n\nنوشابه‌های قندی گازدار و بدون گاز و سایر کالاهای آسیب‌رسان به سلامت (به‌استثنای کالاهای موضوع بند «ت» این ماده) تولید داخل مشمول مالیات و عوارض با نرخ شانزده‌درصد (۱۶%) و واردات آنها مشمول مالیات و عوارض با نرخ سی و شش درصد (۳۶%) می‌باشند. فهرست کالاهای موضوع این بند و واحدهای تولیدکننده آنها حداکثر دوماه پس از ابلاغ این قانون به پیشنهاد وزارت بهداشت، درمان و آموزش پزشکی و حداکثر یک‌ماه بعد از آن توسط کارگروهی مرکب از نمایندگان تام‌الاختیار وزارتخانه مزبور، وزارت صنعت، معدن و تجارت و وزارت امور اقتصادی و دارایی تصویب می‌شود. تغییرات فهرست موردنظر تا انتهای دی‌ماه هر سال (برای اجراء در سال بعد) به ترتیب فوق تصویب و توسط وزارت بهداشت، درمان و آموزش پزشکی برای اجراء اعلام می‌گردد. در صورت عدم تصویب فهرست مزبور در مهلت مقرر، فهرست پیشنهادی وزارت بهداشت، درمان و آموزش پزشکی پس از تأیید شورای‌عالی سلامت و امنیت غذایی، ملاک عمل است.\n\n#### ت ـ انواع سیگار و محصولات دخانی\n\nانواع سیگار و محصولات دخانی به شرح زیر مشمول مالیات و عوارض می‌شوند:\n\n۱ ـ سیگار، توتون پیپ و تنباکوی تولید داخلی، بیست و پنج درصد (۲۵%);\n\n۲ ـ سیگار، توتون پیپ و تنباکوی تولید داخل با نشان بین‌المللی که فهرست آن هر سال توسط وزارت صنعت، معدن و تجارت تهیه و با تصویب هیأت وزیران ابلاغ می‌شود، چهل‌درصد (۴۰%);\n\n۳ ـ سیگار، توتون پیپ و تنباکوی وارداتی، شصت و پنج‌درصد (۶۵%);\n\n۴ ـ توتون خام وارداتی ده‌درصد (۱۰%);\n\n۵ ـ توتون فرآوری‌شده وارداتی (خرمن توتون) سی و پنج‌درصد (۳۵%).\n\n- **تبصره ۱:** نرخ‌های تعیین‌شده از سال دوم اجرای قانون هر سال پنج واحد درصد افزایش می‌یابد تا زمانی که نرخ مذکور برای انواع سیگار و محصولات دخانی، توتون پیپ و تنباکوی تولید داخل به پنجاه و پنج درصد (۵۵%)، برای تولیدات داخل با نشان بین‌المللی به نود و پنج‌درصد (۹۵%) و برای انواع سیگار و محصولات دخانی، توتون پیپ و تنباکوی وارداتی به یکصد و بیست و پنج‌درصد (۱۲۵%) برسد.\n\n- **تبصره ۲:** تولیدکنندگان سیگار و محصولات دخانی مکلفند از زمان لازم‌الاجراءشدن این قانون، قیمت خرده‌فروشی و تاریخ تولید را بر روی پاکت بسته‌بندی محصولات دخانی درج کنند. در صورت تخلف از حکم این تبصره، اعتبار مالیاتی مربوط، پذیرفته نمی‌شود و مشمول مالیات و عوارض فروش به نرخ‌های مذکور است."}]},{"h":"فصل هفتم: مالیات‌ها و عوارض خاص (از ماده ۲۷ تا ماده ۳۴)","a":[{"s":"الف ـ عوارض سبز"},{"t":"ماده ۲۷","x":"واحدهای تولیدی، صنعتی، معدنی و خدماتی آلاینده که به تشخیص سازمان حفاظت محیط‌زیست، حدود مجاز و استانداردهای زیست‌محیطی را رعایت نمی‌کنند، در صورتی که در مهلت زمانی که توسط سازمان مزبور برای آنها تعیین می‌شود، نسبت به رفع آلایندگی خود اقدام ننمایند، براساس معیارهایی نظیر شدت، مدت، نوع و مکان آلایندگی با نرخ‌های نیم‌درصد (۰/۵%)، یک درصد (۱%) و یک و نیم درصد (۱/۵%)، به مأخذ فروش کالا یا خدمات، مشمول عوارض سبز می‌شوند. این حکم در مورد کلیه واحدهای آلاینده، اعم از واحدهای معاف و غیرمعاف، صادراتی و واحدهای مستقر در مناطق آزاد تجاری ـ صنعتی و مناطق ویژه اقتصادی جاری است. معیارهایی که در تعیین سطح آلایندگی واحدها، مبنای عمل سازمان محیط‌زیست قرار می‌گیرد، حداکثر سه‌ماه پس از لازم‌الاجراءشدن این قانون، توسط کارگروهی متشکل از نمایندگان سازمان حفاظت محیط‌زیست و وزارتخانه‌های بهداشت، درمان و آموزش پزشکی، صنعت، معدن و تجارت، کشور و امور اقتصادی و دارایی (سازمان) تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد. میزان فروش واحدهای موضوع این ماده بر اساس سامانه مودیان یا اظهارنامه‌ای که به همین منظور به سازمان ارائه می‌شود، تعیین می‌گردد.\n\n- **تبصره ۱:** در صورتی که واحدهای موضوع این ماده، دارای خطوط تولیدی مجزا با محصول مستقل از هم باشند عوارض سبز صرفاً از خطوط آلاینده دریافت می‌شود.\n\n- **تبصره ۲:** در صورتی که واحدهای موضوع این ماده، در قبال أخذ کارمزد مشخص از اشخاص نسبت به تولید اقدام نمایند، درآمد این واحدها ناشی از تولید مذکور، با پنج برابر نرخ‌های مذکور در صدر این ماده مشمول عوارض سبز می‌شود. شرکت‌هایی که در زنجیره تولید بنزین و سوخت هواپیما، نفت سفید، نفت کوره، نفت‌گاز، گازطبیعی و برق فعالیت می‌کنند، از شمول حکم این تبصره مستثنی می‌باشند. قیمت فروش فرآورده به مصرف‌کننده نهائی مبنای محاسبه عوارض موضوع این ماده برای شرکت‌های زنجیره تولید بنزین و سوخت هواپیما، نفت سفید، نفت کوره، نفت‌گاز، گازطبیعی و برق می‌باشد که شرکت‌های بالادستی آنها متضامناً مسئول پرداخت عوارض مربوط هستند.\n\n- **تبصره ۳:** سازمان حفاظت محیط‌زیست مکلف است حداکثر ظرف شش‌ماه پس از تاریخ لازم‌الاجراءشدن این قانون، پایگاه اطلاعاتی واحدهای آلاینده را ایجاد نماید و امکان دسترسی برخط سازمان به سامانه مزبور را فراهم کند. سازمان حفاظت محیط‌زیست موظف است نام واحدهای آلاینده و سطح آلایندگی آنها را در پایگاه مزبور درج نموده و آن را مستمراً به‌روزرسانی کند.\n\n- **تبصره ۴:** در صورتی که سازمان حفاظت محیط‌زیست نام واحدی را در پایگاه واحدهای آلاینده درج نماید یا سطح آلایندگی آن واحد را در پایگاه مزبور افزایش دهد، واحد موردنظر از ابتدای دوره مالیاتی بعد، حسب مورد، مشمول عوارض سبز می‌شود، یا نرخ عوارض مزبور برای آن واحد افزایش می‌یابد.\n\n- **تبصره ۵:** در صورتی که سازمان حفاظت محیط‌زیست نام واحدی را از پایگاه واحدهای آلاینده حذف نماید، یا سطح آلایندگی آن واحد را در پایگاه مزبور کاهش دهد، واحد موردنظر از ابتدای همان دوره، حسب مورد، از پرداخت عوارض سبز معاف می‌شود، یا نرخ عوارض مزبور برای آن واحد کاهش می‌یابد.\n\n- **تبصره ۶:** سازمان حفاظت محیط‌زیست موظف است حداکثر ظرف یک‌ماه از تاریخ درخواست واحد آلاینده، در خصوص رفع یا کاهش آلایندگی آن واحد اعلام نظر نماید و هرگونه تغییر در وضعیت واحد موردنظر را در پایگاه اطلاعاتی واحدهای آلاینده منعکس نماید. در صورت عدم اعلام نظر سازمان حفاظت محیط‌زیست در مهلت مقرر، واحد مزبور به صورت خودکار از فهرست واحدهای آلاینده خارج می‌شود.\n\n- **تبصره ۷:** سرمایه‌گذاری‌هایی که به‌منظور رفع یا کاهش آلایندگی واحدهای آلاینده انجام می‌شود، در صورت تأیید رفع یا کاهش آلایندگی توسط سازمان حفاظت محیط‌زیست، در سال اول یا سال‌های بعد، از بدهی عوارض آن واحدها کسر می‌شود و در صورتی که به رفع یا کاهش آلایندگی منجر نشود، به‌عنوان هزینه قابل قبول مالیاتی پذیرفته می‌شود.\n\n- **تبصره ۸:** در صورتی که پالایشگاه‌ها و نیروگاه‌هایی که سوخت اصلی آنها نفت کوره و نفت‌گاز نیست، در مقاطع خاصی از سال با درخواست دولت، مجبور به استفاده از سوخت‌های مزبور شوند، سازمان حفاظت محیط‌زیست موظف است این موضوع را در احتساب سطح و مدت آلایندگی آن واحدها لحاظ نماید و افزایش آلایندگی ناشی از استفاده نفت کوره و نفت گاز را مطابق با قبل از الزام مزبور محاسبه کند.\n\n- **تبصره ۹:** اعلام سازمان حفاظت محیط‌زیست صرفاً برای دوره‌های بعد از ثبت در سامانه ملاک اعتبار است و سازمان مذکور مجاز به اظهار نظر نسبت به رفع و یا آلایندگی واحدهای تولیدی برای دوره‌های ثبت‌شده در سامانه تحت عنوان اصلاح و تصحیح اشتباه نیست.\n\n- **تبصره ۱۰:** یارانه پرداختی دولت موضوع بند «ج» تبصره (۲) ماده (۵) این قانون، جزء مأخذ محاسبه عوارض سبز نیست.\n\n- **تبصره ۱۱:** مودیان موضوع این ماده مکلفند اظهارنامه هر دوره را مطابق نمونه‌ای که سازمان تعیین می‌نماید حداکثر تا پایان ماه پس از انقضای دوره، تسلیم و عوارض را ظرف مهلت مزبور به حساب تعیین‌شده واریز نمایند. عدم تسلیم اظهارنامه در مهلت‌های مقرر موجب تعلق جریمه غیرقابل بخشودگی به میزان ده‌درصد (۱۰%) عوارض موضوع این ماده می‌باشد و در صورت تأخیر در پرداخت عوارض، مشمول جریمه موضوع ماده (۳۷) این قانون می‌شود. واحدهای عضو سامانه مودیان ملزم به ارائه اظهارنامه موضوع این تبصره نبوده و سازمان به استناد فروش ابرازی آنها در سامانه مودیان، عوارض آلایندگی را وصول می‌کند."},{"s":"ب ـ مالیات و عوارض شماره‌گذاری وسائط نقلیه"},{"t":"ماده ۲۸","x":"شماره‌گذاری انواع خودروهای سبک و سنگین و موتورسیکلت، براساس رتبه انرژی آنها، که به تأیید سازمان ملی استاندارد ایران رسیده است، طبق نرخ‌های مندرج در جدول زیر مشمول مالیات و عوارض سبز می‌باشد. مأخذ مالیات و عوارض موضوع این ماده، قیمت فروش کارخانه در مورد تولیدات داخلی و مجموع ارزش گمرکی و حقوق ورودی برای خودروهای وارداتی است.\n\n(ارقام جدول ذیل به درصد می‌باشد)\n\n| رتبه انرژی | سواری و وانت دوکابین: تولید داخل | سواری و وانت دوکابین: وارداتی | وانت تک‌کابین، خودروی سواری با شماره‌گذاری عمومی: تولید داخل | وانت تک‌کابین، خودروی سواری با شماره‌گذاری عمومی: وارداتی | خودروهای سنگین: تولید داخل | خودروهای سنگین: وارداتی | موتورسیکلت: تولید داخل | موتورسیکلت: وارداتی |\n\n|---|---|---|---|---|---|---|---|---|\n\n| A | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ |\n\n| B | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ | ۰ |\n\n| C | ۰/۵ | ۱ | ۰/۲ | ۰/۴ | ۰ | ۰ | ۰/۲۵ | ۰/۵ |\n\n| D | ۱ | ۳ | ۰/۴ | ۰/۸ | ۰/۱ | ۰/۲ | ۰/۵ | ۱/۵ |\n\n| E | ۲ | ۵ | ۰/۸ | ۱/۶ | ۰/۲ | ۰/۴ | ۱ | ۲/۵ |\n\n| F | ۳ | ۷ | ۱/۲ | ۲/۴ | ۰/۴ | ۰/۶ | ۱/۵ | ۳/۵ |\n\n| G | ۵ | ۹ | ۱/۵ | ۳ | ۰/۶ | ۰/۸ | ۲/۵ | ۵ |\n\n- **تبصره ۱:** مأخذ مالیات و عوارض موضوع این ماده برای انواع خودروهای سبک و سنگین و موتورسیکلت‌های تولید داخل یا وارداتی تا پایان دی‌ماه، توسط سازمان تعیین و برای اجراء در سال بعد اعلام می‌شود. مأخذ مزبور برای وسائط نقلیه‌ای که جدیداً تولید یا وارد می‌شوند، بلافاصله پس از تولید یا واردات توسط سازمان تعیین و اعلام می‌شود.\n\n- **تبصره ۲:** خودروهای سبک و سنگین و موتورسیکلت‌های برقی و تمام برقی (هیبرید پلاگین) به تشخیص وزارت صنعت، معدن و تجارت مشمول مالیات و عوارض موضوع این ماده نمی‌باشد.\n\n- **تبصره ۳:** وزارت صنعت، معدن و تجارت مکلف است ظرف سه ماه از تاریخ ابلاغ این قانون، با همکاری سازمان حفاظت محیط‌زیست و سازمان ملی استاندارد ایران، فهرست کلیه خودروها و موتورسیکلت‌های تولید داخل و وارداتی را با توجه به رتبه انرژی، که در برچسب انرژی آنها درج شده است، به‌صورت برخط به سازمان اعلام نماید و برای اطلاع عموم، منتشر نماید.\n\n- **تبصره ۴:** در صورتی که خودروها و موتورسیکلت‌های موضوع این ماده فاقد برچسب انرژی مورد تأیید سازمان ملی استاندارد ایران باشند، مصداق وسائط نقلیه ردیف (G) تلقی می‌شود.\n\n- **تبصره ۵:** اشخاص حقوقی واردکننده و تولیدکنندگان انواع وسائط نقلیه موضوع این ماده مکلفند اظهارنامه مربوط به مالیات و عوارض شماره‌گذاری و همچنین مشخصات دقیق وسائط نقلیه فروخته‌شده هر ماه را حداکثر تا پانزدهم ماه بعد به نحوی که سازمان اعلام می‌کند، به سازمان تسلیم و مالیات و عوارض متعلق به آن را پرداخت نمایند. عدم پرداخت مذکور در مهلت مقرر، موجب جریمه غیرقابل بخشودگی به میزان ده درصد (۱۰%) مالیات و عوارض موضوع این ماده و در صورت تأخیر در پرداخت آن، مشمول جریمه‌های موضوع ماده (۳۷) این قانون می‌شود.\n\n- **تبصره ۶:** اشخاص حقیقی واردکننده خودرو و موتورسیکلت مکلفند قبل از شماره‌گذاری، با مراجعه به ادارات امور مالیاتی ذی‌ربط، مالیات و عوارض متعلق به آن را به ترتیبی که سازمان تعیین می‌نماید پرداخت کنند. شماره‌گذاری وسائط نقلیه متعلق به دولت و نیروهای نظامی و انتظامی نیز مشمول این ماده است.\n\n- **تبصره ۷:** نیروی انتظامی جمهوری اسلامی ایران (معاونت راهنمایی و رانندگی) مکلف است قبل از شماره‌گذاری وسائط نقلیه واردشده توسط اشخاص حقیقی، گواهی پرداخت مالیات و عوارض را بررسی و از شماره‌گذاری وسائط نقلیه‌ای که مالیات و عوارض آنها پرداخت نشده است، خودداری نماید."},{"s":"پ ـ عوارض سالانه و عوارض سالانه آلایندگی وسائط نقلیه"},{"t":"ماده ۲۹","x":"عوارض سالانه کلیه وسائط نقلیه اعم از خودروهای سبک و سنگین و موتورسیکلت‌ها به شرح ذیل تعیین می‌شود:\n\n- **بند الف ـ** وسائط نقلیه تولید داخل معادل یک در هزار قیمت فروش کارخانه و وسائط نقلیه وارداتی معادل یک و نیم در هزار مجموع ارزش گمرکی و حقوق ورودی مشمول عوارض سالانه می‌شوند. مأخذ محاسبه عوارض موضوع این بند مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون است.\n\n- **بند ب ـ** وسائط نقلیه در شهرهای آلوده تا ده سال پس از تولید با مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون و معادل یک بیستم نرخ‌های مندرج در جدول ماده مذکور مشمول عوارض سالانه آلایندگی وسائط نقلیه علاوه بر عوارض موضوع بند «الف» این ماده می‌شوند. پس از سال دهم تولید، هر سال به میزان ده درصد (۱۰%) به نرخ پایه عوارض آلایندگی وسائط نقلیه مذکور اضافه می‌شود تا حداکثر به دو برابر نرخ پایه افزایش یابد. وسائط نقلیه‌ای که نرخ عوارض سالانه آلایندگی آنها در جدول ذیل ماده (۲۸) صفر می‌باشد، تا سپری شدن پنج سال از سال تولید، از پرداخت عوارض سالانه آلایندگی معاف می‌باشند و پس از آن، وسائط نقلیه سنگین با نرخی معادل یک دهم نرخ‌های مندرج در ردیف (D) جدول ماده (۲۸) و سایر وسائط نقلیه با نرخی معادل یک دهم نرخ‌های مندرج در ردیف (C) جدول مذکور مشمول عوارض سالانه آلایندگی می‌باشند. در مورد خودروهایی که تولید یا واردات آنها متوقف می‌شود، مأخذ محاسبه توسط سازمان و متناسب با آخرین سال تولید یا واردات تعیین می‌شود. فهرست شهرهای آلوده که وسائط نقلیه با پلاک انتظامی متعلق به شهرهای مذکور مشمول عوارض سالانه آلایندگی می‌شوند، حداکثر تا پایان دی‌ماه هر سال با پیشنهاد سازمان حفاظت محیط‌زیست و تصویب هیأت وزیران برای اجراء در سال بعد تعیین می‌شوند.\n\n- **تبصره ۱:** وزارت کشور مکلف است با ایجاد سامانه الکترونیک متمرکز عوارض سالانه وسائط نقلیه، امکان پرداخت و صدور الکترونیکی مفاصاحساب عوارض موضوع بندهای «الف» و «ب» این ماده را برای مالکان و استعلام برخط میزان عوارض پرداخت‌نشده مربوط به وسائط نقلیه را برای نیروی انتظامی و دفاتر اسناد رسمی فراهم کند.\n\n- **تبصره ۲:** پرداخت عوارض موضوع بندهای «الف» و «ب» این ماده بر عهده مالک است. مالکان وسائط نقلیه مکلفند عوارض مذکور هر سال را تا پایان همان سال پرداخت نمایند. چنانچه مالکیت وسائط نقلیه مذکور پس از سال تولید تغییر نماید، پرداخت عوارض سالانه و عوارض سالانه آلایندگی موضوع این ماده از سال انتقال بر عهده مالک جدید است.\n\n- **تبصره ۳:** وسائط نقلیه‌ای که گواهی اسقاط دارند، در سال اسقاط، مشمول عوارض بند «ب» موضوع این ماده نمی‌شوند.\n\n- **تبصره ۴:** کلیه وسائط نقلیه که قبل یا بعد از لازم‌الاجراء شدن این قانون شماره‌گذاری شده باشند نیز مشمول عوارض موضوع این ماده می‌شوند.\n\n- **تبصره ۵:** ثبت سند انتقال وسائط نقلیه توسط دفاتر اسناد رسمی و یا تعویض پلاک توسط نیروی انتظامی جمهوری اسلامی ایران (معاونت راهنمایی و رانندگی)، منوط به تسویه عوارض بندهای «الف» و «ب» این ماده مربوط به وسائط نقلیه مورد معامله و سایر وسائط نقلیه متعلق به انتقال‌دهنده و انتقال‌گیرنده است.\n\n- **تبصره ۶:** پرداخت عوارض موضوع بندهای «الف» و «ب» این ماده هر سال، حداکثر تا پایان همان سال، موجب برخورداری از تخفیف به میزان بیست درصد (۲۰%) است.\n\n- **تبصره ۷:** پرداخت عوارض مذکور پس از موعد مقرر مشمول جریمه غیرقابل بخشودگی معادل ده درصد (۱۰%) عوارض سالانه است و در صورت تأخیر بیش از یک ماه، علاوه بر جریمه مذکور مشمول جریمه‌ای معادل دو درصد (۲%) عوارض سالانه به ازای هر ماه نسبت به مدت تأخیر است.\n\n- **تبصره ۸:** در صورتی که مالک یا مالکان خودروهای سبک و سنگین و موتورسیکلت از پرداخت عوارض موضوع این ماده به مدت پنج سال از سال مالکیت، خودداری نمایند و یا مبلغ عوارض و جریمه پرداخت‌نشده از پنج درصد (۵%) نصاب معاملات کوچک موضوع جزء (۱) ماده (۳) قانون برگزاری مناقصات مصوب ۱۳۸۳/۱/۲۵، بیشتر شود، نیروی انتظامی موظف است بر اساس فهرست اعلامی وزارت کشور نسبت به توقف وسائط نقلیه مزبور تا پرداخت بدهی اقدام کند.\n\n- **تبصره ۹:** نیروی انتظامی جمهوری اسلامی ایران و شهرداری‌ها مکلفند امکان دسترسی برخط به پایگاه اطلاعات وسائط نقلیه خود را با رعایت طبقه‌بندی برای وزارت کشور فراهم کنند.\n\n- **تبصره ۱۰:** وزارت کشور موظف است نسبت به اطلاع‌رسانی در خصوص وظایف و تکالیف مالکان وسائط نقلیه به طرق مقتضی از جمله از طریق ارسال پیامک اقدام کند.\n\n- **تبصره ۱۱:** آیین‌نامه اجرائی این ماده ظرف سه ماه از تاریخ ابلاغ این قانون با پیشنهاد وزارت کشور به تصویب هیأت وزیران می‌رسد."},{"s":"ت ـ مالیات نقل و انتقال وسائط نقلیه"},{"t":"ماده ۳۰","x":"نقل و انتقال انواع خودرو و موتورسیکلت، به استثنای ماشین‌های راه‌سازی، کارگاهی، معدنی، کشاورزی و شناورها، مشمول مالیات نقل و انتقال به شرح ذیل می‌باشند: تولید داخل به میزان یک درصد (۱%) و وارداتی دو درصد (۲%) به مأخذ مذکور در تبصره (۱) ماده (۲۸) این قانون برای سال تولید. مأخذ محاسبه مالیات موضوع این ماده تا شش سال پس از سال تولید، سالانه ده درصد (۱۰%) همان مأخذ کاهش می‌یابد و برای سال‌های ششم به بعد، چهل درصد (۴۰%) مأخذ یادشده است.\n\n- **تبصره ۱:** ثبت سند انتقال وسائط نقلیه توسط دفاتر اسناد رسمی و یا تعویض پلاک توسط نیروی انتظامی، منوط به پرداخت مالیات نقل و انتقال موضوع این ماده و به ترتیبی است که سازمان مقرر می‌کند. مراجع مزبور در صورت تخلف از این حکم، ملزم به پرداخت دو برابر مالیات پرداخت‌نشده هستند.\n\n- **تبصره ۲:** اولین انتقال خودرو از کارخانجات سازنده و یا وصل‌کننده قطعات پیش‌ساخته (مونتاژکننده) داخلی و یا واردکنندگان (نمایندگی‌های رسمی شرکت‌های خارجی) به خریداران و همچنین هرگونه انتقال به صورت صلح و هبه به نفع دولت مشمول پرداخت مالیات نقل و انتقال موضوع این ماده می‌شود.\n\n- **تبصره ۳:** نقل و انتقال انواع خودرو و موتورسیکلت با پلاک انتظامی مناطق آزاد تجاری ـ صنعتی مشمول مالیات موضوع این ماده نمی‌شود."},{"s":"ث ـ مالیات خروج از کشور"},{"t":"ماده ۳۱","x":"سازمان مکلف است بابت خروج هر مسافر ایرانی به‌جز موارد تبصره (۱) این ماده از مرزهای هوایی، دریایی و زمینی وجوهی را به عنوان مالیات از مسافران دریافت و به حساب درآمد عمومی نزد خزانه‌داری کل کشور واریز نماید. میزان مالیات مذکور در قوانین بودجه سنواتی پیش‌بینی می‌گردد.\n\n- **تبصره ۱:** دارندگان گذرنامه‌های سیاسی و خدمت، خدمه وسایل نقلیه عمومی زمینی و دریایی و خطوط پروازی، دانشجویان شاغل به تحصیل در خارج از کشور (دارندگان اجازه خروج دانشجویی)، بیمارانی که با مجوز شورای پزشکی جهت درمان به خارج از کشور اعزام می‌گردند، دارندگان پروانه گذر مرزی و مرزنشینان، جانبازان انقلاب اسلامی که برای معالجه به کشورهای دیگر اعزام می‌شوند، زائران ایرانی که در ایام اربعین حسینی (ع) به مقصد عراق از کشور خارج می‌شوند و ایرانیان مقیم خارج از کشور که دارای کارنامه شغلی از وزارت تعاون، کار و رفاه اجتماعی هستند از پرداخت مالیات موضوع این ماده، مستثنی هستند.\n\n- **تبصره ۲:** گردشگران، ساکنین دائم یا موقت مناطق آزاد تجاری ـ صنعتی که صرفاً از مبدأ مناطق مذکور به خارج از کشور عزیمت می‌کنند، مشمول عوارض خروج از کشور موضوع قانون چگونگی اداره مناطق آزاد تجاری ـ صنعتی جمهوری اسلامی مصوب ۱۳۷۲/۰۶/۰۷ با اصلاحات و الحاقات بعدی و آیین‌نامه‌های اجرائی مربوط می‌شوند.\n\n- **تبصره ۳:** نیروی انتظامی جمهوری اسلامی ایران موظف است پرداخت مالیات خروج از کشور مسافران ایرانی که عازم خارج از کشور هستند را به روشی که سازمان تعیین می‌نماید کنترل و از خروج مسافرانی که مالیات مزبور را پرداخت ننموده‌اند، جلوگیری نماید."},{"s":"ج ـ عوارض برون‌شهری مسافر"},{"t":"ماده ۳۲","x":"اشخاصی که مبادرت به حمل و نقل برون‌شهری مسافر و فروش بلیط در داخل کشور با وسائط نقلیه زمینی (به استثنای ریلی) و دریایی می‌کنند، مکلفند پنج درصد (۵%) بهای بلیط را با درج در بلیط و یا قرارداد (صورتحساب)، حسب مورد، به عنوان عوارض شهرداری از مسافران أخذ و هر ماه حداکثر تا پانزدهم ماه بعد به حساب شهرداری مبدأ سفر واریز نمایند. واریز عوارض مذکور بعد از موعد مقرر موجب تعلق جریمه‌ای به میزان دو درصد (۲%) به ازای هر ماه تأخیر خواهد بود. اختلاف و استنکاف از پرداخت عوارض موضوع این ماده مشمول ماده (۷۷) قانون شهرداری مصوب ۱۳۳۴/۰۴/۱۱ با اصلاحات و الحاقات بعدی خواهد بود. آراء صادره در این خصوص، قابل اعتراض در دیوان عدالت اداری است."},{"t":"ماده ۳۳","x":"مالیات و عوارض موضوع این فصل به‌عنوان اعتبار مالیاتی محسوب نمی‌گردد. مالیات و عوارض موضوع مواد (۲۸) و (۳۰) این قانون به‌عنوان هزینه قابل قبول مالیاتی پذیرفته می‌شود."},{"t":"ماده ۳۴","x":"سازمان موظف است برای کلیه مودیان این قانون امکان اظهار و پرداخت مالیات موضوع فصول ششم و هفتم را از طریق سامانه مودیان فراهم کند."}]},{"h":"فصل هشتم: جریمه‌ها (از ماده ۳۵ تا ماده ۳۷)","a":[{"t":"ماده ۳۵","x":"مودیانی که از عضویت در سامانه مودیان امتناع ورزیده‌اند علاوه بر پرداخت جریمه‌های موضوع بند «الف» ماده (۳۶) این قانون و بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان مکلفند اظهارنامه هر دوره مالیاتی خود را حداکثر تا یک‌ماه پس از پایان هر دوره مالیاتی به سازمان تسلیم و مالیات و عوارض فروش خود را به حساب سازمان واریز نمایند."},{"t":"ماده ۳۶","x":"مؤدیان در صورت ارتکاب تخلفات ذیل علاوه بر پرداخت مالیات و عوارض، مشمول جریمه‌هایی به شرح زیر می‌باشند:\n\n- **بند الف ـ** تا زمان استقرار سامانه مودیان «موضوع قانون پایانه‌های فروشگاهی و سامانه مودیان» عدم تسلیم اظهارنامه در هر دوره مالیاتی برای کلیه مودیان و بعد از استقرار سامانه مذکور برای آن دسته از مودیانی که از عضویت در سامانه مودیان امتناع کرده‌اند: ده میلیون (۱۰,۰۰۰,۰۰۰) ریال یا دو برابر مالیات و عوارض پرداخت‌نشده تا موعد مقرر در ماده (۴) این قانون، هر کدام بیشتر باشد. این جریمه علاوه بر جریمه مذکور در بند «ب» ماده (۲۲) قانون پایانه‌های فروشگاهی و سامانه مودیان است که مودی به دلیل عدم ثبت‌نام در سامانه مودیان باید بپردازد.\n\n- **بند ب ـ** کتمان معامله، بیش‌اظهاری مالیات و عوارض خرید یا کم‌اظهاری مالیات و عوارض فروش، ثبت معامله خود به نام غیر یا معامله غیر به نام خود، استناد به اسناد صوری و هر عمل دیگری که به کم‌اظهاری مالیات یا استرداد غیرواقعی منجر شود: دو برابر مالیات و عوارض پرداخت‌نشده تا موعد مقرر در ماده (۴) این قانون و در صورت تکرار تخلف قبل از دوسال، سه برابر مالیات پرداخت‌نشده.\n\n- **بند ج ـ** دریافت مالیات و عوارض توسط اشخاص غیرمجاز: دو برابر مالیات و عوارض دریافتی."},{"t":"ماده ۳۷","x":"تأخیر در پرداخت مالیات‌ها و عوارض موضوع این قانون در مواعد مقرر با رعایت مفاد ماده (۱۹۱) قانون مالیات‌های مستقیم، موجب تعلق جریمه‌ای به میزان دو درصد (۲%) در ماه، نسبت به مالیات و عوارض پرداخت‌نشده و مدت تأخیر از زمان انقضای مهلت تسلیم اظهارنامه یا سررسید پرداخت مالیات و عوارض، هر یک که مقدم باشد، خواهد بود.\n\n- **تبصره:** چنانچه مودی خارج از اراده خود امکان پرداخت مالیات و عوارض موضوع این قانون را در مواعد مقرر نداشته باشد، می‌تواند به هیأت‌های حل اختلاف مالیاتی اعتراض نماید. در صورتی که ادعای مودی با ارائه اسناد و مدارک مثبته در هیأت‌های حل اختلاف مالیاتی پذیرفته شود، جریمه مذکور بخشیده می‌شود."}]},{"h":"فصل نهم: تخصیص، انتقال و توزیع مالیات (از ماده ۳۸ تا ماده ۴۵)","a":[{"t":"ماده ۳۸","x":"مالیات و عوارض موضوع مواد (۷)، (۲۶) و (۲۸) این قانون و جریمه‌های مربوط به آنها پس از کسر کسورات قانونی، به ترتیب زیر توزیع می‌شود:\n\n۱ ـ یک‌نهم از مالیات‌ها و عوارض وصولی ماده (۷) و بندهای «الف» و «ب» ماده (۲۶) این قانون به‌عنوان مالیات سلامت به وزارت بهداشت، درمان و آموزش پزشکی اختصاص می‌یابد.\n\n۲ ـ باقی‌مانده، به نسبت مساوی سهم درآمد عمومی کشور و سهم شهرداری‌ها و دهیاری‌ها می‌باشد. سهم درآمد عمومی به عنوان مالیات به حساب خزانه‌داری کل کشور واریز می‌شود. سهم شهرداری‌ها و دهیاری‌ها به‌عنوان عوارض حسب مورد به حساب تمرکز وجوه اداره کل امور مالیاتی استان و حساب تمرکز وجوه وزارت کشور واریز می‌شود.\n\n- **تبصره:** عوارض و جریمه‌های سهم شهرداری‌ها، دهیاری‌ها و روستاهای فاقد دهیاری موضوع این قانون به حساب‌های رابطی که بنا به درخواست سازمان و وزارت کشور توسط خزانه‌داری کل کشور حسب مورد به نام حساب تمرکز وجوه اداره کل مالیاتی استان و وزارت کشور افتتاح می‌گردد، واریز می‌شود. عوارض سهم شهرداری‌ها، دهیاری‌ها و روستاهای فاقد دهیاری و جریمه‌های متعلق به آن، درآمد دولت نبوده و سازمان موظف است صددرصد (۱۰۰%) آن را مطابق با مقررات ماده (۳۹) این قانون به صورت ماهانه به حساب‌های ذی‌ربط مذکور واریز نماید."},{"t":"ماده ۳۹","x":"سهم شهرداری‌ها، دهیاری‌ها، روستاهای فاقد دهیاری و مناطق عشایری، بر اساس ترتیبات ذیل به حساب تمرکز وجوه وزارت کشور و حساب تمرکز وجوه اداره کل امور مالیاتی استان ذی‌ربط نزد خزانه‌داری کل کشور برای توزیع بین شهرداری‌ها و دهیاری‌ها واریز می‌شود:\n\n- **بند الف ـ** نود درصد (۹۰%) از عوارض و جریمه‌های مربوط به ماده (۷) و بندهای «ب» و «پ» ماده (۲۶) این قانون پس از واریز به حساب تمرکز وجوه اداره کل امور مالیاتی استان بر اساس شاخص جمعیت میان شهرداری‌ها، دهیاری‌ها، اداره امور عشایر هر شهرستان (سهم مناطق عشایری) و فرمانداری‌های همان استان (سهم روستاهای فاقد دهیاری) توزیع و ده درصد (۱۰%) مابقی به حساب تمرکز وجوه وزارت کشور واریز تا به موجب آیین‌نامه‌ای که براساس شاخص‌های توسعه‌نیافتگی سه ماه پس از لازم‌الاجراء شدن این قانون توسط سازمان برنامه و بودجه کشور و وزارت کشور تهیه می‌شود و به تصویب هیأت وزیران می‌رسد بین شهرداری‌ها، دهیاری‌ها، اداره امور عشایر شهرستان (سهم مناطق عشایری) و روستاهای فاقد دهیاری (به حساب فرمانداری‌ها) توزیع گردد.\n\n- **بند ب ـ** عوارض و جریمه‌های مربوط به بندهای «الف» و «ت» ماده (۲۶) و ماده (۲۸) این قانون به حساب تمرکز وجوه وزارت کشور واریز می‌شود تا به نسبت دوازده درصد (۱۲%) سهم کلان‌شهرها، پنجاه و سه درصد (۵۳%) سهم سایر شهرها و سی و پنج درصد (۳۵%) سهم روستاها و مناطق عشایری و بر اساس شاخص‌های جمعیت و توسعه‌نیافتگی مذکور در بند «الف» این ماده توزیع گردد. دستورالعمل اجرائی این بند توسط وزارت کشور با همکاری سازمان برنامه و بودجه کشور تهیه و ابلاغ می‌شود.\n\n- **تبصره ۱:** سهم روستاهای فاقد دهیاری به حساب فرمانداری شهرستان مربوط واریز می‌شود تا با مشارکت سایر دستگاه‌های اجرائی مربوطه برای امور عمرانی و آبادانی همان روستاها هزینه شود. دستورالعمل اجرائی این تبصره ظرف سه‌ماه پس از ابلاغ این قانون توسط وزارت کشور و وزارت امور اقتصادی و دارایی (سازمان) تصویب می‌شود.\n\n- **تبصره ۲:** سهم مناطق عشایری از عوارض و جریمه‌های مربوط به مواد (۷) و (۲۶) این قانون به اداره کل امور عشایر هر استان واریز می‌شود تا براساس شاخص جمعیت میان مناطق عشایری توزیع گردد.\n\n- **تبصره ۳:** در راستای اجرای احکام این ماده شهرهای جدید تازه تأسیس فاقد شهرداری از نظر موضوع این ماده حسب مورد واجد شهرداری تلقی می‌شوند.\n\n- **تبصره ۴:** محل أخذ مالیات ارزش افزوده واحدهای تولیدی محل استقرار آنها می‌باشد.\n\n- **تبصره ۵:** سهم شهرداری‌ها و دهیاری‌ها از محل منابع حاصل از بندهای «پ» و «ت» ماده (۲۶) این قانون باید مطابق با سیاست‌های ابلاغی شورای عالی سلامت و امنیت غذایی هزینه گردد. تصمیم‌گیری در خصوص نحوه هزینه‌کرد منابع مزبور در کلان‌شهرها برعهده کمیته‌ای متشکل از فرماندار، شهردار و نماینده وزارت بهداشت، درمان و آموزش پزشکی است.\n\n- **تبصره ۶:** هرگونه برداشت از حساب تمرکز وجوه به‌جز پرداخت به شهرداری‌ها و دهیاری‌ها و اشخاص مذکور در این ماده ممنوع است.\n\n- **تبصره ۷:** سهم عوارض ارزش افزوده دریافتی از شرکت‌های فناور مستقر در پارک‌های علم و فناوری پس از واریز به خزانه‌داری کل کشور، به صورت صد درصد (۱۰۰%) به همان پارک بابت ایجاد، توسعه و نگهداری زیرساخت‌ها و فضاهای عمومی، آموزشی، پژوهشی و فناوری و ارائه خدمات شهری اختصاص می‌یابد. آیین‌نامه اجرائی این تبصره ظرف سه ماه از تاریخ لازم‌الاجراءشدن این قانون توسط معاونت علمی و فناوری ریاست جمهوری با همکاری وزارت علوم، تحقیقات و فناوری و وزارت بهداشت، درمان و آموزش پزشکی تهیه می‌شود و به‌تصویب هیأت وزیران می‌رسد.\n\n- **تبصره ۸:** کارگروهی مرکب از وزارت کشور، سازمان و یک ناظر از مجلس شورای اسلامی برای نظارت بر حسن اجرای این ماده تشکیل و گزارش عملکرد این ماده همه‌ساله توسط سازمان و وزارت کشور به کمیسیون اقتصادی مجلس شورای اسلامی ارائه می‌گردد.\n\n- **تبصره ۹:** سازمان مکلف است در مقاطع سه‌ماهه میزان وصول مالیات بر ارزش افزوده و سهم هریک از شهرداری‌ها، دهیاری‌ها، فرمانداری‌ها و مناطق عشایری را از طرق مناسب به اطلاع عموم مردم برساند."},{"t":"ماده ۴۰","x":"عوارض و جریمه‌های آلایندگی موضوع ماده (۲۷) این قانون پس از واریز به حساب تمرکز وجوه اداره کل امور مالیاتی استان برای هر شهرستان به نسبت جمعیت بین شهرداری‌ها، دهیاری‌ها و فرمانداری‌های (سهم روستاهای فاقد دهیاری و مناطق عشایری) همان شهرستان توزیع می‌گردد. در صورتی که آلودگی واحدهای بزرگ تولیدی (پنجاه نفر و بیشتر) به بیش از یک شهرستان در یک استان سرایت کند، عوارض آلایندگی هر شهرستان به نسبت جمعیت، اثرپذیری و فاصله از واحد آلاینده، در کمیته‌ای مرکب از رئیس سازمان برنامه و بودجه استان و فرمانداران شهرستان‌های ذی‌ربط، مدیرکل محیط‌زیست و مدیرکل امور مالیاتی استان بین شهرستان‌های متأثر توزیع می‌شود.\n\n- **تبصره ۱:** در صورتی که شهرستان‌های متأثر از آلودگی در دو یا چند استان واقع شده باشند، اعضای کمیته توزیع‌کننده عوارض آلودگی واحدهای بزرگ (پنجاه نفر و بیشتر) متشکل از نماینده سازمان برنامه و بودجه کشور، رؤسای سازمان‌های مدیریت و برنامه‌ریزی استان‌های ذی‌ربط، نماینده سازمان حفاظت محیط‌زیست و نماینده ادارات کل امور مالیاتی استان‌های مربوطه براساس سیاست‌های اعلامی سازمان برنامه و بودجه کشور اقدام به توزیع عوارض آلایندگی می‌کنند.\n\n- **تبصره ۲:** عوارض و جریمه‌های آلایندگی در مناطق آزاد تجاری ـ صنعتی و ویژه اقتصادی در مواردی که شهرداری و یا دهیاری در مناطق مذکور مستقر نمی‌باشد، حسب مورد به حساب منطقه آزاد تجاری ـ صنعتی و یا ویژه اقتصادی مربوط واریز می‌گردد."},{"t":"ماده ۴۱","x":"عوارض و جریمه‌های موضوع بندهای «الف» و «ب» ماده (۲۹) این قانون مستقیماً به حساب شهرداری‌ها و یا دهیاری‌های محل سکونت مالک که هنگام صدور پلاک انتظامی ثبت شده است، واریز می‌گردد. شهرداری‌های شهرهای آلوده مکلفند صددرصد (۱۰۰%) درآمد حاصل از عوارض موضوع بند «ب» ماده (۲۹) این قانون را برای کمک به توسعه و نوسازی ناوگان حمل‌ونقل عمومی شهرهای آلوده هزینه نمایند."},{"t":"ماده ۴۲","x":"معادل دوازده در هزار ارزش گمرکی کالاهای وارداتی که حقوق ورودی آنها وصول می‌شود، توسط گمرک جمهوری اسلامی ایران به حساب تمرکز وجوه وزارت کشور واریز شده تا به نسبت سیزده درصد (۱۳%) کلان‌شهرها، سی و پنج درصد (۳۵%) دهیاری‌ها و روستاهای فاقد دهیاری و عشایر و پنجاه و دو درصد (۵۲%) سایر شهرداری‌ها و بر اساس شاخص‌هایی که با پیشنهاد وزارت کشور به تصویب هیأت دولت می‌رسد، صرف کمک و ایجاد درآمد پایدار برای شهرداری‌ها و دهیاری‌ها و روستاهای فاقد دهیاری و عشایر گردد. وزارت کشور مکلف است وصولی هر ماه را تا پانزدهم ماه بعد براساس سهم‌های تعیین‌شده به حساب شهرداری‌ها و دهیاری‌ها واریز نماید و هرگونه برداشت از حساب تمرکز وجوه به جز پرداخت به شهرداری‌ها و دهیاری‌ها و روستاهای فاقد دهیاری و عشایر ممنوع است."},{"t":"ماده ۴۳","x":"یک‌نهم مالیات‌ها و عوارض وصولی موضوع ماده (۷) و بندهای «الف» و «ب» ماده (۲۶) این قانون به‌عنوان «مالیات سلامت»، همزمان با دریافت توسط سازمان امور مالیاتی، به حساب خزانه‌داری کل کشور واریز می‌گردد. خزانه مکلف است مبالغ دریافتی هر ماه را تا پایان پانزدهم ماه بعد به حساب وزارت بهداشت، درمان و آموزش پزشکی واریز نماید. عدم تخصیص مبلغ مذکور در حکم تصرف غیرمجاز در اموال عمومی است. صد درصد (۱۰۰%) منابع دریافتی موضوع این ماده از طریق ردیف یا ردیف‌هایی که برای این منظور در قوانین بودجه سنواتی پیش‌بینی می‌شود به پیشگیری و پوشش کامل درمان افراد ساکن در روستاها و شهرهای دارای بیست هزار نفر جمعیت و پایین‌تر و جامعه عشایری (در چهارچوب نظام ارجاع)، اختصاص می‌یابد و پس از تحقق هدف مذکور نسبت به تکمیل و تأمین تجهیزات بیمارستانی و مراکز بهداشتی و درمانی با اولویت بیمارستان‌های مناطق توسعه‌نیافته، مصارف هیأت امنای ارزی و ارتقای سطح بیمه بیماران صعب‌العلاج و افراد تحت پوشش نهادهای حمایتی خارج از روستاها و شهرهای بالای بیست هزار نفر جمعیت اقدام می‌شود. هرگونه پرداخت هزینه‌های نیروی انسانی نظیر حقوق و مزایا، اضافه کار، کمک‌های رفاهی، پاداش، فوق‌العاده‌های مأموریت، کارانه، بهره‌وری، مدیریت، نوبت‌کاری، دیون و مانند آن و هزینه‌های اداری نظیر اقلام مصرفی اداری و تأمین اثاثیه و منصوبات اداری از این محل ممنوع است."},{"t":"ماده ۴۴","x":"منابع حاصل از مالیات‌های موضوع مواد (۳۰) و (۳۱) این قانون سهم دولت است و به حساب خزانه‌داری کل کشور واریز می‌شود."},{"t":"ماده ۴۵","x":"دولت موظف است از محل منابع حاصل از مالیات دریافتی سهم خود موضوع ماده (۷) این قانون، سالانه مجموع کمک‌های نقدی پرداختی به هر فرد تحت پوشش نهادهای حمایتی را علاوه بر سایر افزایش‌های سنواتی، حداقل معادل نرخ مالیات بر ارزش افزوده افزایش داده و به منظور جبران مالیات دریافتی به افراد مذکور پرداخت نماید. نهادهای حمایتی مذکور مکلفند نسبت به شناسایی اشخاص نیازمندی که تحت پوشش نیستند، اقدام و آنها را مشمول دریافت افزایش مذکور نمایند. آیین‌نامه اجرائی این ماده شامل چگونگی شناسایی اشخاص نیازمند و نحوه حمایت از آنها حداکثر سه ماه پس از لازم‌الاجراء شدن این قانون توسط وزارت تعاون، کار و رفاه اجتماعی با همکاری سازمان بهزیستی کشور و کمیته امداد امام خمینی (ره) تهیه و به تصویب هیأت وزیران می‌رسد."}]},{"h":"فصل دهم: سایر مقررات (از ماده ۴۶ تا ماده ۵۷)","a":[{"t":"ماده ۴۶","x":"کلیه عوارض و مالیات موضوع این قانون که توسط گمرک جمهوری اسلامی ایران به صورت قطعی وصول و به حساب‌های مربوطه واریز می‌شود، مشمول حکم ماده (۱۶۰) قانون امور گمرکی می‌باشد."},{"t":"ماده ۴۷","x":"پرونده‌های مالیات بر ارزش افزوده که تاریخ تعلق آنها قبل از لازم‌الاجراء شدن این قانون است، از نظر تعیین مأخذ مشمول مالیات و نرخ مالیات، جرایم و تکالیف مودیان و مأموران مالیاتی و نحوه رسیدگی تابع قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ می‌باشد، اما در مورد رفع اختلاف سازمان با مودی، قطعیت، وصول، توزیع و تسویه، تابع احکام و مقررات این قانون است."},{"t":"ماده ۴۸","x":"متن زیر جایگزین ماده (۲۳۸) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۳۸ ـ در مواردی که برگ تشخیص مالیات صادر و به مودی ابلاغ می‌شود، چنانچه مودی نسبت به آن معترض باشد می‌تواند ظرف سی‌روز از تاریخ ابلاغ شخصاً یا به وسیله وکیل تام‌الاختیار خود با ارائه دلایل و اسناد و مدارک کتباً از اداره امور مالیاتی تقاضای رسیدگی مجدد نماید.\n\n>\n\n> مسوول/مسوولان مربوط که از طرف سازمان امور مالیاتی مشخص می‌شوند، موظفند پس از ثبت درخواست مودی و ظرف مهلتی که بیش از چهل و پنج روز از تاریخ ثبت درخواست نباشد به موضوع رسیدگی و در صورتی که دلایل و اسناد و مدارک ابرازشده را برای رد مندرجات برگ تشخیص کافی دانستند، آن را رد و در صورتی که دلایل و اسناد و مدارک ابرازی را مؤثر در تعدیل درآمد تشخیص دهند موارد تعدیل درآمد مشمول مالیات را مشخص نمایند. چنانچه مودی نظر مسوول/مسوولان مربوط در تعدیل درآمد مشمول مالیات را قبول نماید درآمد مشمول مالیات تعدیل‌شده، قطعی است. در غیر این صورت برای رسیدگی به مابه‌التفاوت تا مبلغ مورد اعتراض مودی، موضوع به هیأت حل اختلاف مالیاتی ارجاع می‌شود. همچنین هرگاه دلایل و اسناد و مدارک ابرازی مودی را برای رد برگ تشخیص یا تعدیل درآمد مؤثر تشخیص ندهند باید موضوع را مستدلاً در پرونده منعکس و مراتب را برای رسیدگی به هیأت حل اختلاف مالیاتی ارجاع نمایند.\n\n>\n\n> **تبصره ۱ ـ** دستورالعمل اجرائی این ماده با پیشنهاد سازمان امور مالیاتی به تصویب وزیر امور اقتصادی و دارایی می‌رسد.\n\n>\n\n> **تبصره ۲ ـ** در مواردی که مودی اطلاعات مربوطه را از طریق سامانه مودیان اظهار کرده باشد، مطابق احکام قانون سامانه مودیان و پایانه‌های فروشگاهی رفتار خواهد شد.»"},{"t":"ماده ۴۹","x":"متن زیر جایگزین تبصره ماده (۲۳۹) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> **تبصره ـ** در مواردی که برگ تشخیص مالیات طبق مقررات تبصره (۱) و قسمت أخیر تبصره (۲) ماده (۲۰۳) و ماده (۲۰۸) این قانون ابلاغ شده باشد و مودی به شرح مقررات این ماده اقدام نکرده باشد در حکم معترض به برگ تشخیص مالیات شناخته می‌شود و پرونده امر برای رسیدگی به هیأت حل اختلاف مالیاتی ارجاع می‌گردد.»"},{"t":"ماده ۵۰","x":"متن زیر جایگزین ماده (۲۴۴) قانون مالیات‌های مستقیم و تبصره‌های آن می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۴۴ ـ مرجع رسیدگی به کلیه اختلاف‌های مالیاتی جز در مواردی که ضمن مقررات این قانون مرجع دیگری پیش‌بینی شده، هیأت حل اختلافات مالیاتی است. هر هیأت حل اختلاف مالیاتی از سه نفر به شرح زیر تشکیل می‌شود:\n\n>\n\n> ۱. یک نفر نماینده سازمان امور مالیاتی کشور؛\n\n>\n\n> ۲. یک نفر از میان قضات بازنشسته یا حقوق‌دانان مطلع در امور مالیاتی با شرط وثاقت و امانت به درخواست سازمان امور مالیاتی و انتخاب رئیس کل دادگستری هر استان؛\n\n>\n\n> ۳. یک نفر نماینده از اتاق بازرگانی، صنایع و معادن و کشاورزی ایران، اتاق تعاون ایران، جامعه حسابداران رسمی ایران، جامعه مشاوران رسمی مالیاتی ایران، مجامع حرفه‌ای، اتاق اصناف ایران، شورای اسلامی شهر، کانون وکلا، مرکز وکلا، کارشناسان رسمی و مشاوران خانواده که برای مدت سه سال منصوب می‌شوند. مودی همزمان با اعتراض به برگ تشخیص یا مطالبه مالیات یکی از مراجع این بند را به‌عنوان نماینده خود جهت شرکت در جلسات هیأت حل اختلاف مالیاتی معرفی می‌نماید. در صورتی که برگ تشخیص مالیات ابلاغ قانونی شده باشد و یا همزمان با تسلیم اعتراض به برگ تشخیص در مهلت قانونی مودی انتخاب خود را اعلام ننماید، با توجه به نوع فعالیت مودی یا موضوع مالیات مورد رسیدگی، از بین نمایندگان مزبور با رعایت تبصره (۵) این ماده یک نفر انتخاب می‌شود.\n\n>\n\n> **تبصره ۱ ـ** جلسات هیأت‌های حل اختلاف مالیاتی با حضور هر سه عضو رسمیت می‌یابد و رأی هیأت با اکثریت آراء قطعی و لازم‌الاجراء است، ولی نظر اقلیت باید در متن رأی قید گردد.\n\n>\n\n> **تبصره ۲ ـ** هیأت‌های حل اختلاف مالیاتی دارای استقلال کامل بوده و صرفاً اداره امور دبیرخانه‌ای هیأت‌های حل اختلاف مالیاتی و تشکیل جلسات هیأت‌ها به عهده سازمان امور مالیاتی می‌باشد. انشای رأی با رعایت اصل عدالت و بی‌طرفی کلیه اعضا و متکی به اسناد و مدارک مثبته و دلایل و شواهد متقن در همان جلسه و یا حداکثر ظرف سه روز کاری پس از برگزاری جلسه، توسط نماینده بند (۲) این ماده به عمل آمده و به امضای تمامی اعضا می‌رسد. مودی یا نماینده قانونی وی مجاز به حضور کامل در جلسه و ارائه دفاعیات به صورت کتبی یا شفاهی است. اظهارات شفاهی باید در صورت‌جلسه قید و به امضای وی برسد. سازمان امور مالیاتی به‌منظور اعمال نظارت مؤثر بر عملکرد هیأت‌های حل اختلاف مالیاتی، مکلف است نسبت به مستندسازی فرآیند برگزاری جلسات هیأت به نحو مقتضی اقدام کند.\n\n>\n\n> **تبصره ۳ ـ** تعیین حق‌الزحمه اعضای موضوع بندهای (۲) و (۳) این ماده متناسب با تعداد و مدت جلسات و نیز مراحل، منابع مالیاتی و پرونده‌های مورد رسیدگی از محل اعتباری که به همین منظور در بودجه سالانه سازمان امور مالیاتی کشور پیش‌بینی می‌شود، مطابق دستورالعملی است که توسط سازمان مذکور تهیه و ابلاغ می‌گردد. حق‌الزحمه اعضا به صورت متمرکز از طرف سازمان امور مالیاتی کشور به حساب اعضا پرداخت می‌شود.\n\n>\n\n> **تبصره ۴ ـ** سازمان امور مالیاتی مکلف است نمایندگان معرفی‌شده در اجرای بندهای (۲) و (۳) این ماده را به‌عنوان اعضای هیأت‌های حل اختلاف مالیاتی بپذیرد و با رعایت تبصره (۵) این ماده از آنها جهت شرکت در هیأت‌های مزبور دعوت نماید.\n\n>\n\n> **تبصره ۵ ـ** اسامی کلیه افراد معرفی‌شده توسط رئیس کل دادگستری هر استان، مدیر کل مالیاتی استان و مراجع مذکور در بند (۳) این ماده به تفکیک شهرستان‌ها در سامانه‌ای که به صورت متمرکز و حداکثر ظرف سه ماه پس از لازم‌الاجراء شدن این قانون توسط سازمان امور مالیاتی کشور ایجاد می‌شود، درج می‌گردد. انتخاب افراد موضوع بندهای (۱)، (۲) و (۳) برای هر پرونده در مواردی که در شهرستان مورد نظر بیشتر از یک نفر وجود داشته باشد، به صورت تصادفی توسط سامانه مزبور انجام می‌شود. این سامانه مستقیماً زیر نظر رئیس کل سازمان امور مالیاتی، مدیریت می‌گردد.\n\n>\n\n> **تبصره ۶ ـ** سازمان امور مالیاتی کشور مکلف است حداقل یک هفته قبل از تشکیل جلسه هیأت به نحو مقتضی زمینه دسترسی اعضای هیأت حل اختلاف مالیاتی را برابر مقررات مربوط به مندرجات پرونده مورد اعتراض فراهم نماید.\n\n>\n\n> **تبصره ۷ ـ** هر یک از افراد مذکور در بندهای (۲) و (۳) این ماده در صورتی که بیشتر از سه جلسه متوالی یا چهار جلسه متناوب در یک سال از حضور در جلسات هیأت خودداری نمایند، حکم آنان لغو می‌شود و رئیس کل دادگستری هر استان و مرجع مربوط، حسب مورد، موظف است ظرف ده روز کاری فرد جایگزین را معرفی نماید.\n\n>\n\n> **تبصره ۸ ـ** به منظور اجرای عدالت و اصل استقلال و بی‌طرفی و رعایت حقوق شهروندی و نظارت مؤثر، سازمان امور مالیاتی مکلف است ساختار اداره هیأت‌های حل اختلاف مالیاتی را به صورت مستقل، تحت عنوان مرکز دادرسی مالیاتی در ساختار خود ذیل رئیس کل سازمان ایجاد نماید. واحدهای دادرسی مالیاتی در هر استان مستقل از اداره کل مالیاتی استان تشکیل می‌شود.\n\n>\n\n> **تبصره ۹ ـ** پس از استقرار سامانه مودیان، ثبت اعتراض توسط مودی، انتخاب یکی از مراجع موضوع بند (۳) این ماده، ارائه هرگونه لایحه به هیأت‌های حل اختلاف، مشاهده اسناد، مدارک و اطلاعات مورد نیاز، ابلاغ تاریخ تشکیل جلسات هیأت، اطلاع از نتایج دادرسی و هرگونه اطلاع دیگر در خصوص پرونده دادرسی مالیاتی از طریق سامانه مذکور انجام می‌شود.\n\n>\n\n> **تبصره ۱۰ ـ** سازمان امور مالیاتی کشور مکلف است زمینه دسترسی کامل مودی و یا نماینده قانونی وی به مفاد پرونده مورد اعتراض را حداقل یک هفته قبل از تشکیل هیأت فراهم نماید.\n\n>\n\n> **تبصره ۱۱ ـ** عضویت همزمان در فهرست نمایندگان بندهای (۲) و (۳) موضوع این ماده ممنوع است.»"},{"t":"ماده ۵۱","x":"متن زیر جایگزین ماده (۲۵۱) قانون مالیات‌های مستقیم می‌شود و به این قانون تسری می‌یابد:\n\n> «ماده ۲۵۱ ـ مودی یا دادستان انتظامی مالیاتی می‌توانند ظرف دو ماه از تاریخ ابلاغ رأی قطعی هیأت حل اختلاف مالیاتی تجدیدنظر، به استناد عدم رعایت قوانین و مقررات موضوعه یا نقص رسیدگی، با اعلام دلایل کافی به شورای عالی مالیاتی اعتراض نموده و تجدید رسیدگی را درخواست کنند.»"},{"t":"ماده ۵۲","x":"در بند (۳) ماده (۲۵۵) قانون مالیات‌های مستقیم عبارت «نظر اکثریت اعضای شورای عالی مالیاتی» به عبارت «نظر اکثریت اعضای هیأت عمومی شورای‌عالی مالیاتی موضوع ماده (۲۵۸) این قانون» تغییر می‌یابد."},{"t":"ماده ۵۳","x":"تبصره ذیل به ماده (۲۵۸) قانون مالیات‌های مستقیم الحاق می‌شود:\n\n> «تبصره ـ حکم این ماده در مواردی که نسبت به موارد مشابه آرای متفاوتی توسط هیأت‌های حل اختلاف مالیاتی صادر شده باشد نیز جاری است.»"},{"t":"ماده ۵۴","x":"در تبصره (۲) ماده (۲۷۴) قانون مالیات‌های مستقیم عبارت «سازمان امور مالیاتی کشور» جایگزین عبارت «دادستانی انتظامی مالیاتی» می‌گردد. حکم این تبصره و احکام فصل نهم از باب چهارم قانون مالیات‌های مستقیم (به استثنای ماده (۲۱۷)) به این قانون تسری می‌یابد."},{"t":"ماده ۵۵","x":"از تاریخ لازم‌الاجراء شدن این قانون، احکام مربوط به مالیات و عوارض در قوانین زیر نسخ می‌گردد:\n\n1. قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ با اصلاحات و الحاقات بعدی (به استثنای حکم ماده (۲۸) قانون مذکور نسبت به جامعه مشاوران رسمی مالیاتی ایران، ماده (۵۰) قانون مذکور و تبصره‌های ذیل آن و تبصره (۱) ماده (۳۹) آن قانون نسبت به عوارض موضوع بند (۲) ماده (۳۸) این قانون)؛\n\n2. بند «ب» ماده (۶) و بند «ر» ماده (۳۳) و ماده (۷۳) و ماده (۹۴) قانون برنامه پنج‌ساله ششم توسعه اقتصادی، اجتماعی و فرهنگی جمهوری اسلامی ایران مصوب ۱۳۹۵/۱۲/۱۴؛\n\n3. ماده (۶۹) قانون الحاق برخی مواد به قانون تنظیم بخشی از مقررات مالی دولت (۲) مصوب ۱۳۹۳/۱۲/۰۴؛\n\n4. احکام ماده (۳۴) قانون رفع موانع تولید رقابت‌پذیر و ارتقای نظام مالی کشور مصوب ۱۳۹۴/۰۲/۰۱ در خصوص مالیات بر ارزش افزوده؛\n\n5. مواد (۱۸) و (۴۷) قانون اصلاح نظام صنفی کشور مصوب ۱۳۹۲/۰۶/۱۲."},{"t":"ماده ۵۶","x":"اجرای احکام این قانون نافی اجرای احکام و مقررات ذیل نیست:\n\n1. قانون برنامه پنج‌ساله ششم توسعه اقتصادی، اجتماعی و فرهنگی جمهوری اسلامی ایران مصوب ۱۳۹۵/۱۲/۱۴ با اصلاحات و الحاقات بعدی؛ (به استثنای موارد منسوخ در ماده (۵۵) این قانون، بند «ب» ماده (۶)، بند «ر» ماده (۳۳)، ماده (۷۳) و ماده (۹۴) قانون مذکور)\n\n2. قانون مالیات‌های مستقیم مصوب ۱۳۶۶/۱۲/۳ با اصلاحات و الحاقات بعدی؛\n\n3. قانون مقررات تردد وسایل نقلیه خارجی مصوب ۱۳۷۳/۴/۱۲ با اصلاحات و الحاقات بعدی؛\n\n4. عوارض آزادراه‌ها، عوارض موضوع ماده (۱۲) قانون حمل و نقل و عبور کالاهای خارجی از قلمرو جمهوری اسلامی ایران مصوب ۱۳۷۴/۱۲/۲۲ با اصلاحات و الحاقات بعدی؛\n\n5. قانون نحوه تأمین هزینه‌های اتاق‌های بازرگانی و صنایع و معادن جمهوری اسلامی ایران و اتاق تعاون مصوب ۱۳۷۲/۸/۱۱ با اصلاحات و الحاقات بعدی؛\n\n6. مواد (۶۳) و (۸۷) قانون وصول برخی از درآمدهای دولت و مصرف آن در موارد معین مصوب ۱۳۷۳/۱۲/۲۸ با اصلاحات و الحاقات بعدی؛\n\n7. قانون امور گمرکی مصوب ۱۳۹۰/۸/۲۲ با اصلاحات و الحاقات بعدی؛ (به استثنای تعریف حقوق ورودی و سایر وجوه موضوع بند «د» ماده (۱))\n\n8. مواد (۶۵)، (۵۸) و (۷۰) قانون الحاق برخی مواد به قانون تنظیم بخشی از مقررات مالی دولت (۲) مصوب ۱۳۹۳/۱۲/۴ با اصلاحات و الحاقات بعدی؛\n\n9. بندهای «الف» و «ب» ماده (۳۰) و بند (۳) ماده (۴۸) قانون احکام دائمی برنامه‌های توسعه کشور مصوب ۱۳۹۵/۱۱/۱۰ با اصلاحات و الحاقات بعدی؛\n\n10. تبصره (۵) بند «الف» ماده (۲۸) قانون رفع موانع تولید رقابت‌پذیر و ارتقای نظام مالی کشور مصوب ۱۳۹۴/۲/۱؛\n\n11. ماده (۷) قانون توسعه ابزارها و نهادهای مالی جدید به منظور تسهیل اجرای سیاست‌های کلی اصل چهل و چهارم (۴۴) قانون اساسی مصوب ۱۳۸۸/۹/۲۵؛\n\n12. قانون توسعه و حمایت از صنایع دریایی مصوب ۱۳۸۷/۲/۱۵."},{"t":"ماده ۵۷","x":"این قانون شش ماه پس از ابلاغ به رئیس جمهور لازم‌الاجراء است.\n\n**تبصره ـ** تا تاریخ لازم‌الاجراء شدن این قانون، قانون مالیات بر ارزش افزوده مصوب ۱۳۸۷/۰۲/۱۷ با اصلاحات و الحاقات بعدی تمدید می‌شود و لازم‌الاجراء است.\n\n\nقانون فوق مشتمل بر پنجاه و هفت ماده و یکصد تبصره در جلسه علنی روز یکشنبه مورخ دوم خردادماه یکهزار و چهارصد مجلس شورای اسلامی تصویب شد و در تاریخ ۱۴۰۰/۰۳/۱۲ به تأیید شورای نگهبان رسیده."}]}];
